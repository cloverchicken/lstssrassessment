east one scientific text or data display explained accurately; reliability of at least one external source judged and compared with own findings.", "Meets P, and communication is concise and audience-appropriate, integrating text, graphs and diagrams; questions answered precisely."]}], "label": "MS Assessment form – Grade 8 (Tier 2)"}, "HS": {"domains": [{"code": "A", "name": "Asking questions", "indicator": "Develop and justify a precise, testable scientific question derived from models, theories, or piror studies that specifies the mechanism or relationship to be investigated, defines variables operationally, judges feasibility with available resources, and is refined by probing its own assumptions.", "evidence": "Critical-appraisal forms and annotated bibliography (Stage 1); problem statement, rationale and question revision history (Stage 2).", "checkpoints": "Wk 3 diagnostic; Wk 5 question approval.", "levels": ["Question is broad, not measurable, or not linked to any model, theory, or prior study.", "Testable question with measurable variables, but the link to theory or prior studies, the operational definitions, or the feasibility justification is weak.", "Precise, testable question derived from models, theories or prior studies (≥5 reviewed sources) that specifies the mechanism or relationship; variables defined operationally; feasibility justified; refinement documented, including at least one assumption of the question probed and revised.", "Meets P, and the question addresses an unresolved question, inconsistency or untested context in the reviewed sources, or a gap original to the wider field."]}, {"code": "B", "name": "Developing models", "indicator": "Develop, evaluate, and refine scientific models by constructing detailed representations of complex systems, comparing multiple models to explain phenomena, analyzing model assumptions and limitations, and using evidence-based reasoning to improve model accuracy and support problem-solving.", "evidence": "Annotated conceptual model + one additional model type (Stage 3); model revision based on data (Stages 4–5).\nNote:  Minimum evidence: an annotated conceptual model plus one additional model type (mathematical, physical, or computational), revised in light of the data.", "checkpoints": "Wk 9 proposal review; Wk 13 approval gate; Wk 31 summative; Wk 43 final review", "levels": ["Only one simple model; assumptions not stated.", "Conceptual model plus another model type, but comparison or evaluation of assumptions is superficial.", "Annotated conceptual model plus one additional model type; strengths and weaknesses compared, choice justified, assumptions evaluated, and model revised using the data.", "Meets P, and models are iteratively refined and used to make quantitative predictions tested against the data."]}, {"code": "C", "name": "Planning investigations", "indicator": "Design and conduct rigorous scientific investigations (experimental, quasi-experimental, correlational, or field) by formulating theory-based, testable hypotheses that involve more than 1 variable or ans interaction and state what result would refute them; selecting appropriate data, tools, and measurement methods evaluated for precision and reliability; planning reliable data collection with regard to prcision, accuracy, and sample size; identifying variables or factors and controlling cofounders; and implementing documented, reproducible procedures with required risk assessnebt and ethics approval.", "evidence": "Research proposal, risk assessment, ethics/consent documents, pilot notes (Stage 3); research log, protocol-modification record, mid-point report (Stage 4).\nNote: Justify sampling and sample size, pilot-test procedures, and document all protocol deviations; data collection begins only after the proposal, risk assessment, and ethics review are approved.", "checkpoints": "Wk 9 proposal review; Wk 13 approval gate; Wk 18 log audit.", "levels": ["Proposal lacks a justified design, variables, or approvals; data collection inconsistent.", "Variables/factors and controls identified, but the refutation criterion, sampling/sample size, or reliability is not justified; deviations partly documented.", "Theory-based hypothesis involving more than one variable or an interaction and stating what result would refute it; design (experimental, quasi-experimental, correlational, or field) matched to the question; variables or factors identified with controls for key confounders (for experiments: IV, DV and at least three controlled variables); justified sampling and sample size; pilot-tested; approved proposal, risk assessment and ethics documents; all deviations logged; procedure reproducible.", "Meets P, and randomization/blinding or equivalent controls are used; protocol adapted rigorously when issues arise, with evidence of improved data quality."]}, {"code": "D", "name": "Analyzing data", "indicator": "Analyze and interpret complex data using descriptive statistics with uncertainty plus at least one justified inferential or relational technique, e.g., t-test/ANOVA, chi-square, correlation/regression; qualitativve projects use systematic coding plus at least one quantified component. Evaluate conclusion with effect sizes, distinguishing correlation from causationa and stating the uncertainty; evaluate anomalies and conflicting evidence and propose revisions to models or designs; and generate new hypotheses from identified patterns.", "evidence": "Analysis file with statistical outputs and analysis-justification note; draft results section (Stage 5); Results and Discussion of the revised paper (Stage 6)", "checkpoints": "Wk 31 provisional; Wk 42 final paper, Wk 43 final review", "levels": ["Only descriptive summaries, or calculation errors; conclusions overstated.", "Descriptive statistics with uncertainty are correct, but the inferential/relational technique is missing, unjustified, or misinterpreted.", "Descriptive statistics with SD/SE/error bars plus at least one justified inferential or relational technique interpreted correctly (p-value and effect size, conceptually); correlation distinguished from causation and uncertainty stated; qualitative projects use systematic coding plus at least one quantified component; anomalies treated transparently; strength and limitations of the conclusion assessed; new questions proposed.", "Meets P, and test assumptions are checked, alternative analyses compared, or uncertainty quantified in a way that materially strengthens the conclusions."]}, {"code": "E", "name": "Constructing explanations", "indicator": "Construct and defend scientific explanations by integrating theories, models, and multiple sources of evidence; analyze causal mechanisms and interacting factors; evaluate the strength of supporting evidence and reasoning; and refine explanations by addressing limitations, alternative interpretations, and gaps in evidence.", "evidence": "Discussion section of the paper (Stage 6); oral defense and reflection essay (Stage 7).", "checkpoints": "Wk 36 draft; Wk 42 final paper; Wk 43 defense.", "levels": ["Explanation not supported by own evidence or theory.", "Explanation links evidence and theory, but the causal mechanism or alternatives are underdeveloped.", "CER explanation integrating theory, model(s) and own evidence; causal mechanism explained; limitations and at least one alternative interpretation addressed; defended with evidence in the panel Q&A.", "Meets P, and synthesizes multiple sources of evidence and models into a nuanced account; anticipates critique convincingly."]}, {"code": "F", "name": "Communicating information", "indicator": "Communicate and critically evaluate scientific information by integrating multiple representations, interpreting scientific literature and complex data, producing an IMRaD research paper, poster, and oral presentation that follow scientific conventions and referencing, and assessing the validity, reliability, and implications of scientific claims and findings.", "evidence": "Appraisal forms (Stage 1); full paper with peer-review responses, poster and presentation (Stage 6).", "checkpoints": "Wk 3 diagnostic; Wk 36 draft; Wk 42 final paper.", "levels": ["Paper incomplete or not in IMRaD form; sources not appraised.", "Complete IMRaD paper, but representations or referencing inconsistent; literature appraisal mostly descriptive.", "Complete IMRaD paper with abstract, captioned figures/tables and correct referencing; peer-review responses documented; clear poster and presentation; key concepts and data of the reviewed sources interpreted accurately; source appraisal assesses validity, reliability and methodology.", "Meets P, and writing approaches publication quality, integrating literature to contextualize findings and discussing broader implications."]}], "label": "HS Assessment form – Grade 10 (Tier 4)"}}, "guideNote": "Use with Guidelines Table 3 (E/D/P/Ex). Tick the level whose descriptor is fully met; if between two levels, tick the lower. Proficient descriptors contain the core demand of the target tier in SR Standards 2026. Nothing listed as “not required” in the learning design’s Knowledge boundary may be used to lower a score, but a learning design may not remove the core demand of the target-tier descriptor. When choosing between two levels, also consider the degree of independence described in Table 3.", "ld": {"G8": {"stages": [{"stage": "1. Foundations", "weeks": "Weeks 1–4", "start": 1, "end": 4, "primary": "F. Communicating Information", "supporting": "A. Asking Questions", "indicators": "Read and explain key ideas from age-appropriate scientific texts and data representations (F2); identify major features of scientific writing and communication (F3); make basic judgments about the validity and potential bias of selected scientific or media reports (F4); distinguish evidence/fact-based questions from opinion-based questions (A2).", "boundary": "Teacher-selected, age-appropriate examples from different research fields. Students work with accessible scientific texts, excerpts, tables, diagrams, graphs, and media reports. Full critical appraisal of complete primary research articles is not required; evaluation focuses on whether data, hypotheses, and conclusions are reasonably supported.", "K": "- Common research methods and the types of research questions they are suited to address. \n- Major components and features of a basic research report. \n- Common forms of scientific evidence and data representation. \n- Basic distinctions between evidence/fact-based and opinion-based questions.", "U": "- Scientific claims are trustworthy only to the extent that they are backed by evidence others can examine; not every question can be answered scientifically.", "D": "- Compare research examples and identify the research question, method, data/evidence, and conclusion. \n- Interpret basic scientific texts, tables, diagrams, and graphs. \n- Distinguish scientific from nonscientific questions and give a basic reason for the distinction. \n- Recognize the main features of a research report. \n- Make a basic judgment about whether the data presented reasonably support a hypothesis or conclusion.", "evidence": "- Research-reading journal: analysis template for 2–3 research examples (question – method – evidence – conclusion).\n- Question-sorting task (scientific vs. nonscientific; fact- vs. opinion-based) with reasons.", "checkpoint": "Week 4 – Diagnostic check on F and A (MS form, formative only). Students scoring ≤2 on domain F or A (judged mainly from F2 and A2 evidence) receive a guided re-reading task during Weeks 5–6."}, {"stage": "2. Problem Identification", "weeks": "Weeks 5–6", "start": 5, "end": 6, "primary": "A. Asking Questions", "supporting": "E. Constructing Explanations", "indicators": "Formulate “why” questions about phenomena or problems (A1); refine questions based on observations or initial investigations (A3); ask follow-up questions to clarify, elaborate on, or further examine scientific ideas or arguments (A4); identify features, patterns, or contradictions in observations and ask targeted questions about them (A5); identify potential gaps or weaknesses in explanations (E4). In design-oriented projects (e.g., Energy, Robotics), define a simple design problem with several criteria for success and constraints on materials, time, or cost (A1).", "boundary": "Research problems and questions are developed within a teacher-provided topic or context. Students are not expected to identify an original research gap, demonstrate novelty, or independently establish a new research topic. Questions should be investigable using methods and resources appropriate to G8 and accessible in the school context.", "K": "- Research problem and research question.\n- Characteristics of an investigable research question.\n- Roles of observations and initial investigations in refining questions.\n- Purposes of follow-up questions and questions arising from patterns, contradictions, or unexpected observations.", "U": "- Research questions become more useful when they are refined in response to observations and initial investigations.", "D": "- Formulate a research problem and an initial research question from a teacher-provided topic.\n- Refine the research question based on observations or an initial investigation.\n- Ask follow-up questions to clarify or further examine an idea or argument.\n- Ask questions about patterns, contradictions, or unexpected observations.", "evidence": "- Question log: observation notes, initial question, refined question with revision history, follow-up questions.", "checkpoint": "Week 6 – Teacher approves the research question (A, formative). Domain A ≤2 → revision conference before Week 7; flagged for remediation."}, {"stage": "3. Method Development", "weeks": "Weeks 7–8", "start": 7, "end": 8, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Formulate a hypothesis or prediction based on relevant scientific ideas, models, or evidence when appropriate (C1); determine what data are needed, select suitable tools, and decide how measurements or observations will be recorded (C2); plan an experimental or field-research procedure and identify relevant independent, dependent, and control variables where applicable (C4); recognize factors other than the independent variable that could affect the results and identify which of them must be kept the same as controlled variables (C5). Construct a labeled diagram or model of the system or set-up showing key components, variables/factors, and their relationships (B1), and use it to explain the expected result (B2).", "boundary": "Methods are limited to those appropriate for G8 and feasible within the selected field and school context. For experimental investigations, students identify independent, dependent, and relevant control variables; for other approaches, appropriate factors, parameters, or data sources may be identified instead. Tools and procedures should be accessible to G8 students. Every project produces at least one model (e.g., labeled system diagram, process flowchart, physical model, or simple mathematical relationship) as required evidence for Domain B; formal conceptual frameworks or advanced methodological justification are not required. Only school-approved materials and procedures may be used; a teacher-checked risk assessment is required before data collection, projects involving people (e.g., surveys, observations, behavioural tasks) require informed consent (with parental consent for participants under 18), voluntary participation with the right to withdraw, anonymity and confidentiality, teacher-approved questions or tasks, minimal psychological risk, and a debrief where participants are not told the full purpose in advance. Projects with living organisms follow school biosafety rules: BSL-1 microorganisms only, under teacher supervision, with school-approved culturing and disposal procedures.", "K": "- Basic principles of experimental/research design.\n- Hypothesis and prediction.\n- Independent, dependent, and control variables, or other relevant factors where appropriate.\n- Types of data and appropriate data-collection/measurement tools.\n- Factors other than the independent variable that could affect the results, and which of them to keep the same as controlled variables.\n- Purposes of models (representing, explaining, predicting) and how to label components and relationships.\n- Basic laboratory/field safety, risk assessment, and voluntary/anonymous participation for surveys.", "U": "- Different research questions require different investigation methods, and a fair investigation requires careful alignment among the question, method, relevant variables or factors, and the data to be collected.", "D": "- Formulate a hypothesis/prediction when appropriate.\n- Select an investigation method appropriate to the research question.\n- Determine what data are needed and how they will be collected and recorded.\n- Identify relevant variables/factors and other factors that could affect the results.\n- Decide which factors must be kept the same as controlled variables.\n- Design a fair and feasible investigation.\n- Use a model or diagram when it meaningfully supports the investigation.\n- Complete a risk assessment (and participation plan where relevant) before data collection.", "evidence": "- Research plan (template): hypothesis/prediction, variables/factors table, data-table design, procedure, tools.\n- Labeled model/diagram of the system or set-up.\n- Risk assessment (and survey/participation plan if relevant).", "checkpoint": "Week 8 – Plan approval gate: no data collection until plan, model, and risk assessment are approved. C and B scored formatively; domains ≤2 → plan conference and revision at the start of Week 9."}, {"stage": "4. Data Collection", "weeks": "Weeks 9–12", "start": 9, "end": 12, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Use appropriate tools and recording procedures to gather the required data (C2); record measurements or observations accurately with units, identify limitations of the measurement techniques, and note obvious sources of error (C3); carry out the planned procedure consistently while managing relevant variables or factors (C4); keep the identified controlled variables the same during data collection (C5). In design-oriented investigations, test models or designs and use observed results to compare or refine solutions where appropriate (B4).", "boundary": "Students collect manageable data sets using school-accessible instruments, observation/survey tools, or other field-appropriate methods. Repeated trials and systematic data collection are not required; measurements or observations are recorded accurately with units. Students are expected to identify obvious limitations and note obvious sources of error; formal uncertainty analysis, error propagation, or advanced reliability analysis is not required. All safety conditions in the approved risk assessment must be followed throughout data collection.", "K": "- Accurate recording of measurements and observations with units. \n- Measurement or data-collection limitations and common sources of error. \n- Relevant variables/factors and possible confounding influences. \n- Consistency in implementing an investigation procedure.", "U": "- The quality of evidence is determined while it is being collected: errors or inconsistencies that are not recorded at the time cannot be corrected afterwards.", "D": "- Carry out a fair investigation according to the agreed plan. \n- Use selected tools and recording procedures appropriately. \n- Record observations and measurements accurately with units. \n- Monitor relevant variables/factors and record important deviations from the plan. \n- Identify and note obvious sources of error and factors that may affect the results.\n- Follow the approved safety procedures at all times.", "evidence": "- Dated research logbook with raw data tables, deviations, and error notes.\n- Photos of the set-up.\n- For design projects: test records of each prototype version.", "checkpoint": "Week 10 – Logbook check (C, formative). Students at ≤2 complete or correct their records (units, deviations, error notes) with teacher guidance in Weeks 11–12. Week 12 – raw data submitted."}, {"stage": "5. Analysis", "weeks": "Weeks 13–14", "start": 13, "end": 14, "primary": "D. Analyzing Data", "supporting": "E. Constructing Explanations", "indicators": "Analyze patterns and trends in data systematically using logical reasoning (D1); identify conflicts between data and expectations, evaluate possible causes, and propose evidence-based explanations (D2); use appropriate computational tools to organize, visualize, and interpret data through tables and graphs (D3); state a conclusion that answers the question, support it with specific data values, and say whether the data support or contradict the prediction (D4); synthesize patterns and relationships to generate predictions, hypotheses, or directions for further investigation (D5). Support emerging explanations with specific pieces of evidence (E2); use appropriate scientific concepts or causal reasoning where relevant (E1, E3). Identify limitations of their model or diagram (e.g., scale, missing details, assumptions) in light of the data (B3); compare findings with published or media reports on the same topic and discuss their reliability (F4).", "boundary": "Analysis uses methods appropriate to G8 and the research context, such as tables, graphs, comparisons, percentages, averages/basic calculations, or basic qualitative categorization where appropriate. Spreadsheet or graphing tools may be used to organize, visualize, and interpret data. Advanced inferential statistics or specialized analytical software are not expected.", "K": "- Methods for organizing, analyzing, and interpreting data. \n- Patterns, trends, relationships, discrepancies, and unexpected results.\n- Appropriate tables, graphs, and basic computational tools. \n- Stating a conclusion supported by specific data values. \n- Relationship between data, evidence, explanation, and conclusion.\n- Limitations of models (scale, missing details, assumptions).", "U": "- Patterns in data become evidence only when they are analyzed systematically; unexpected or conflicting results are information to be explained, not errors to be ignored.", "D": "- Organize and represent data appropriately. \n- Identify and describe patterns, trends, or relationships. \n- Compare results with the hypothesis, prediction, or initial expectation. \n- Examine unexpected or conflicting results and propose plausible evidence-based explanations. \n- State a conclusion supported by specific data values and say whether the data support or contradict the prediction. \n- Use identified patterns to suggest a prediction, hypothesis, or possible direction for further investigation.\n- Identify at least one limitation of their model in light of the data.\n- Compare their findings with a published or media source and comment on agreement and reliability.", "evidence": "- Analysis workbook (spreadsheet tables and graphs).\n- Written analysis: patterns, comparison with prediction, anomalies, model-limitation note, comparison with an external source.", "checkpoint": "Week 14 – Provisional D score (and B via model-limitation note) recorded on the MS form; confirmed at the Week 18 portfolio review together with the report (Stage 6). Where a remediation output is re-scored, the higher of the two scores is recorded. Any A–D domain ≤2 → remediation plan agreed with the student; remediation tasks completed alongside report writing in Weeks 15–16."}, {"stage": "6. Communication", "weeks": "Weeks 15–16", "start": 15, "end": 16, "primary": "F. Communicating Information", "supporting": "E. Constructing Explanations", "indicators": "Communicate findings using words, tables, diagrams, graphs, and mathematical expressions where appropriate (F1); recognize and apply major features of scientific writing and speaking to communicate research findings (F3); construct explanations using appropriate scientific concepts and link them to evidence and models where relevant (E1); use specific scientific evidence to support or refute an explanation (E2); provide causal explanations appropriate to students’ level of scientific knowledge where relevant (E3).", "boundary": "A complete research report at G8 level communicates the investigation coherently, including the research problem/question, method, data/results, and evidence-based explanation/conclusion, with other components adapted to the research field. Students use scientific conventions appropriate to G8; a formal journal-style research article is not expected.", "K": "- Major structure and features of a complete G8 research report. \n- Features of scientific written and oral communication. \n- Appropriate use of text, tables, graphs, diagrams, and mathematical representations. \n- Relationship among data/evidence, scientific concepts, explanations, and conclusions.", "U": "- Effective scientific communication lets an audience follow the path from question to evidence to conclusion and judge the conclusion for themselves.", "D": "- Construct an evidence-based explanation of the findings. \n- Select specific evidence that supports or challenges the explanation. \n- Produce a complete G8-level research report. \n- Use appropriate text and data representations to communicate findings clearly. \n- Prepare an oral/visual presentation of the research findings.\n- Include the model/diagram and explain how the results support, change, or limit it.", "evidence": "- Complete G8 research report.\n- Presentation slides or poster.\n- Remediation task outputs (if flagged).\n- Results and discussion sections of the report are the second piece of evidence for Domain D (D1, D4, D5).", "checkpoint": "Week 16 – Report submitted; E and F scored. Remediation outputs re-scored for flagged A–D domains."}, {"stage": "7. Showcase & Reflection", "weeks": "Week 17-18", "start": 17, "end": 18, "primary": "E. Constructing Explanations", "supporting": "F. Communicating Information", "indicators": "Use scientific evidence to support or refute explanations when responding to questions (E2); identify gaps or weaknesses in their own or others’ explanations (E4); communicate research findings and explanations through appropriate oral, written, and visual representations (F1, F3).", "boundary": "Reflection focuses on the quality of the evidence-based explanation: whether claims are supported by evidence, where the explanation is incomplete or weak, and how it could reasonably be improved. Students are not expected to conduct sophisticated methodological critique or formally defend research at a professional level.", "K": "- Criteria for an evidence-based explanation. \n- Common gaps or weaknesses in scientific explanations. \n- Ways evidence and feedback can be used to strengthen research communication and explanations.", "U": "- Scientific explanations become stronger when their weaknesses are identified and claims are reconsidered in light of evidence and constructive feedback.", "D": "- Present the completed research clearly. \n- Respond to questions by referring to specific evidence from the investigation. \n- Identify a gap or weakness in their own or others’ explanation. \n- Explain how the evidence supports, challenges, or limits a conclusion. \n- Suggest a reasonable revision or improvement to strengthen the explanation or research communication.", "evidence": "- Showcase presentation (Q&A notes or recording).\n- Peer-feedback forms.\n- Written reflection with a revision proposal.\n- Complete evidence portfolio.", "checkpoint": "Week 18 – Summative portfolio review on the MS Assessment form (Tier 2): final A–F scores and proficiency decision (Guidelines, Section 3). Remaining domains ≤2 recorded as remediation targets for G9. Before the Week 18 decisions, teachers of the grade calibrate on two anonymised sample portfolios, and at least 10% of portfolios (including all borderline decisions) are second-marked."}], "notes": ["Target: Tier 2 (Applies with some independence).", "Context: Guided field exploration.", "Independence: Students make selected research decisions within teacher-provided topics/contexts.", "Complexity: School-accessible methods, manageable datasets, basic scientific representations and reporting.", "Outcome: Students can formulate/refine questions, plan and conduct investigations, analyze evidence, construct explanations, and communicate findings across different research contexts."], "fields": ["Mathematics", "Energy: Sustainable Materials & Design", "Materials Science", "Microbiology", "Robotics & Intelligent Machines", "Behavioral & Social Science: Cognitive & Social Psychology", "Earth & Environmental Sciences", "Behavioral & Social Science: Society & Human Culture"]}, "G10": {"stages": [{"stage": "1. Foundations", "weeks": "Weeks 1-3", "start": 1, "end": 3, "primary": "F. Communicating Information", "supporting": "A. Asking Questions", "indicators": "Critically read and interpret scientific texts, tables, and diagrams, explaining key scientific concepts (F2); engage critically with primary research and advanced scientific reports, evaluating their validity and methodology (F4); recognize and apply the conventions of scientific writing (F3); differentiate scientific questions that require empirical data from those that rely on theoretical analysis (A2).", "boundary": "Students read primary research articles and review articles selected or approved by the teacher in the field of their intended project (about 5–8 sources). They evaluate alignment among problem, method, evidence, and conclusion and identify methodological strengths and weaknesses. Not required: systematic reviews or meta-analyses, evaluation of statistical models beyond grade-level mathematics, or a publishable literature review.", "K": "- Structure and conventions of primary research and review articles.\n- Research designs: experimental, quasi-experimental, correlational, observational/field, survey, design-based.\n- Validity (internal/external), reliability, and reproducibility.\n- Common sources of bias (sampling, measurement, confirmation, publication).\n- Search strategies, source credibility, and citation (APA/IEEE).\n- Empirical vs. theoretical research questions.", "U": "- Scientific knowledge is built through rigorous investigation, critical evaluation of evidence, and scholarly communication.", "D": "- Analyze published research papers.\n- Evaluate strengths and weaknesses of studies.\n- Identify research gaps, patterns, and unanswered questions.\n- Maintain an annotated bibliography with full citations.", "evidence": "- Critical-appraisal forms for at least 3 articles.\n- Annotated bibliography (5–8 sources).", "checkpoint": "Week 3 – Diagnostic scoring of F and A (HS form, formative). Students at ≤2 redo a guided appraisal with teacher feedback in Weeks 4–5."}, {"stage": "2. Problem Identification", "weeks": "Weeks 4-5", "start": 4, "end": 5, "primary": "A. Asking Questions", "supporting": "E. Constructing Explanations", "indicators": "Formulate questions derived from models, theories, or prior studies that specify the mechanism or relationship to be investigated; in design-oriented projects, define a design problem with multiple criteria and constraints and prioritize them (A1); develop and justify precise, testable questions linked to theory-based hypotheses, defining variables operationally and judging feasibility with available resources (A3); ask probing questions that expose the assumptions, premises, and potential biases behind an argument, a data interpretation, or their own research question, and use them to refine the question (A4); identify contradictions across data sets or studies and construct questions whose answers would resolve them, specifying the evidence required (A5); critically evaluate the validity of explanations, identifying and addressing gaps or weaknesses (E4).", "boundary": "The research problem is derived from the sources reviewed in Foundations: students identify an unresolved question, an inconsistency, or an untested local context within those sources and justify its significance and feasibility. Questions must be feasible with school or partner resources within Weeks 6–23. Not required: demonstrating originality in the wider field or a comprehensive literature review (Tier 5 / G11–12). Scoring: locating a gap or inconsistency is the task, but Domain A is scored against the Tier 4 descriptors; a student is not scored down for failing to find a genuine gap in the wider literature (gap-based questions are Tier 5 in A1 and A3).", "K": "- Research problem, research question, objectives, and scope.\n- Types of research gaps (contextual, methodological, conflicting evidence).\n- Criteria for a precise, testable question: measurable variables, feasibility, ethical acceptability.\n- Writing a problem statement and rationale.", "U": "- Meaningful research advances understanding by addressing questions that have not yet been fully answered.", "D": "- Conduct a focused preliminary literature review building on the Foundations sources.\n- Identify gaps or inconsistencies across the reviewed sources.\n- Formulate and refine a research question.\n- Justify the significance and feasibility of the study.", "evidence": "- Problem statement and rationale (about 1 page) with citations.\n- Research question with revision history.", "checkpoint": "Week 5 – Research-question approval (A, formative). Domain A ≤2 → revision conference; the question must be approved before Method Development begins."}, {"stage": "3. Method Development", "weeks": "Weeks 6-13", "start": 6, "end": 13, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Develop hypotheses that involve more than one variable or an interaction, are grounded in a theoretical model, and state what result would refute them (C1); determine relevant data to collect, evaluating the precision and reliability of tools and methods (C2); strategically plan data collection, considering how precision, accuracy, and sample size affect validity and reliability (C3); design experimental, quasi-experimental, correlational, or field studies appropriate to the question, clearly identifying variables or factors, with fully documented procedures, a risk assessment, and the required ethics approval (C4); analyze the potential impact of confounding variables and apply appropriate controls (C5). Construct detailed, annotated diagrams of the system (B1); explain the phenomenon using multiple models, comparing their strengths and weaknesses and justifying the choice (B2); evaluate model assumptions and propose evidence-based improvements (B3); in design-oriented projects, develop and iteratively refine models to test design aspects (B4).", "boundary": "Students select and justify their research design, sampling, and measurement methods, and develop a conceptual model plus at least one other model type (e.g., mathematical, physical, computational) as required evidence for Domain B. A research proposal, risk assessment, and ethics review must be approved before data collection: human-participant studies require informed consent (parental consent for minors), voluntary participation with the right to withdraw, anonymity and confidentiality, minimal psychological risk, a debrief where relevant, and approval by the supervising teacher or school review panel; microbiology work is limited to BSL-1 organisms under supervision; hazardous chemicals, sharps, and unsupervised fieldwork are not permitted without an approved risk assessment. Not required: formal power analysis, validated psychometric scale development, or multivariate designs beyond two factors. A simple two-factor design (or one manipulated variable plus a measured moderator) is expected when it is needed to test the C1 hypothesis.", "K": "- Research designs and when to use them; randomization, control groups, blinding (where feasible).\n- Sampling methods and sample-size considerations.\n- Validity, reliability, accuracy, precision, and uncertainty.\n- Operational definitions and measurement instruments (including questionnaire design where relevant).\n- Confounding variables and control strategies.\n- Types of models (conceptual, mathematical, physical, computational) and their assumptions.\n- Research ethics (informed consent, confidentiality, organism-handling rules) and risk assessment.", "U": "- A well-designed investigation minimizes bias, generates valid evidence, and enables meaningful interpretation of results.", "D": "- Develop theory-informed hypotheses that state what result would refute them.\n- Design a rigorous investigation.\n- Select appropriate tools, sampling methods, and measurements.\n- Construct and justify models or conceptual frameworks.\n- Complete a risk assessment and ethics review (consent forms where relevant).\n- Pilot-test instruments and procedures.", "evidence": "- Research proposal: hypothesis, design, variables table, sampling, instruments, analysis plan.\n- Annotated conceptual model + one additional model type.\n- Risk assessment; ethics/consent documents.\n- Pilot-test notes.", "checkpoint": "Week 9 – Proposal draft review (peer + teacher; C and B formative). Week 13 – Approval gate: no data collection without an approved proposal, risk assessment, and ethics documents. Domains ≤2 at Week 9 → revision cycle in Weeks 10–13, re-checked at the Week 13 gate."}, {"stage": "4. Data Collection", "weeks": "Weeks 14-23", "start": 14, "end": 23, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Collect and record data using tools and methods evaluated for precision and reliability (C2); carry out the data-collection plan while monitoring how precision, accuracy, and sample size affect reliability (C3); implement documented, reproducible procedures with controlled variables (C4); monitor confounding variables and apply controls during implementation (C5); iteratively refine models or designs based on data-driven outcomes and feedback (B4).", "boundary": "Students independently implement procedures and may adapt protocols when unexpected issues arise while maintaining research integrity. All adaptations are logged and approved by the supervising teacher; the safety and ethics conditions of the approved proposal remain binding. Not required: formal error propagation beyond grade-level mathematics or professional-grade instrumentation.", "K": "- Research-log conventions and data management (versioning, backups, raw vs. processed data).\n- Random and systematic error; instrument uncertainty.\n- Protocol deviations and how to document them.\n- Data integrity, confidentiality, and ethical data handling.", "U": "- Reliable evidence requires systematic implementation of research procedures and continuous monitoring of data quality.", "D": "- Conduct independent investigations.\n- Implement data collection protocols.\n- Monitor reliability and validity.\n- Document modifications and unexpected observations.\n- Maintain comprehensive research records.", "evidence": "- Research log (dated entries, deviations, uncertainty notes).\n- Raw data files.\n- Protocol-modification record.\n- Mid-point progress report.", "checkpoint": "Week 18 – Mid-point progress report and log audit (C, formative). Domain C ≤2 → corrective plan (additional trials/sampling) completed by Week 23."}, {"stage": "5. Analysis", "weeks": "Weeks 24-31", "start": 24, "end": 31, "primary": "D. Analyzing Data", "supporting": "E. Constructing Explanations", "indicators": "Analyze data using measures of variability and uncertainty and appropriate inferential or relational techniques (e.g., t-test, chi-square, correlation/regression) or systematic qualitative coding (D1); critically evaluate conflicting data and propose revisions to models or experimental designs (D2); employ specialized software or tools to analyze data and explore variable relationships in depth (D3); evaluate conclusions using inferential statistics and effect sizes, distinguishing correlation from causation and stating the uncertainty (D4); recognize complex patterns in data that suggest deeper relationships worth investigating (D5). Critically analyze evidence and models to support or challenge explanations (E2).", "boundary": "Analysis uses descriptive statistics with measures of spread and uncertainty (standard deviation, standard error, error bars) and at least one inferential or relational technique matched to the design: t-test or one-way ANOVA to compare group means; chi-square for categorical data; correlation/linear regression for relationships; thematic coding for qualitative data. Tools: spreadsheet analysis tools or software such as JASP, jamovi, Python, or R where available. Students justify the choice of technique and interpret p-values and effect sizes conceptually. Not required: multivariate or Bayesian methods, or derivation of statistical formulas. Qualitative projects: thematic coding meets D1, but D4 at Tier 4 requires inferential reasoning with effect sizes, so qualitative projects include at least one quantified component (e.g., theme frequencies compared across groups with chi-square, or a short closed-item questionnaire), or use an alternative D4 criterion approved in advance as a documented exception.", "K": "- Descriptive statistics and uncertainty (SD, standard error, error bars).\n- Choosing a technique: t-test/ANOVA, chi-square, correlation/regression, qualitative coding.\n- Assumptions of tests; p-values and effect size (conceptual).\n- Outliers and anomalies: identification and justified treatment.\n- Correlation vs. causation; uncertainty and limitations of conclusions.", "U": "- Data interpretation requires critical evaluation of evidence, not simply identifying patterns.", "D": "- Analyze data using appropriate quantitative or qualitative techniques.\n- Evaluate anomalies and conflicting evidence.\n- Assess the strength of findings.\n- Generate new hypotheses or future research directions.\n- Justify the choice of statistical or analytical technique.", "evidence": "- Analysis file (raw → processed data, statistical outputs).\n- Draft results section with figures.\n- Analysis-justification note.", "checkpoint": "Week 31 – Provisional D score (and B from model revision) recorded on the HS form; confirmed at the Week 43 portfolio review together with the paper (Stage 6). Where a remediation output is re-scored, the higher of the two scores is recorded. Any A–D domain ≤2 → remediation plan; remediation completed in Weeks 32–36 alongside drafting."}, {"stage": "6. Communication", "weeks": "Weeks 32-42", "start": 32, "end": 42, "primary": "F. Communicating Information", "supporting": "E. Constructing Explanations", "indicators": "Communicate understanding of complex systems using a variety of representations, including tables, graphs, and mathematical expressions (F1); present detailed reports and presentations that adhere to scientific writing standards, including evidence (F3); construct detailed explanations using models, theories, and evidence (E1); offer nuanced causal explanations that reflect deeper scientific understanding (E3).", "boundary": "Students communicate findings using discipline-appropriate scientific conventions and engage critically with feedback and alternative interpretations. Work proceeds through structured drafting cycles within the existing weeks: full draft (Week 36), structured peer review (Week 37), revision (Weeks 38–40), poster and presentation rehearsal (Weeks 41–42). A school template is used. Not required: journal  HS:{domains:[

 G8:{notes:["Bậc mục tiêu: Bậc 2 (Vận dụng với mức độ độc lập nhất định).","Bối cảnh: Khám phá lĩnh vực có hướng dẫn.","Mức độ độc lập: Học sinh đưa ra một số quyết định nghiên cứu trong chủ đề/bối cảnh giáo viên giao.","Độ phức tạp: Phương pháp phù hợp điều kiện trường, bộ dữ liệu vừa sức, biểu diễn và báo cáo khoa học cơ bản.","Kết quả đầu ra: Học sinh có thể đặt/điều chỉnh câu hỏi, lập kế hoạch và tiến hành nghiên cứu, phân tích bằng chứng, xây dựng giải thích và truyền đạt kết quả trong các bối cảnh nghiên cứu khác nhau."],
  checkpoints:["Tuần 4 – Kiểm tra chẩn đoán F và A (phiếu MS, chỉ quá trình). Học sinh đạt ≤ 2 ở F hoặc A (chủ yếu dựa trên minh chứng F2 và A2) làm nhiệm vụ đọc lại có hướng dẫn trong tuần 5–6.","Tuần 6 – Giáo viên duyệt câu hỏi nghiên cứu (A, quá trình). A ≤ 2 → trao đổi chỉnh sửa trước tuần 7; đánh dấu cần bồi dưỡng.","Tuần 8 – Cổng duyệt kế hoạch: chưa thu thập dữ liệu khi kế hoạch, mô hình và đánh giá rủi ro chưa được duyệt. Chấm quá trình C và B; lĩnh vực ≤ 2 → trao đổi và chỉnh sửa kế hoạch đầu tuần 9.","Tuần 10 – Kiểm tra sổ nghiên cứu (C, quá trình). Học sinh ≤ 2 hoàn thiện hoặc sửa lại ghi chép (đơn vị, sai lệch, ghi chú sai số) với hướng dẫn của giáo viên trong tuần 11–12. Tuần 12 – nộp dữ liệu thô.","Tuần 14 – Ghi điểm tạm D (và B qua ghi chú hạn chế của mô hình) trên phiếu MS; xác nhận tại đánh giá hồ sơ tuần 18 cùng với báo cáo (Giai đoạn 6). Khi sản phẩm bồi dưỡng được chấm lại, ghi điểm cao hơn. Lĩnh vực A–D ≤ 2 → thống nhất kế hoạch bồi dưỡng với học sinh; hoàn thành song song với viết báo cáo trong tuần 15–16.","Tuần 16 – Nộp báo cáo; chấm E và F. Chấm lại sản phẩm bồi dưỡng của các lĩnh vực A–D đã đánh dấu.","Tuần 18 – Đánh giá tổng kết hồ sơ trên phiếu MS (Bậc 2): điểm cuối A–F và kết luận mức (Hướng dẫn, Mục 3). Lĩnh vực còn ≤ 2 ghi làm mục tiêu bồi dưỡng cho lớp 9. Trước khi kết luận tuần 18, giáo viên khối hiệu chuẩn trên hai hồ sơ mẫu ẩn danh, và ít nhất 10% hồ sơ (gồm mọi trường hợp sát ngưỡng) được chấm lần hai."]},
 G10:{notes:["Bậc mục tiêu: Bậc 4 (Phân tích và đánh giá tốt).","Bối cảnh: Nghiên cứu độc lập có giám sát trong lĩnh vực tự chọn.","Mức độ độc lập: Học sinh tự xác định vấn đề từ tài liệu, tự thiết kế, tiến hành và phân tích nghiên cứu, với các cổng phê duyệt ở tuần 5, 13 và 31.","Độ phức tạp: Giả thuyết dựa trên lý thuyết, chọn mẫu có lập luận, thống kê suy luận phù hợp trình độ, bài báo IMRaD, poster và bảo vệ miệng.","Kết quả đầu ra: Học sinh có thể lập kế hoạch, tiến hành, phân tích và bảo vệ một nghiên cứu đúng đạo đức, có phương pháp vững chắc, đồng thời đánh giá hạn chế và ý nghĩa của nó."],
  checkpoints:["Tuần 3 – Chấm chẩn đoán F và A (phiếu HS, quá trình). Học sinh ≤ 2 làm lại phiếu đánh giá có hướng dẫn và phản hồi của giáo viên trong tuần 4–5.","Tuần 5 – Duyệt câu hỏi nghiên cứu (A, quá trình). A ≤ 2 → trao đổi chỉnh sửa; câu hỏi phải được duyệt trước khi bắt đầu Xây dựng phương pháp.","Tuần 9 – Rà soát bản nháp đề cương (bạn học + giáo viên; C và B quá trình). Tuần 13 – Cổng phê duyệt: chưa thu thập dữ liệu khi đề cương, đánh giá rủi ro và hồ sơ đạo đức chưa được duyệt. Lĩnh vực ≤ 2 ở tuần 9 → chu kỳ chỉnh sửa tuần 10–13, kiểm tra lại ở cổng tuần 13.","Tuần 18 – Báo cáo giữa kỳ và kiểm tra sổ nghiên cứu (C, quá trình). C ≤ 2 → kế hoạch khắc phục (bổ sung thí nghiệm/mẫu) hoàn thành trước tuần 23.","Tuần 31 – Ghi điểm tạm D (và B từ việc chỉnh sửa mô hình) trên phiếu HS; xác nhận tại đánh giá hồ sơ tuần 43 cùng với bài báo (Giai đoạn 6). Khi sản phẩm bồi dưỡng được chấm lại, ghi điểm cao hơn. Lĩnh vực A–D ≤ 2 → kế hoạch bồi dưỡng; hoàn thành trong tuần 32–36 song song với viết bản nháp.","Tuần 36 – Chấm quá trình bản nháp (E, F). Tuần 42 – Nộp bài báo cuối; chấm E và F; chấm lại sản phẩm bồi dưỡng của các lĩnh vực đã đánh dấu.","Tuần 43 – Đánh giá tổng kết hồ sơ trên phiếu HS (Bậc 4): điểm cuối A–F và kết luận mức (Hướng dẫn, Mục 3). Lĩnh vực còn ≤ 2 chuyển làm mục tiêu cho lớp 11. Hiệu chuẩn trên hai hồ sơ mẫu ẩn danh và chấm lần hai ít nhất 10% hồ sơ (gồm mọi trường hợp sát ngưỡng) diễn ra trước tuần 43 và được xếp vào lịch khóa học."]},

LD_VI.G8.detail=[{"indicators": "Đọc và giải thích ý chính từ văn bản khoa học và biểu diễn dữ liệu phù hợp lứa tuổi (F2); nhận biết các đặc điểm chính của văn bản và giao tiếp khoa học (F3); đưa ra nhận định cơ bản về tính hợp lệ và thiên lệch tiềm ẩn của một số báo cáo khoa học hoặc bài báo truyền thông được chọn (F4); phân biệt câu hỏi dựa trên bằng chứng/sự thật với câu hỏi dựa trên ý kiến (A2).", "boundary": "Ví dụ phù hợp lứa tuổi do giáo viên chọn từ các lĩnh vực nghiên cứu khác nhau. Học sinh làm việc với văn bản khoa học dễ tiếp cận, đoạn trích, bảng, sơ đồ, đồ thị và bài báo truyền thông. Không yêu cầu đánh giá phê phán đầy đủ toàn bộ bài báo nghiên cứu gốc; việc đánh giá tập trung vào dữ liệu, giả thuyết và kết luận có được hỗ trợ hợp lý hay không.", "K": "- Các phương pháp nghiên cứu phổ biến và loại câu hỏi nghiên cứu mà mỗi phương pháp phù hợp.\n- Các thành phần và đặc điểm chính của một báo cáo nghiên cứu cơ bản.\n- Các dạng bằng chứng khoa học và biểu diễn dữ liệu phổ biến.\n- Phân biệt cơ bản giữa câu hỏi dựa trên bằng chứng/sự thật và câu hỏi dựa trên ý kiến.", "U": "- Nhận định khoa học chỉ đáng tin khi được hỗ trợ bởi bằng chứng mà người khác có thể kiểm tra; không phải câu hỏi nào cũng trả lời được bằng khoa học.", "D": "- So sánh các ví dụ nghiên cứu và xác định câu hỏi nghiên cứu, phương pháp, dữ liệu/bằng chứng và kết luận.\n- Diễn giải văn bản khoa học, bảng, sơ đồ và đồ thị cơ bản.\n- Phân biệt câu hỏi khoa học với câu hỏi phi khoa học và nêu lý do cơ bản.\n- Nhận biết các đặc điểm chính của một báo cáo nghiên cứu.\n- Đưa ra nhận định cơ bản về việc dữ liệu có hỗ trợ hợp lý cho giả thuyết hoặc kết luận hay không.", "evidence": "- Nhật ký đọc nghiên cứu: mẫu phân tích cho 2–3 ví dụ nghiên cứu (câu hỏi – phương pháp – bằng chứng – kết luận).\n- Nhiệm vụ phân loại câu hỏi (khoa học / phi khoa học; dựa trên sự thật / ý kiến) có nêu lý do."}, {"indicators": "Đặt câu hỏi “tại sao” về hiện tượng hoặc vấn đề (A1); điều chỉnh câu hỏi dựa trên quan sát hoặc tìm hiểu ban đầu (A3); đặt câu hỏi tiếp nối để làm rõ, mở rộng hoặc xem xét thêm ý tưởng, lập luận khoa học (A4); nhận ra đặc điểm, quy luật hoặc mâu thuẫn trong quan sát và đặt câu hỏi có trọng tâm về chúng (A5); nhận ra khoảng trống hoặc điểm yếu tiềm ẩn trong lời giải thích (E4). Với đề tài thiên về thiết kế (ví dụ Năng lượng, Robot), xác định một vấn đề thiết kế đơn giản với một số tiêu chí thành công và ràng buộc về vật liệu, thời gian hoặc chi phí (A1).", "boundary": "Vấn đề và câu hỏi nghiên cứu được xây dựng trong chủ đề hoặc bối cảnh do giáo viên cung cấp. Không yêu cầu học sinh tìm ra khoảng trống nghiên cứu mới, chứng minh tính mới hoặc tự đề xuất một chủ đề nghiên cứu mới. Câu hỏi phải tìm hiểu được bằng phương pháp và nguồn lực phù hợp lớp 8 và sẵn có trong trường.", "K": "- Vấn đề nghiên cứu và câu hỏi nghiên cứu.\n- Đặc điểm của một câu hỏi nghiên cứu có thể tìm hiểu được.\n- Vai trò của quan sát và tìm hiểu ban đầu trong việc điều chỉnh câu hỏi.\n- Mục đích của câu hỏi tiếp nối và câu hỏi nảy sinh từ quy luật, mâu thuẫn hoặc quan sát bất ngờ.", "U": "- Câu hỏi nghiên cứu trở nên hữu ích hơn khi được điều chỉnh dựa trên quan sát và tìm hiểu ban đầu.", "D": "- Xác định vấn đề nghiên cứu và câu hỏi nghiên cứu ban đầu từ chủ đề giáo viên giao.\n- Điều chỉnh câu hỏi nghiên cứu dựa trên quan sát hoặc tìm hiểu ban đầu.\n- Đặt câu hỏi tiếp nối để làm rõ hoặc xem xét thêm một ý tưởng hay lập luận.\n- Đặt câu hỏi về quy luật, mâu thuẫn hoặc quan sát bất ngờ.", "evidence": "- Sổ câu hỏi: ghi chép quan sát, câu hỏi ban đầu, câu hỏi đã điều chỉnh kèm lịch sử chỉnh sửa, các câu hỏi tiếp nối."}, {"indicators": "Xây dựng giả thuyết hoặc dự đoán dựa trên ý tưởng, mô hình hoặc bằng chứng khoa học liên quan khi phù hợp (C1); xác định dữ liệu cần thu, chọn công cụ phù hợp và quyết định cách ghi phép đo hoặc quan sát (C2); lập quy trình thí nghiệm hoặc nghiên cứu thực địa và xác định biến độc lập, phụ thuộc và kiểm soát khi phù hợp (C4); nhận diện các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả và xác định yếu tố nào cần giữ nguyên làm biến kiểm soát (C5). Xây dựng sơ đồ hoặc mô hình có chú thích của hệ thống hoặc bố trí thí nghiệm, thể hiện các thành phần chính, biến/yếu tố và mối quan hệ giữa chúng (B1), và dùng nó để giải thích kết quả dự kiến (B2).", "boundary": "Phương pháp giới hạn trong phạm vi phù hợp lớp 8 và khả thi trong lĩnh vực đã chọn và điều kiện của trường. Với nghiên cứu thực nghiệm, học sinh xác định biến độc lập, phụ thuộc và các biến kiểm soát liên quan; với cách tiếp cận khác, có thể xác định các yếu tố, tham số hoặc nguồn dữ liệu phù hợp. Công cụ và quy trình phải phù hợp với học sinh lớp 8. Mỗi đề tài có ít nhất một mô hình (ví dụ sơ đồ hệ thống có chú thích, lưu đồ quy trình, mô hình vật lý hoặc quan hệ toán học đơn giản) làm minh chứng bắt buộc cho lĩnh vực B; không yêu cầu khung khái niệm chính thức hay lập luận phương pháp nâng cao. Chỉ dùng vật liệu và quy trình được trường cho phép; cần đánh giá rủi ro được giáo viên kiểm tra trước khi thu thập dữ liệu. Đề tài có người tham gia (ví dụ khảo sát, quan sát, nhiệm vụ hành vi) cần đồng thuận có hiểu biết (có đồng ý của phụ huynh với người tham gia dưới 18 tuổi), tham gia tự nguyện và có quyền rút lui, ẩn danh và bảo mật, câu hỏi hoặc nhiệm vụ được giáo viên duyệt, rủi ro tâm lý tối thiểu, và giải thích sau nghiên cứu khi người tham gia không được biết đầy đủ mục đích từ trước. Đề tài có sinh vật sống tuân theo quy định an toàn sinh học của trường: chỉ vi sinh vật BSL-1, có giáo viên giám sát, quy trình nuôi cấy và tiêu hủy được trường phê duyệt.", "K": "- Nguyên tắc cơ bản của thiết kế thí nghiệm/nghiên cứu.\n- Giả thuyết và dự đoán.\n- Biến độc lập, phụ thuộc và kiểm soát, hoặc các yếu tố liên quan khác khi phù hợp.\n- Các loại dữ liệu và công cụ thu thập/đo lường phù hợp.\n- Các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả, và yếu tố nào cần giữ nguyên làm biến kiểm soát.\n- Mục đích của mô hình (biểu diễn, giải thích, dự đoán) và cách chú thích thành phần, mối quan hệ.\n- An toàn cơ bản trong phòng thí nghiệm/thực địa, đánh giá rủi ro, và sự tham gia tự nguyện/ẩn danh trong khảo sát.", "U": "- Mỗi câu hỏi nghiên cứu cần phương pháp tìm hiểu khác nhau, và một nghiên cứu công bằng đòi hỏi sự tương thích chặt chẽ giữa câu hỏi, phương pháp, các biến hoặc yếu tố liên quan và dữ liệu cần thu.", "D": "- Xây dựng giả thuyết/dự đoán khi phù hợp.\n- Chọn phương pháp tìm hiểu phù hợp với câu hỏi nghiên cứu.\n- Xác định dữ liệu cần thu và cách thu thập, ghi chép.\n- Xác định các biến/yếu tố liên quan và các yếu tố khác có thể ảnh hưởng đến kết quả.\n- Quyết định yếu tố nào cần giữ nguyên làm biến kiểm soát.\n- Thiết kế một nghiên cứu công bằng và khả thi.\n- Dùng mô hình hoặc sơ đồ khi nó thực sự hỗ trợ nghiên cứu.\n- Hoàn thành đánh giá rủi ro (và kế hoạch tham gia khi cần) trước khi thu thập dữ liệu.", "evidence": "- Kế hoạch nghiên cứu (theo mẫu): giả thuyết/dự đoán, bảng biến/yếu tố, thiết kế bảng dữ liệu, quy trình, công cụ.\n- Mô hình/sơ đồ có chú thích của hệ thống hoặc bố trí thí nghiệm.\n- Đánh giá rủi ro (và kế hoạch khảo sát/tham gia nếu có)."}, {"indicators": "Dùng công cụ và cách ghi chép phù hợp để thu dữ liệu cần thiết (C2); ghi phép đo hoặc quan sát chính xác, có đơn vị, nhận diện giới hạn của kỹ thuật đo và ghi chú các nguồn sai số rõ ràng (C3); thực hiện quy trình đã lập một cách nhất quán, quản lý các biến hoặc yếu tố liên quan (C4); giữ nguyên các biến kiểm soát đã xác định trong khi thu thập dữ liệu (C5). Với nghiên cứu thiên về thiết kế, thử nghiệm mô hình hoặc thiết kế và dùng kết quả quan sát để so sánh hoặc cải tiến giải pháp khi phù hợp (B4).", "boundary": "Học sinh thu thập bộ dữ liệu vừa sức bằng dụng cụ sẵn có ở trường, công cụ quan sát/khảo sát hoặc phương pháp phù hợp lĩnh vực. Không yêu cầu lặp thí nghiệm và thu thập dữ liệu có hệ thống; phép đo hoặc quan sát được ghi chính xác, có đơn vị. Học sinh cần nhận ra các giới hạn rõ ràng và ghi chú các nguồn sai số rõ ràng; không yêu cầu phân tích độ không đảm bảo chính thức, lan truyền sai số hay phân tích độ tin cậy nâng cao. Mọi điều kiện an toàn trong đánh giá rủi ro đã duyệt phải được tuân thủ suốt quá trình thu thập dữ liệu.", "K": "- Ghi chép phép đo và quan sát chính xác, có đơn vị.\n- Giới hạn của kỹ thuật đo hoặc thu thập dữ liệu và các nguồn sai số phổ biến.\n- Các biến/yếu tố liên quan và các yếu tố có thể gây nhiễu.\n- Tính nhất quán khi thực hiện quy trình nghiên cứu.", "U": "- Chất lượng bằng chứng được quyết định ngay trong lúc thu thập: sai sót hoặc bất nhất không được ghi lại kịp thời thì không thể sửa về sau.", "D": "- Tiến hành nghiên cứu công bằng theo kế hoạch đã thống nhất.\n- Dùng công cụ và cách ghi chép đã chọn một cách phù hợp.\n- Ghi quan sát và phép đo chính xác, có đơn vị.\n- Theo dõi các biến/yếu tố liên quan và ghi lại các sai lệch quan trọng so với kế hoạch.\n- Nhận diện và ghi chú các nguồn sai số rõ ràng và các yếu tố có thể ảnh hưởng đến kết quả.\n- Luôn tuân thủ quy trình an toàn đã được duyệt.", "evidence": "- Sổ nghiên cứu ghi ngày, có bảng dữ liệu thô, sai lệch và ghi chú sai số.\n- Ảnh chụp bố trí thí nghiệm.\n- Với đề tài thiết kế: hồ sơ thử nghiệm từng phiên bản mẫu."}, {"indicators": "Phân tích quy luật và xu hướng trong dữ liệu một cách có hệ thống bằng lập luận logic (D1); nhận ra mâu thuẫn giữa dữ liệu và dự đoán, đánh giá nguyên nhân có thể và đề xuất giải thích dựa trên bằng chứng (D2); dùng công cụ tính toán phù hợp để sắp xếp, trực quan hóa và diễn giải dữ liệu qua bảng và đồ thị (D3); nêu kết luận trả lời câu hỏi, dẫn chứng bằng giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán (D4); tổng hợp quy luật và mối quan hệ để đưa ra dự đoán, giả thuyết hoặc hướng nghiên cứu tiếp theo (D5). Hỗ trợ lời giải thích ban đầu bằng bằng chứng cụ thể (E2); dùng khái niệm khoa học hoặc lập luận nhân quả phù hợp khi cần (E1, E3). Nhận diện hạn chế của mô hình hoặc sơ đồ (ví dụ tỉ lệ, chi tiết thiếu, giả định) dựa trên dữ liệu (B3); so sánh kết quả với báo cáo đã công bố hoặc bài báo truyền thông cùng chủ đề và thảo luận độ tin cậy của chúng (F4).", "boundary": "Phân tích dùng phương pháp phù hợp lớp 8 và bối cảnh nghiên cứu, như bảng, đồ thị, so sánh, phần trăm, trung bình/phép tính cơ bản, hoặc phân loại định tính cơ bản khi phù hợp. Có thể dùng bảng tính hoặc công cụ vẽ đồ thị để sắp xếp, trực quan hóa và diễn giải dữ liệu. Không yêu cầu thống kê suy luận nâng cao hay phần mềm phân tích chuyên dụng.", "K": "- Phương pháp sắp xếp, phân tích và diễn giải dữ liệu.\n- Quy luật, xu hướng, mối quan hệ, sự khác biệt và kết quả bất ngờ.\n- Bảng, đồ thị và công cụ tính toán cơ bản phù hợp.\n- Nêu kết luận được hỗ trợ bằng giá trị dữ liệu cụ thể.\n- Mối quan hệ giữa dữ liệu, bằng chứng, giải thích và kết luận.\n- Hạn chế của mô hình (tỉ lệ, chi tiết thiếu, giả định).", "U": "- Quy luật trong dữ liệu chỉ trở thành bằng chứng khi được phân tích có hệ thống; kết quả bất ngờ hoặc mâu thuẫn là thông tin cần giải thích, không phải lỗi để bỏ qua.", "D": "- Sắp xếp và biểu diễn dữ liệu phù hợp.\n- Nhận ra và mô tả quy luật, xu hướng hoặc mối quan hệ.\n- So sánh kết quả với giả thuyết, dự đoán hoặc kỳ vọng ban đầu.\n- Xem xét kết quả bất ngờ hoặc mâu thuẫn và đề xuất giải thích hợp lý dựa trên bằng chứng.\n- Nêu kết luận được hỗ trợ bằng giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán.\n- Dùng quy luật đã nhận ra để đề xuất dự đoán, giả thuyết hoặc hướng nghiên cứu tiếp theo.\n- Nêu ít nhất một hạn chế của mô hình dựa trên dữ liệu.\n- So sánh kết quả với một nguồn đã công bố hoặc nguồn truyền thông và nhận xét về sự phù hợp và độ tin cậy.", "evidence": "- Tệp phân tích (bảng và đồ thị trên bảng tính).\n- Phần phân tích viết: quy luật, so sánh với dự đoán, điểm bất thường, ghi chú hạn chế của mô hình, so sánh với một nguồn bên ngoài."}, {"indicators": "Truyền đạt kết quả bằng chữ viết, bảng, sơ đồ, đồ thị và biểu thức toán học khi phù hợp (F1); nhận biết và vận dụng các đặc điểm chính của văn bản và trình bày khoa học để truyền đạt kết quả nghiên cứu (F3); xây dựng giải thích bằng khái niệm khoa học phù hợp và liên kết với bằng chứng, mô hình khi cần (E1); dùng bằng chứng khoa học cụ thể để ủng hộ hoặc bác bỏ một lời giải thích (E2); đưa ra giải thích nhân quả phù hợp trình độ kiến thức khoa học của học sinh khi cần (E3).", "boundary": "Một báo cáo nghiên cứu hoàn chỉnh ở lớp 8 trình bày nghiên cứu một cách mạch lạc, gồm vấn đề/câu hỏi nghiên cứu, phương pháp, dữ liệu/kết quả và giải thích/kết luận dựa trên bằng chứng, các phần khác điều chỉnh theo lĩnh vực nghiên cứu. Học sinh dùng quy ước khoa học phù hợp lớp 8; không yêu cầu bài báo khoa học theo chuẩn tạp chí.", "K": "- Cấu trúc và đặc điểm chính của một báo cáo nghiên cứu lớp 8 hoàn chỉnh.\n- Đặc điểm của giao tiếp khoa học bằng văn bản và lời nói.\n- Sử dụng phù hợp văn bản, bảng, đồ thị, sơ đồ và biểu diễn toán học.\n- Mối quan hệ giữa dữ liệu/bằng chứng, khái niệm khoa học, giải thích và kết luận.", "U": "- Giao tiếp khoa học hiệu quả giúp người nghe đi theo được con đường từ câu hỏi đến bằng chứng và kết luận, và tự đánh giá được kết luận.", "D": "- Xây dựng lời giải thích kết quả dựa trên bằng chứng.\n- Chọn bằng chứng cụ thể ủng hộ hoặc thách thức lời giải thích.\n- Viết một báo cáo nghiên cứu hoàn chỉnh ở mức lớp 8.\n- Dùng văn bản và biểu diễn dữ liệu phù hợp để truyền đạt kết quả rõ ràng.\n- Chuẩn bị bài trình bày miệng/trực quan về kết quả nghiên cứu.\n- Đưa mô hình/sơ đồ vào báo cáo và giải thích kết quả ủng hộ, làm thay đổi hoặc giới hạn mô hình như thế nào.", "evidence": "- Báo cáo nghiên cứu lớp 8 hoàn chỉnh.\n- Slide trình bày hoặc poster.\n- Sản phẩm nhiệm vụ bồi dưỡng (nếu được đánh dấu).\n- Phần kết quả và thảo luận của báo cáo là minh chứng thứ hai cho lĩnh vực D (D1, D4, D5)."}, {"indicators": "Dùng bằng chứng khoa học để ủng hộ hoặc bác bỏ lời giải thích khi trả lời câu hỏi (E2); nhận ra khoảng trống hoặc điểm yếu trong giải thích của mình hoặc người khác (E4); truyền đạt kết quả và giải thích nghiên cứu bằng các hình thức nói, viết và trực quan phù hợp (F1, F3).", "boundary": "Phản tư tập trung vào chất lượng của lời giải thích dựa trên bằng chứng: nhận định có được bằng chứng hỗ trợ không, lời giải thích chưa đầy đủ hoặc yếu ở đâu, và có thể cải thiện hợp lý như thế nào. Không yêu cầu học sinh phản biện phương pháp chuyên sâu hay bảo vệ nghiên cứu ở mức chuyên nghiệp.", "K": "- Tiêu chí của một lời giải thích dựa trên bằng chứng.\n- Các khoảng trống hoặc điểm yếu thường gặp trong giải thích khoa học.\n- Cách dùng bằng chứng và phản hồi để củng cố việc truyền đạt và giải thích nghiên cứu.", "U": "- Lời giải thích khoa học trở nên vững chắc hơn khi điểm yếu được nhận ra và nhận định được xem xét lại dựa trên bằng chứng và phản hồi mang tính xây dựng.", "D": "- Trình bày rõ ràng nghiên cứu đã hoàn thành.\n- Trả lời câu hỏi bằng cách dẫn bằng chứng cụ thể từ nghiên cứu.\n- Nêu một khoảng trống hoặc điểm yếu trong giải thích của mình hoặc người khác.\n- Giải thích bằng chứng ủng hộ, thách thức hoặc giới hạn kết luận như thế nào.\n- Đề xuất chỉnh sửa hoặc cải tiến hợp lý để củng cố lời giải thích hoặc việc truyền đạt nghiên cứu.", "evidence": "- Bài trình bày trưng bày (ghi chép hỏi đáp hoặc bản ghi).\n- Phiếu phản hồi của bạn học.\n- Bài phản tư viết có đề xuất chỉnh sửa.\n- Hồ sơ minh chứng hoàn chỉnh."}];
LD_VI.G10.detail=[{"indicators": "Đọc và diễn giải phê phán văn bản khoa học, bảng và sơ đồ, giải thích các khái niệm khoa học then chốt (F2); tiếp cận phê phán nghiên cứu gốc và báo cáo khoa học nâng cao, đánh giá tính hợp lệ và phương pháp luận (F4); nhận biết và vận dụng quy ước của văn bản khoa học (F3); phân biệt câu hỏi khoa học cần dữ liệu thực nghiệm với câu hỏi dựa trên phân tích lý thuyết (A2).", "boundary": "Học sinh đọc các bài báo nghiên cứu gốc và bài tổng quan do giáo viên chọn hoặc duyệt, thuộc lĩnh vực dự định nghiên cứu (khoảng 5–8 nguồn). Học sinh đánh giá sự tương thích giữa vấn đề, phương pháp, bằng chứng và kết luận, và nhận ra điểm mạnh, điểm yếu về phương pháp. Không yêu cầu: tổng quan hệ thống hoặc phân tích gộp, đánh giá mô hình thống kê vượt quá toán học của cấp học, hay tổng quan tài liệu đủ chuẩn công bố.", "K": "- Cấu trúc và quy ước của bài báo nghiên cứu gốc và bài tổng quan.\n- Các thiết kế nghiên cứu: thực nghiệm, bán thực nghiệm, tương quan, quan sát/thực địa, khảo sát, dựa trên thiết kế.\n- Tính hợp lệ (bên trong/bên ngoài), độ tin cậy và khả năng lặp lại.\n- Các nguồn thiên lệch phổ biến (chọn mẫu, đo lường, xác nhận, công bố).\n- Chiến lược tìm kiếm, độ tin cậy của nguồn và trích dẫn (APA/IEEE).\n- Câu hỏi nghiên cứu thực nghiệm và câu hỏi lý thuyết.", "U": "- Tri thức khoa học được xây dựng qua nghiên cứu chặt chẽ, đánh giá phê phán bằng chứng và giao tiếp học thuật.", "D": "- Phân tích các bài báo nghiên cứu đã công bố.\n- Đánh giá điểm mạnh, điểm yếu của các nghiên cứu.\n- Nhận ra khoảng trống nghiên cứu, quy luật và các câu hỏi chưa được trả lời.\n- Duy trì thư mục có chú giải với trích dẫn đầy đủ.", "evidence": "- Phiếu đánh giá phê phán cho ít nhất 3 bài báo.\n- Thư mục có chú giải (5–8 nguồn)."}, {"indicators": "Đặt câu hỏi xuất phát từ mô hình, lý thuyết hoặc nghiên cứu trước, nêu rõ cơ chế hoặc mối quan hệ cần khảo sát; với đề tài thiên về thiết kế, xác định vấn đề thiết kế với nhiều tiêu chí và ràng buộc và xếp thứ tự ưu tiên (A1); xây dựng và lập luận cho câu hỏi chính xác, kiểm chứng được, gắn với giả thuyết dựa trên lý thuyết, định nghĩa biến theo cách đo được và đánh giá tính khả thi với nguồn lực sẵn có (A3); đặt câu hỏi thăm dò làm rõ giả định, tiền đề và thiên lệch tiềm ẩn đằng sau một lập luận, một cách diễn giải dữ liệu hoặc câu hỏi nghiên cứu của chính mình, và dùng chúng để điều chỉnh câu hỏi (A4); nhận ra mâu thuẫn giữa các bộ dữ liệu hoặc nghiên cứu và xây dựng câu hỏi mà câu trả lời sẽ giải quyết mâu thuẫn, nêu rõ bằng chứng cần có (A5); đánh giá phê phán tính hợp lệ của lời giải thích, nhận ra và xử lý khoảng trống hoặc điểm yếu (E4).", "boundary": "Vấn đề nghiên cứu xuất phát từ các nguồn đã đọc trong giai đoạn Nền tảng: học sinh xác định một câu hỏi chưa được giải quyết, một điểm mâu thuẫn hoặc một bối cảnh địa phương chưa được kiểm chứng trong các nguồn đó, và lập luận về ý nghĩa và tính khả thi. Câu hỏi phải khả thi với nguồn lực của trường hoặc đối tác trong tuần 6–23. Không yêu cầu: chứng minh tính mới đối với lĩnh vực rộng hơn hay tổng quan tài liệu toàn diện (Bậc 5 / lớp 11–12). Chấm điểm: việc tìm khoảng trống hoặc mâu thuẫn là nhiệm vụ, nhưng lĩnh vực A được chấm theo mô tả Bậc 4; học sinh không bị trừ điểm vì không tìm ra khoảng trống thực sự trong tài liệu rộng hơn (câu hỏi dựa trên khoảng trống thuộc Bậc 5 ở A1 và A3).", "K": "- Vấn đề nghiên cứu, câu hỏi nghiên cứu, mục tiêu và phạm vi.\n- Các loại khoảng trống nghiên cứu (bối cảnh, phương pháp, bằng chứng mâu thuẫn).\n- Tiêu chí của câu hỏi chính xác, kiểm chứng được: biến đo được, khả thi, chấp nhận được về đạo đức.\n- Viết phát biểu vấn đề và lý do nghiên cứu.", "U": "- Nghiên cứu có ý nghĩa giúp mở rộng hiểu biết bằng cách giải quyết những câu hỏi chưa được trả lời đầy đủ.", "D": "- Tổng quan tài liệu sơ bộ có trọng tâm, dựa trên các nguồn của giai đoạn Nền tảng.\n- Nhận ra khoảng trống hoặc mâu thuẫn giữa các nguồn đã đọc.\n- Xây dựng và điều chỉnh câu hỏi nghiên cứu.\n- Lập luận về ý nghĩa và tính khả thi của nghiên cứu.", "evidence": "- Phát biểu vấn đề và lý do nghiên cứu (khoảng 1 trang) có trích dẫn.\n- Câu hỏi nghiên cứu kèm lịch sử chỉnh sửa."}, {"indicators": "Xây dựng giả thuyết có nhiều hơn một biến hoặc một tương tác, dựa trên mô hình lý thuyết và nêu kết quả nào sẽ bác bỏ nó (C1); xác định dữ liệu cần thu, đánh giá độ chụm và độ tin cậy của công cụ và phương pháp (C2); lập kế hoạch thu thập dữ liệu có chiến lược, xét đến ảnh hưởng của độ chụm, độ chính xác và cỡ mẫu đến tính hợp lệ và độ tin cậy (C3); thiết kế nghiên cứu thực nghiệm, bán thực nghiệm, tương quan hoặc thực địa phù hợp với câu hỏi, xác định rõ biến hoặc yếu tố, với quy trình được ghi chép đầy đủ, đánh giá rủi ro và phê duyệt đạo đức cần thiết (C4); phân tích tác động tiềm ẩn của biến gây nhiễu và áp dụng biện pháp kiểm soát phù hợp (C5). Xây dựng sơ đồ chi tiết, có chú thích của hệ thống (B1); giải thích hiện tượng bằng nhiều mô hình, so sánh điểm mạnh, điểm yếu và lập luận lựa chọn (B2); đánh giá giả định của mô hình và đề xuất cải tiến dựa trên bằng chứng (B3); với đề tài thiên về thiết kế, phát triển và điều chỉnh lặp lại mô hình để kiểm nghiệm các khía cạnh thiết kế (B4).", "boundary": "Học sinh chọn và lập luận cho thiết kế nghiên cứu, cách chọn mẫu và phương pháp đo, đồng thời xây dựng một mô hình khái niệm và ít nhất một loại mô hình khác (ví dụ toán học, vật lý, tính toán) làm minh chứng bắt buộc cho lĩnh vực B. Đề cương nghiên cứu, đánh giá rủi ro và rà soát đạo đức phải được duyệt trước khi thu thập dữ liệu: nghiên cứu có người tham gia cần đồng thuận có hiểu biết (phụ huynh đồng ý với học sinh chưa thành niên), tham gia tự nguyện có quyền rút lui, ẩn danh và bảo mật, rủi ro tâm lý tối thiểu, giải thích sau nghiên cứu khi cần, và được giáo viên hướng dẫn hoặc hội đồng của trường phê duyệt; vi sinh chỉ giới hạn ở sinh vật BSL-1 có giám sát; không được dùng hóa chất nguy hiểm, vật sắc nhọn hay đi thực địa không giám sát nếu chưa có đánh giá rủi ro được duyệt. Không yêu cầu: phân tích công năng thống kê chính thức, xây dựng thang đo tâm lý đã kiểm định, hay thiết kế đa biến quá hai yếu tố. Thiết kế hai yếu tố đơn giản (hoặc một biến được điều khiển cộng một biến điều tiết được đo) là yêu cầu khi cần để kiểm chứng giả thuyết C1.", "K": "- Các thiết kế nghiên cứu và khi nào dùng; ngẫu nhiên hóa, nhóm đối chứng, làm mù (khi khả thi).\n- Phương pháp chọn mẫu và cân nhắc về cỡ mẫu.\n- Tính hợp lệ, độ tin cậy, độ chính xác, độ chụm và độ không đảm bảo.\n- Định nghĩa thao tác và công cụ đo (gồm thiết kế bảng hỏi khi cần).\n- Biến gây nhiễu và chiến lược kiểm soát.\n- Các loại mô hình (khái niệm, toán học, vật lý, tính toán) và giả định của chúng.\n- Đạo đức nghiên cứu (đồng thuận có hiểu biết, bảo mật, quy định xử lý sinh vật) và đánh giá rủi ro.", "U": "- Một nghiên cứu được thiết kế tốt giảm thiểu thiên lệch, tạo ra bằng chứng hợp lệ và cho phép diễn giải kết quả có ý nghĩa.", "D": "- Xây dựng giả thuyết dựa trên lý thuyết, nêu kết quả nào sẽ bác bỏ nó.\n- Thiết kế một nghiên cứu chặt chẽ.\n- Chọn công cụ, phương pháp chọn mẫu và cách đo phù hợp.\n- Xây dựng và lập luận cho mô hình hoặc khung khái niệm.\n- Hoàn thành đánh giá rủi ro và rà soát đạo đức (phiếu đồng thuận khi cần).\n- Thử nghiệm sơ bộ công cụ và quy trình.", "evidence": "- Đề cương nghiên cứu: giả thuyết, thiết kế, bảng biến, cách chọn mẫu, công cụ, kế hoạch phân tích.\n- Mô hình khái niệm có chú thích + một loại mô hình khác.\n- Đánh giá rủi ro; hồ sơ đạo đức/đồng thuận.\n- Ghi chép thử nghiệm sơ bộ."}, {"indicators": "Thu thập và ghi dữ liệu bằng công cụ và phương pháp đã được đánh giá về độ chụm và độ tin cậy (C2); thực hiện kế hoạch thu thập dữ liệu, theo dõi ảnh hưởng của độ chụm, độ chính xác và cỡ mẫu đến độ tin cậy (C3); thực hiện quy trình được ghi chép, có thể lặp lại, với các biến được kiểm soát (C4); theo dõi biến gây nhiễu và áp dụng biện pháp kiểm soát trong quá trình thực hiện (C5); điều chỉnh lặp lại mô hình hoặc thiết kế dựa trên kết quả dữ liệu và phản hồi (B4).", "boundary": "Học sinh tự thực hiện quy trình và có thể điều chỉnh quy trình khi phát sinh vấn đề, đồng thời bảo đảm liêm chính nghiên cứu. Mọi điều chỉnh đều được ghi lại và được giáo viên hướng dẫn phê duyệt; các điều kiện an toàn và đạo đức của đề cương đã duyệt vẫn bắt buộc. Không yêu cầu: lan truyền sai số chính thức vượt quá toán học của cấp học hay thiết bị đo chuyên nghiệp.", "K": "- Quy ước ghi sổ nghiên cứu và quản lý dữ liệu (phiên bản, sao lưu, dữ liệu thô và đã xử lý).\n- Sai số ngẫu nhiên và hệ thống; độ không đảm bảo của dụng cụ.\n- Sai lệch quy trình và cách ghi lại.\n- Toàn vẹn dữ liệu, bảo mật và xử lý dữ liệu đúng đạo đức.", "U": "- Bằng chứng đáng tin cậy đòi hỏi thực hiện quy trình nghiên cứu có hệ thống và theo dõi liên tục chất lượng dữ liệu.", "D": "- Tiến hành nghiên cứu độc lập.\n- Thực hiện quy trình thu thập dữ liệu.\n- Theo dõi độ tin cậy và tính hợp lệ.\n- Ghi lại các điều chỉnh và quan sát bất ngờ.\n- Duy trì hồ sơ nghiên cứu đầy đủ.", "evidence": "- Sổ nghiên cứu (ghi ngày, sai lệch, ghi chú độ không đảm bảo).\n- Tệp dữ liệu thô.\n- Hồ sơ điều chỉnh quy trình.\n- Báo cáo tiến độ giữa kỳ."}, {"indicators": "Phân tích dữ liệu bằng các đại lượng về độ biến thiên và độ không đảm bảo cùng các kỹ thuật suy luận hoặc tương quan phù hợp (ví dụ kiểm định t, chi bình phương, tương quan/hồi quy) hoặc mã hóa định tính có hệ thống (D1); đánh giá phê phán dữ liệu mâu thuẫn và đề xuất điều chỉnh mô hình hoặc thiết kế thí nghiệm (D2); dùng phần mềm hoặc công cụ chuyên biệt để phân tích dữ liệu và khám phá sâu mối quan hệ giữa các biến (D3); đánh giá kết luận bằng thống kê suy luận và độ lớn hiệu ứng, phân biệt tương quan với nhân quả và nêu độ không đảm bảo (D4); nhận ra các quy luật phức tạp trong dữ liệu gợi ý mối quan hệ sâu hơn đáng nghiên cứu (D5). Phân tích phê phán bằng chứng và mô hình để ủng hộ hoặc thách thức lời giải thích (E2).", "boundary": "Phân tích dùng thống kê mô tả có đại lượng phân tán và độ không đảm bảo (độ lệch chuẩn, sai số chuẩn, thanh sai số) và ít nhất một kỹ thuật suy luận hoặc tương quan phù hợp với thiết kế: kiểm định t hoặc ANOVA một yếu tố để so sánh trung bình nhóm; chi bình phương cho dữ liệu phân loại; tương quan/hồi quy tuyến tính cho mối quan hệ; mã hóa theo chủ đề cho dữ liệu định tính. Công cụ: công cụ phân tích của bảng tính hoặc phần mềm như JASP, jamovi, Python hoặc R khi có. Học sinh lập luận cho việc chọn kỹ thuật và diễn giải giá trị p và độ lớn hiệu ứng ở mức khái niệm. Không yêu cầu: phương pháp đa biến hoặc Bayes, hay chứng minh công thức thống kê. Đề tài định tính: mã hóa theo chủ đề đáp ứng D1, nhưng D4 ở Bậc 4 cần lập luận suy luận có độ lớn hiệu ứng, nên đề tài định tính phải có ít nhất một thành phần định lượng (ví dụ so sánh tần suất chủ đề giữa các nhóm bằng chi bình phương, hoặc một bảng hỏi đóng ngắn), hoặc dùng tiêu chí D4 thay thế được duyệt trước như một ngoại lệ có ghi nhận.", "K": "- Thống kê mô tả và độ không đảm bảo (độ lệch chuẩn, sai số chuẩn, thanh sai số).\n- Chọn kỹ thuật: kiểm định t/ANOVA, chi bình phương, tương quan/hồi quy, mã hóa định tính.\n- Giả định của kiểm định; giá trị p và độ lớn hiệu ứng (mức khái niệm).\n- Giá trị ngoại lai và bất thường: nhận diện và xử lý có lập luận.\n- Tương quan và nhân quả; độ không đảm bảo và hạn chế của kết luận.", "U": "- Diễn giải dữ liệu đòi hỏi đánh giá phê phán bằng chứng, không chỉ nhận ra quy luật.", "D": "- Phân tích dữ liệu bằng kỹ thuật định lượng hoặc định tính phù hợp.\n- Đánh giá điểm bất thường và bằng chứng mâu thuẫn.\n- Đánh giá độ mạnh của kết quả.\n- Đưa ra giả thuyết mới hoặc hướng nghiên cứu tiếp theo.\n- Lập luận cho việc chọn kỹ thuật thống kê hoặc phân tích.", "evidence": "- Tệp phân tích (dữ liệu thô → đã xử lý, kết quả thống kê).\n- Bản nháp phần kết quả có hình.\n- Ghi chú lập luận chọn phương pháp phân tích."}, {"indicators": "Truyền đạt hiểu biết về hệ thống phức tạp bằng nhiều hình thức biểu diễn, gồm bảng, đồ thị và biểu thức toán học (F1); trình bày báo cáo và bài thuyết trình chi tiết theo chuẩn viết khoa học, có bằng chứng (F3); xây dựng giải thích chi tiết bằng mô hình, lý thuyết và bằng chứng (E1); đưa ra giải thích nhân quả sâu sắc, thể hiện hiểu biết khoa học sâu hơn (E3).", "boundary": "Học sinh truyền đạt kết quả theo quy ước khoa học của lĩnh vực và tiếp nhận phê phán phản hồi cùng các cách diễn giải khác. Công việc diễn ra qua các chu kỳ viết có cấu trúc trong các tuần sẵn có: bản nháp đầy đủ (tuần 36), phản biện có cấu trúc của bạn học (tuần 37), chỉnh sửa (tuần 38–40), poster và tập trình bày (tuần 41–42). Dùng mẫu của trường. Không yêu cầu: nộp tạp chí hay định dạng chuẩn công bố.", "K": "- Cấu trúc IMRaD, viết tóm tắt và văn phong khoa học.\n- Thiết kế hình và bảng, chú thích, báo cáo kết quả thống kê.\n- Nhận định – Bằng chứng – Lập luận gắn với lý thuyết.\n- Thiết kế poster và bài trình bày miệng.\n- Trích dẫn (APA/IEEE) và liêm chính học thuật.", "U": "- Truyền đạt hiệu quả giúp người khác có thể xem xét kỹ, hiểu và vận dụng kết quả nghiên cứu.", "D": "- Viết bài báo khoa học đầy đủ (IMRaD) qua các chu kỳ nháp – phản biện – chỉnh sửa.\n- Thiết kế và trình bày poster nghiên cứu.\n- Lập luận cho kết luận bằng bằng chứng, lập luận và lý thuyết (CER).\n- Phản biện có cấu trúc và phản hồi phản biện.", "evidence": "- Bản nháp đầy đủ, phiếu phản biện, bài báo đã chỉnh sửa kèm ghi chú phản hồi phản biện.\n- Poster nghiên cứu; slide trình bày.\n- Sản phẩm bồi dưỡng (nếu được đánh dấu).\n- Phần Kết quả và Thảo luận của bài báo đã chỉnh sửa là minh chứng thứ hai cho lĩnh vực D (D1, D4, D5)."}, {"indicators": "Phân tích phê phán bằng chứng và mô hình để ủng hộ hoặc thách thức lời giải thích khi bảo vệ kết quả (E2); đánh giá phê phán tính hợp lệ của lời giải thích, nhận ra và xử lý khoảng trống hoặc điểm yếu (E4); truyền đạt kết quả phức tạp bằng nhiều hình thức biểu diễn và quy ước khoa học (F1, F3); phân tích phê phán và điều chỉnh câu hỏi nghiên cứu cho nghiên cứu tiếp theo (A4).", "boundary": "Học sinh đánh giá ý nghĩa rộng hơn của công trình và xem xét cách củng cố lời giải thích qua nghiên cứu tiếp theo. Phần bảo vệ là bảo vệ miệng ngắn (ví dụ trình bày 10 phút, sau đó hội đồng hỏi đáp). Không yêu cầu: bảo vệ ở mức hội nghị chuyên ngành.", "K": "- Tiêu chí đánh giá lời giải thích (độ mạnh của bằng chứng, tính mạch lạc, các cách giải thích khác).\n- Các loại hạn chế (thiết kế, mẫu, đo lường, phân tích) và hệ quả của chúng.\n- Quy ước bảo vệ nghiên cứu và phản hồi phản biện.\n- Tự đánh giá theo Chuẩn NCKH.", "U": "Lời giải thích khoa học vững chắc tích hợp lý thuyết, mô hình, bằng chứng và phản tư phê phán về hạn chế.", "D": "- Xây dựng và bảo vệ lời giải thích dựa trên bằng chứng.\n- Đánh giá hạn chế và các cách diễn giải khác.\n- Đề xuất hướng nghiên cứu tiếp theo.\n- Phản tư về sự trưởng thành như một người nghiên cứu độc lập.\n- Bảo vệ kết luận trong phần hỏi đáp với hội đồng.\n- Trả lời câu hỏi và phản biện một cách chuyên nghiệp.", "evidence": "- Bảo vệ miệng (bản ghi hoặc ghi chép của hội đồng).\n- Bài luận phản tư về sự trưởng thành như người nghiên cứu, kèm tự đánh giá theo Chuẩn NCKH.\n- Hồ sơ minh chứng hoàn chỉnh."}];
