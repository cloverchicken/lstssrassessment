LD_VI.G8.detail=[{"indicators": "Tóm tắt ý chính của văn bản khoa học phù hợp lứa tuổi và giải thích những gì bảng hoặc đồ thị trong đó thể hiện (F2); nhận biết các phần chính của báo cáo khoa học (câu hỏi, phương pháp, kết quả, kết luận) (F3); đánh giá một số bài báo truyền thông về khoa học bằng cách kiểm tra nguồn, xem có đưa bằng chứng cho nhận định không, và dấu hiệu thiên lệch hoặc phóng đại (F4); giải thích vì sao một câu hỏi có thể trả lời bằng bằng chứng còn câu hỏi khác phụ thuộc ý kiến, và viết lại câu hỏi dựa trên ý kiến thành câu hỏi kiểm chứng được (A2).", "boundary": "Ví dụ phù hợp lứa tuổi do giáo viên chọn từ các lĩnh vực nghiên cứu khác nhau. Học sinh làm việc với văn bản khoa học dễ tiếp cận, đoạn trích, bảng, sơ đồ, đồ thị và bài báo truyền thông. Không yêu cầu đánh giá phê phán đầy đủ toàn bộ bài báo nghiên cứu gốc; việc đánh giá tập trung vào dữ liệu, giả thuyết và kết luận có được hỗ trợ hợp lý hay không.", "K": "- Các phương pháp nghiên cứu phổ biến và loại câu hỏi nghiên cứu mà mỗi phương pháp phù hợp.\n- Các thành phần và đặc điểm chính của một báo cáo nghiên cứu cơ bản.\n- Các dạng bằng chứng khoa học và biểu diễn dữ liệu phổ biến.\n- Phân biệt cơ bản giữa câu hỏi dựa trên bằng chứng/sự thật và câu hỏi dựa trên ý kiến.", "U": "- Nhận định khoa học chỉ đáng tin khi được hỗ trợ bởi bằng chứng mà người khác có thể kiểm tra; không phải câu hỏi nào cũng trả lời được bằng khoa học.", "D": "- So sánh các ví dụ nghiên cứu và xác định câu hỏi nghiên cứu, phương pháp, dữ liệu/bằng chứng và kết luận.\n- Diễn giải văn bản khoa học, bảng, sơ đồ và đồ thị cơ bản.\n- Phân biệt câu hỏi khoa học với câu hỏi phi khoa học và nêu lý do cơ bản.\n- Nhận biết các đặc điểm chính của một báo cáo nghiên cứu.\n- Đưa ra nhận định cơ bản về việc dữ liệu có hỗ trợ hợp lý cho giả thuyết hoặc kết luận hay không.", "evidence": "- Nhật ký đọc nghiên cứu: mẫu phân tích cho 2–3 ví dụ nghiên cứu (câu hỏi – phương pháp – bằng chứng – kết luận).\n- Nhiệm vụ phân loại câu hỏi (khoa học / phi khoa học; dựa trên sự thật / ý kiến) có nêu lý do."}, {"indicators": "Đặt câu hỏi “tại sao” về nguyên nhân của hiện tượng hoặc vấn đề (A1); điều chỉnh câu hỏi sau quan sát hoặc thử nghiệm ban đầu để nêu rõ yếu tố được thay đổi và đại lượng được đo hoặc quan sát (A3); đặt câu hỏi tiếp nối hỏi về bằng chứng đằng sau một nhận định hoặc làm rõ kết luận được rút ra như thế nào (A4); đặt câu hỏi về chỗ quan sát khác với kỳ vọng (A5); chỉ ra một điểm yếu cụ thể trong lời giải thích và đề xuất cách khắc phục (E4). Với đề tài thiên về thiết kế (ví dụ Năng lượng, Robot), xác định một vấn đề thiết kế đơn giản với một số tiêu chí thành công và ràng buộc về vật liệu, thời gian hoặc chi phí (A1).", "boundary": "Vấn đề và câu hỏi nghiên cứu được xây dựng trong chủ đề hoặc bối cảnh do giáo viên cung cấp. Không yêu cầu học sinh tìm ra khoảng trống nghiên cứu mới, chứng minh tính mới hoặc tự đề xuất một chủ đề nghiên cứu mới. Câu hỏi phải tìm hiểu được bằng phương pháp và nguồn lực phù hợp lớp 8 và sẵn có trong trường.", "K": "- Vấn đề nghiên cứu và câu hỏi nghiên cứu.\n- Đặc điểm của một câu hỏi nghiên cứu có thể tìm hiểu được.\n- Vai trò của quan sát và tìm hiểu ban đầu trong việc điều chỉnh câu hỏi.\n- Mục đích của câu hỏi tiếp nối và câu hỏi nảy sinh từ quy luật, mâu thuẫn hoặc quan sát bất ngờ.", "U": "- Câu hỏi nghiên cứu trở nên hữu ích hơn khi được điều chỉnh dựa trên quan sát và tìm hiểu ban đầu.", "D": "- Xác định vấn đề nghiên cứu và câu hỏi nghiên cứu ban đầu từ chủ đề giáo viên giao.\n- Điều chỉnh câu hỏi nghiên cứu dựa trên quan sát hoặc tìm hiểu ban đầu.\n- Đặt câu hỏi tiếp nối để làm rõ hoặc xem xét thêm một ý tưởng hay lập luận.\n- Đặt câu hỏi về quy luật, mâu thuẫn hoặc quan sát bất ngờ.", "evidence": "- Sổ câu hỏi: ghi chép quan sát, câu hỏi ban đầu, câu hỏi đã điều chỉnh kèm lịch sử chỉnh sửa, các câu hỏi tiếp nối."}, {"indicators": "Xây dựng giả thuyết liên kết biến độc lập và biến phụ thuộc, dựa trên một ý tưởng khoa học hoặc bằng chứng trước đó (“Nếu …, thì …, vì …”) (C1); xác định dữ liệu cần thu, chọn công cụ phù hợp và quyết định cách ghi phép đo hoặc quan sát (C2); lập quy trình thí nghiệm hoặc nghiên cứu thực địa và xác định biến độc lập, phụ thuộc và kiểm soát khi phù hợp (C4); nhận diện các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả và xác định yếu tố nào cần giữ nguyên làm biến kiểm soát (C5). Xây dựng sơ đồ hoặc mô hình có chú thích của hệ thống hoặc bố trí thí nghiệm, thể hiện các thành phần chính, biến/yếu tố và mối quan hệ giữa chúng (B1), và dùng nó để giải thích kết quả dự kiến (B2).", "boundary": "Phương pháp giới hạn trong phạm vi phù hợp lớp 8 và khả thi trong lĩnh vực đã chọn và điều kiện của trường. Với nghiên cứu thực nghiệm, học sinh xác định biến độc lập, phụ thuộc và các biến kiểm soát liên quan; với cách tiếp cận khác, có thể xác định các yếu tố, tham số hoặc nguồn dữ liệu phù hợp. Công cụ và quy trình phải phù hợp với học sinh lớp 8. Mỗi đề tài có ít nhất một mô hình (ví dụ sơ đồ hệ thống có chú thích, lưu đồ quy trình, mô hình vật lý hoặc quan hệ toán học đơn giản) làm minh chứng bắt buộc cho lĩnh vực B; không yêu cầu khung khái niệm chính thức hay lập luận phương pháp nâng cao. Chỉ dùng vật liệu và quy trình được trường cho phép; cần đánh giá rủi ro được giáo viên kiểm tra trước khi thu thập dữ liệu. Đề tài có người tham gia (ví dụ khảo sát, quan sát, nhiệm vụ hành vi) cần đồng thuận có hiểu biết (có đồng ý của phụ huynh với người tham gia dưới 18 tuổi), tham gia tự nguyện và có quyền rút lui, ẩn danh và bảo mật, câu hỏi hoặc nhiệm vụ được giáo viên duyệt, rủi ro tâm lý tối thiểu, và giải thích sau nghiên cứu khi người tham gia không được biết đầy đủ mục đích từ trước. Đề tài có sinh vật sống tuân theo quy định an toàn sinh học của trường: chỉ vi sinh vật BSL-1, có giáo viên giám sát, quy trình nuôi cấy và tiêu hủy được trường phê duyệt.", "K": "- Nguyên tắc cơ bản của thiết kế thí nghiệm/nghiên cứu.\n- Giả thuyết và dự đoán.\n- Biến độc lập, phụ thuộc và kiểm soát, hoặc các yếu tố liên quan khác khi phù hợp.\n- Các loại dữ liệu và công cụ thu thập/đo lường phù hợp.\n- Các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả, và yếu tố nào cần giữ nguyên làm biến kiểm soát.\n- Mục đích của mô hình (biểu diễn, giải thích, dự đoán) và cách chú thích thành phần, mối quan hệ.\n- An toàn cơ bản trong phòng thí nghiệm/thực địa, đánh giá rủi ro, và sự tham gia tự nguyện/ẩn danh trong khảo sát.", "U": "- Mỗi câu hỏi nghiên cứu cần phương pháp tìm hiểu khác nhau, và một nghiên cứu công bằng đòi hỏi sự tương thích chặt chẽ giữa câu hỏi, phương pháp, các biến hoặc yếu tố liên quan và dữ liệu cần thu.", "D": "- Xây dựng giả thuyết/dự đoán khi phù hợp.\n- Chọn phương pháp tìm hiểu phù hợp với câu hỏi nghiên cứu.\n- Xác định dữ liệu cần thu và cách thu thập, ghi chép.\n- Xác định các biến/yếu tố liên quan và các ảnh hưởng gây nhiễu có thể có.\n- Lập cách hợp lý để kiểm soát hoặc tính đến các yếu tố liên quan.\n- Quyết định yếu tố nào cần giữ nguyên làm biến kiểm soát.\n- Thiết kế một nghiên cứu công bằng và khả thi.\n- Dùng mô hình hoặc sơ đồ khi nó thực sự hỗ trợ nghiên cứu.\n- Hoàn thành đánh giá rủi ro (và kế hoạch tham gia khi cần) trước khi thu thập dữ liệu.", "evidence": "- Kế hoạch nghiên cứu (theo mẫu): giả thuyết/dự đoán, bảng biến/yếu tố, thiết kế bảng dữ liệu, quy trình, công cụ.\n- Mô hình/sơ đồ có chú thích của hệ thống hoặc bố trí thí nghiệm.\n- Đánh giá rủi ro (và kế hoạch khảo sát/tham gia nếu có)."}, {"indicators": "Dùng công cụ và cách ghi chép phù hợp để thu dữ liệu cần thiết (C2); ghi phép đo hoặc quan sát chính xác, có đơn vị, nhận diện giới hạn của kỹ thuật đo và ghi chú các nguồn sai số rõ ràng (C3); thực hiện quy trình đã lập một cách nhất quán, quản lý các biến hoặc yếu tố liên quan (C4); giữ nguyên các biến kiểm soát đã xác định trong khi thu thập dữ liệu (C5). Với nghiên cứu thiên về thiết kế, thử nghiệm mô hình hoặc thiết kế và dùng kết quả quan sát để so sánh hoặc cải tiến giải pháp khi phù hợp (B4).", "boundary": "Học sinh thu thập bộ dữ liệu vừa sức bằng dụng cụ sẵn có ở trường, công cụ quan sát/khảo sát hoặc phương pháp phù hợp lĩnh vực. Không yêu cầu lặp thí nghiệm và thu thập dữ liệu có hệ thống; phép đo hoặc quan sát được ghi chính xác, có đơn vị. Học sinh cần nhận ra các giới hạn rõ ràng và có biện pháp hợp lý để giảm hoặc tính đến các nguồn sai số; không yêu cầu phân tích độ không đảm bảo chính thức, lan truyền sai số hay phân tích độ tin cậy nâng cao. Mọi điều kiện an toàn trong đánh giá rủi ro đã duyệt phải được tuân thủ suốt quá trình thu thập dữ liệu.", "K": "- Ghi chép phép đo và quan sát chính xác, có đơn vị.\n- Giới hạn của kỹ thuật đo hoặc thu thập dữ liệu và các nguồn sai số phổ biến.\n- Các biến/yếu tố liên quan và các yếu tố có thể gây nhiễu.\n- Tính nhất quán khi thực hiện quy trình nghiên cứu.", "U": "- Chất lượng bằng chứng được quyết định ngay trong lúc thu thập: sai sót hoặc bất nhất không được ghi lại kịp thời thì không thể sửa về sau.", "D": "- Tiến hành nghiên cứu công bằng theo kế hoạch đã thống nhất.\n- Dùng công cụ và cách ghi chép đã chọn một cách phù hợp.\n- Ghi quan sát và phép đo một cách có hệ thống.\n- Theo dõi các biến/yếu tố liên quan và ghi lại các sai lệch quan trọng so với kế hoạch.\n- Nhận diện và có biện pháp hợp lý để xử lý các nguồn sai số chính hoặc các yếu tố có thể ảnh hưởng đến kết quả.\n- Luôn tuân thủ quy trình an toàn đã được duyệt.", "evidence": "- Sổ nghiên cứu ghi ngày, có bảng dữ liệu thô, sai lệch và ghi chú sai số.\n- Ảnh chụp bố trí thí nghiệm.\n- Với đề tài thiết kế: hồ sơ thử nghiệm từng phiên bản mẫu."}, {"indicators": "Sắp xếp dữ liệu thành bảng và đồ thị và dùng phép tính đơn giản (ví dụ trung bình, phần trăm, hiệu số) để mô tả quy luật và xu hướng bằng giá trị cụ thể (D1); xác định chỗ dữ liệu khác với dự đoán, đề xuất nguyên nhân có thể và chọn nguyên nhân khả dĩ nhất có lý do (D2); dùng công cụ tính toán phù hợp để sắp xếp, trực quan hóa và diễn giải dữ liệu qua bảng và đồ thị (D3); nêu kết luận trả lời câu hỏi, dẫn chứng bằng giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán (D4); dùng quy luật quan sát được để dự đoán cho điều kiện mới hoặc đề xuất câu hỏi nghiên cứu tiếp theo (D5). Hỗ trợ lời giải thích ban đầu bằng ít nhất hai bằng chứng cụ thể từ nghiên cứu của mình (E2); giải thích kết quả bằng một khái niệm khoa học được gọi tên và chuỗi nhân quả có ít nhất một bước trung gian (E1, E3). Nêu các hạn chế cụ thể của mô hình hoặc sơ đồ (ví dụ tỉ lệ, bộ phận thiếu, giả định đơn giản hóa) và giải thích, dựa trên dữ liệu, mỗi hạn chế ảnh hưởng thế nào đến những gì mô hình thể hiện được (B3); so sánh kết quả với một bài báo truyền thông cùng chủ đề, kiểm tra nguồn, bằng chứng và dấu hiệu thiên lệch hoặc phóng đại (F4).", "boundary": "Phân tích dùng phương pháp phù hợp lớp 8 và bối cảnh nghiên cứu, như bảng, đồ thị, so sánh, phần trăm, trung bình/phép tính cơ bản, hoặc phân loại định tính cơ bản khi phù hợp. Có thể dùng bảng tính hoặc công cụ vẽ đồ thị để sắp xếp, trực quan hóa và diễn giải dữ liệu. Không yêu cầu thống kê suy luận nâng cao hay phần mềm phân tích chuyên dụng.", "K": "- Phương pháp sắp xếp, phân tích và diễn giải dữ liệu.\n- Quy luật, xu hướng, mối quan hệ, sự khác biệt và kết quả bất ngờ.\n- Bảng, đồ thị và công cụ tính toán cơ bản phù hợp.\n- Nêu kết luận được hỗ trợ bằng giá trị dữ liệu cụ thể.\n- Mối quan hệ giữa dữ liệu, bằng chứng, giải thích và kết luận.\n- Hạn chế của mô hình (tỉ lệ, chi tiết thiếu, giả định).", "U": "- Quy luật trong dữ liệu chỉ trở thành bằng chứng khi được phân tích có hệ thống; kết quả bất ngờ hoặc mâu thuẫn là thông tin cần giải thích, không phải lỗi để bỏ qua.", "D": "- Sắp xếp và biểu diễn dữ liệu phù hợp.\n- Nhận ra và mô tả quy luật, xu hướng hoặc mối quan hệ.\n- So sánh kết quả với giả thuyết, dự đoán hoặc kỳ vọng ban đầu.\n- Xem xét kết quả bất ngờ hoặc mâu thuẫn và đề xuất giải thích hợp lý dựa trên bằng chứng.\n- Nêu kết luận được hỗ trợ bằng giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán.\n- Dùng quy luật đã nhận ra để đề xuất dự đoán, giả thuyết hoặc hướng nghiên cứu tiếp theo.\n- Nêu ít nhất một hạn chế của mô hình dựa trên dữ liệu.\n- So sánh kết quả với một nguồn đã công bố hoặc nguồn truyền thông và nhận xét về sự phù hợp và độ tin cậy.", "evidence": "- Tệp phân tích (bảng và đồ thị trên bảng tính).\n- Phần phân tích viết: quy luật, so sánh với dự đoán, điểm bất thường, ghi chú hạn chế của mô hình, so sánh với một nguồn bên ngoài."}, {"indicators": "Truyền đạt kết quả bằng dạng bảng hoặc đồ thị phù hợp với dữ liệu, trục có nhãn và đơn vị, kèm mô tả những gì chúng thể hiện (F1); viết báo cáo ngắn và trình bày có đủ các phần chính của báo cáo khoa học (F3); giải thích kết quả bằng một khái niệm khoa học được gọi tên, cho thấy khái niệm liên hệ thế nào với điều quan sát được (E1); hỗ trợ lời giải thích bằng ít nhất hai bằng chứng cụ thể từ nghiên cứu của mình (E2); giải thích nguyên nhân dẫn đến kết quả qua ít nhất một bước trung gian (E3).", "boundary": "Một báo cáo nghiên cứu hoàn chỉnh ở lớp 8 trình bày nghiên cứu một cách mạch lạc, gồm vấn đề/câu hỏi nghiên cứu, phương pháp, dữ liệu/kết quả và giải thích/kết luận dựa trên bằng chứng, các phần khác điều chỉnh theo lĩnh vực nghiên cứu. Học sinh dùng quy ước khoa học phù hợp lớp 8; không yêu cầu bài báo khoa học theo chuẩn tạp chí.", "K": "- Cấu trúc và đặc điểm chính của một báo cáo nghiên cứu lớp 8 hoàn chỉnh.\n- Đặc điểm của giao tiếp khoa học bằng văn bản và lời nói.\n- Sử dụng phù hợp văn bản, bảng, đồ thị, sơ đồ và biểu diễn toán học.\n- Mối quan hệ giữa dữ liệu/bằng chứng, khái niệm khoa học, giải thích và kết luận.", "U": "- Giao tiếp khoa học hiệu quả giúp người nghe đi theo được con đường từ câu hỏi đến bằng chứng và kết luận, và tự đánh giá được kết luận.", "D": "- Xây dựng lời giải thích kết quả dựa trên bằng chứng.\n- Chọn bằng chứng cụ thể ủng hộ hoặc thách thức lời giải thích.\n- Viết một báo cáo nghiên cứu hoàn chỉnh ở mức lớp 8.\n- Dùng văn bản và biểu diễn dữ liệu phù hợp để truyền đạt kết quả rõ ràng.\n- Chuẩn bị bài trình bày miệng/trực quan về kết quả nghiên cứu.\n- Đưa mô hình/sơ đồ vào báo cáo và giải thích kết quả ủng hộ, làm thay đổi hoặc giới hạn mô hình như thế nào.", "evidence": "- Báo cáo nghiên cứu lớp 8 hoàn chỉnh.\n- Slide trình bày hoặc poster.\n- Sản phẩm nhiệm vụ bồi dưỡng (nếu được đánh dấu).\n- Phần kết quả và thảo luận của báo cáo là minh chứng thứ hai cho lĩnh vực D (D1, D4, D5)."}, {"indicators": "Hỗ trợ lời giải thích bằng bằng chứng cụ thể khi trả lời câu hỏi (E2); chỉ ra một điểm yếu cụ thể trong giải thích của mình hoặc người khác và đề xuất cách khắc phục (E4); trình bày miệng kết quả với đồ thị phù hợp, có nhãn, và đủ các phần chính của báo cáo khoa học (F1, F3).", "boundary": "Phản tư tập trung vào chất lượng của lời giải thích dựa trên bằng chứng: nhận định có được bằng chứng hỗ trợ không, lời giải thích chưa đầy đủ hoặc yếu ở đâu, và có thể cải thiện hợp lý như thế nào. Không yêu cầu học sinh phản biện phương pháp chuyên sâu hay bảo vệ nghiên cứu ở mức chuyên nghiệp.", "K": "- Tiêu chí của một lời giải thích dựa trên bằng chứng.\n- Các khoảng trống hoặc điểm yếu thường gặp trong giải thích khoa học.\n- Cách dùng bằng chứng và phản hồi để củng cố việc truyền đạt và giải thích nghiên cứu.", "U": "- Lời giải thích khoa học trở nên vững chắc hơn khi điểm yếu được nhận ra và nhận định được xem xét lại dựa trên bằng chứng và phản hồi mang tính xây dựng.", "D": "- Trình bày rõ ràng nghiên cứu đã hoàn thành.\n- Trả lời câu hỏi bằng cách dẫn bằng chứng cụ thể từ nghiên cứu.\n- Nêu một khoảng trống hoặc điểm yếu trong giải thích của mình hoặc người khác.\n- Giải thích bằng chứng ủng hộ, thách thức hoặc giới hạn kết luận như thế nào.\n- Đề xuất chỉnh sửa hoặc cải tiến hợp lý để củng cố lời giải thích hoặc việc truyền đạt nghiên cứu.", "evidence": "- Bài trình bày trưng bày (ghi chép hỏi đáp hoặc bản ghi).\n- Phiếu phản hồi của bạn học.\n- Bài phản tư viết có đề xuất chỉnh sửa.\n- Hồ sơ minh chứng hoàn chỉnh."}];
LD_VI.G10.detail=[{"indicators": "Đọc bài báo nghiên cứu gốc (đầy đủ hoặc đã được điều chỉnh) và giải thích câu hỏi nghiên cứu, phương pháp, kết quả chính và kết luận, kể cả kết quả thống kê trong hình và bảng (F2); đánh giá phê phán báo cáo nghiên cứu qua thiết kế, mẫu, phân tích và việc kết luận có xuất phát từ kết quả hay không, và so sánh độ tin cậy của nhiều nguồn (F4); nhận biết quy ước của một báo cáo nghiên cứu đầy đủ theo định dạng chuẩn (ví dụ IMRaD) (F3); phân biệt câu hỏi cần dữ liệu thực nghiệm mới với câu hỏi có thể trả lời từ tài liệu hoặc phân tích lý thuyết (A2).", "boundary": "Học sinh đọc các bài báo nghiên cứu gốc và bài tổng quan do giáo viên chọn hoặc duyệt, thuộc lĩnh vực dự định nghiên cứu (khoảng 5–8 nguồn). Học sinh đánh giá sự tương thích giữa vấn đề, phương pháp, bằng chứng và kết luận, và nhận ra điểm mạnh, điểm yếu về phương pháp. Không yêu cầu: tổng quan hệ thống hoặc phân tích gộp, đánh giá mô hình thống kê vượt quá toán học của cấp học, hay tổng quan tài liệu đủ chuẩn công bố.", "K": "- Cấu trúc và quy ước của bài báo nghiên cứu gốc và bài tổng quan.\n- Các thiết kế nghiên cứu: thực nghiệm, bán thực nghiệm, tương quan, quan sát/thực địa, khảo sát, dựa trên thiết kế.\n- Tính hợp lệ (bên trong/bên ngoài), độ tin cậy và khả năng lặp lại.\n- Các nguồn thiên lệch phổ biến (chọn mẫu, đo lường, xác nhận, công bố).\n- Chiến lược tìm kiếm, độ tin cậy của nguồn và trích dẫn (APA/IEEE).\n- Câu hỏi nghiên cứu thực nghiệm và câu hỏi lý thuyết.", "U": "- Tri thức khoa học được xây dựng qua nghiên cứu chặt chẽ, đánh giá phê phán bằng chứng và giao tiếp học thuật.", "D": "- Phân tích các bài báo nghiên cứu đã công bố.\n- Đánh giá điểm mạnh, điểm yếu của các nghiên cứu.\n- Nhận ra khoảng trống nghiên cứu, quy luật và các câu hỏi chưa được trả lời.\n- Duy trì thư mục có chú giải với trích dẫn đầy đủ.", "evidence": "- Phiếu đánh giá phê phán cho ít nhất 3 bài báo.\n- Thư mục có chú giải (5–8 nguồn)."}, {"indicators": "Đặt câu hỏi xuất phát từ mô hình, lý thuyết hoặc nghiên cứu trước, nêu rõ cơ chế hoặc mối quan hệ cần khảo sát; với đề tài thiên về thiết kế, xác định vấn đề thiết kế với nhiều tiêu chí và ràng buộc và xếp thứ tự ưu tiên (A1); xây dựng và lập luận cho câu hỏi chính xác, kiểm chứng được, gắn với giả thuyết dựa trên lý thuyết, định nghĩa biến theo cách đo được và đánh giá tính khả thi với nguồn lực sẵn có (A3); đặt câu hỏi thăm dò làm rõ giả định, tiền đề và thiên lệch tiềm ẩn đằng sau một lập luận, một cách diễn giải dữ liệu hoặc câu hỏi nghiên cứu của chính mình, và dùng chúng để điều chỉnh câu hỏi (A4); nhận ra mâu thuẫn giữa các bộ dữ liệu hoặc nghiên cứu và xây dựng câu hỏi mà câu trả lời sẽ giải quyết mâu thuẫn, nêu rõ bằng chứng cần có (A5); đánh giá tính hợp lệ của các lời giải thích trong nguồn bằng cách đối chiếu với bằng chứng và các cách giải thích khác (E4).", "boundary": "Vấn đề nghiên cứu xuất phát từ các nguồn đã đọc trong giai đoạn Nền tảng: học sinh xác định một câu hỏi chưa được giải quyết, một điểm mâu thuẫn hoặc một bối cảnh địa phương chưa được kiểm chứng trong các nguồn đó, và lập luận về ý nghĩa và tính khả thi. Câu hỏi phải khả thi với nguồn lực của trường hoặc đối tác trong tuần 6–23. Không yêu cầu: chứng minh tính mới đối với lĩnh vực rộng hơn hay tổng quan tài liệu toàn diện (Bậc 5 / lớp 11–12). Chấm điểm: việc tìm khoảng trống hoặc mâu thuẫn là nhiệm vụ, nhưng lĩnh vực A được chấm theo mô tả Bậc 4; học sinh không bị trừ điểm vì không tìm ra khoảng trống thực sự trong tài liệu rộng hơn (câu hỏi dựa trên khoảng trống thuộc Bậc 5 ở A1 và A3).", "K": "- Vấn đề nghiên cứu, câu hỏi nghiên cứu, mục tiêu và phạm vi.\n- Các loại khoảng trống nghiên cứu (bối cảnh, phương pháp, bằng chứng mâu thuẫn).\n- Tiêu chí của câu hỏi chính xác, kiểm chứng được: biến đo được, khả thi, chấp nhận được về đạo đức.\n- Viết phát biểu vấn đề và lý do nghiên cứu.", "U": "- Nghiên cứu có ý nghĩa giúp mở rộng hiểu biết bằng cách giải quyết những câu hỏi chưa được trả lời đầy đủ.", "D": "- Tổng quan tài liệu sơ bộ có trọng tâm, dựa trên các nguồn của giai đoạn Nền tảng.\n- Nhận ra khoảng trống hoặc mâu thuẫn giữa các nguồn đã đọc.\n- Xây dựng và điều chỉnh câu hỏi nghiên cứu.\n- Lập luận về ý nghĩa và tính khả thi của nghiên cứu.", "evidence": "- Phát biểu vấn đề và lý do nghiên cứu (khoảng 1 trang) có trích dẫn.\n- Câu hỏi nghiên cứu kèm lịch sử chỉnh sửa."}, {"indicators": "Xây dựng giả thuyết có nhiều hơn một biến hoặc một tương tác, dựa trên mô hình lý thuyết và nêu kết quả nào sẽ bác bỏ nó (C1); chọn công cụ và phương pháp bằng cách so sánh độ chụm và độ tin cậy (ví dụ độ phân giải, hiệu chuẩn, độ ổn định khi đo lại) và lập luận lựa chọn (C2); lập luận cho cỡ mẫu hoặc số lần thử từ độ biến thiên dự kiến hoặc quan sát được trong thử nghiệm sơ bộ, và giải thích độ chụm, độ chính xác ảnh hưởng thế nào đến tính hợp lệ và độ tin cậy (C3); chọn thiết kế thực nghiệm, bán thực nghiệm, tương quan hoặc thực địa phù hợp với câu hỏi và lập luận lựa chọn, kèm đánh giá rủi ro và phê duyệt đạo đức cần thiết (C4); phân tích biến gây nhiễu có thể làm sai lệch kết quả ra sao và áp dụng biện pháp kiểm soát trong thiết kế (ví dụ ghép cặp, đối trọng, phân nhóm ngẫu nhiên) (C5). Xây dựng sơ đồ chi tiết, có chú thích của hệ thống (B1); giải thích hiện tượng bằng nhiều mô hình, so sánh về độ chính xác, phạm vi và giả định, và lập luận lựa chọn (B2); xác định giả định của mô hình, kiểm chứng ít nhất một giả định với tài liệu hoặc dữ liệu thử nghiệm sơ bộ, và đề xuất cải tiến dựa trên bằng chứng (B3); với đề tài thiên về thiết kế, cải tiến mô hình hoặc mẫu thử qua các chu kỳ thử – cải tiến, dùng dữ liệu để cân nhắc đánh đổi (B4).", "boundary": "Học sinh chọn và lập luận cho thiết kế nghiên cứu, cách chọn mẫu và phương pháp đo, đồng thời xây dựng một mô hình khái niệm và ít nhất một loại mô hình khác (ví dụ toán học, vật lý, tính toán) làm minh chứng bắt buộc cho lĩnh vực B. Đề cương nghiên cứu, đánh giá rủi ro và rà soát đạo đức phải được duyệt trước khi thu thập dữ liệu: nghiên cứu có người tham gia cần đồng thuận có hiểu biết (phụ huynh đồng ý với học sinh chưa thành niên), tham gia tự nguyện có quyền rút lui, ẩn danh và bảo mật, rủi ro tâm lý tối thiểu, giải thích sau nghiên cứu khi cần, và được giáo viên hướng dẫn hoặc hội đồng của trường phê duyệt; vi sinh chỉ giới hạn ở sinh vật BSL-1 có giám sát; không được dùng hóa chất nguy hiểm, vật sắc nhọn hay đi thực địa không giám sát nếu chưa có đánh giá rủi ro được duyệt. Không yêu cầu: phân tích công năng thống kê chính thức, xây dựng thang đo tâm lý đã kiểm định, hay thiết kế đa biến quá hai yếu tố. Thiết kế hai yếu tố đơn giản (hoặc một biến được điều khiển cộng một biến điều tiết được đo) là yêu cầu khi cần để kiểm chứng giả thuyết C1.", "K": "- Các thiết kế nghiên cứu và khi nào dùng; ngẫu nhiên hóa, nhóm đối chứng, làm mù (khi khả thi).\n- Phương pháp chọn mẫu và cân nhắc về cỡ mẫu.\n- Tính hợp lệ, độ tin cậy, độ chính xác, độ chụm và độ không đảm bảo.\n- Định nghĩa thao tác và công cụ đo (gồm thiết kế bảng hỏi khi cần).\n- Biến gây nhiễu và chiến lược kiểm soát.\n- Các loại mô hình (khái niệm, toán học, vật lý, tính toán) và giả định của chúng.\n- Đạo đức nghiên cứu (đồng thuận có hiểu biết, bảo mật, quy định xử lý sinh vật) và đánh giá rủi ro.", "U": "- Một nghiên cứu được thiết kế tốt giảm thiểu thiên lệch, tạo ra bằng chứng hợp lệ và cho phép diễn giải kết quả có ý nghĩa.", "D": "- Xây dựng giả thuyết dựa trên lý thuyết, nêu kết quả nào sẽ bác bỏ nó.\n- Thiết kế một nghiên cứu chặt chẽ.\n- Chọn công cụ, phương pháp chọn mẫu và cách đo phù hợp.\n- Xây dựng và lập luận cho mô hình hoặc khung khái niệm.\n- Hoàn thành đánh giá rủi ro và rà soát đạo đức (phiếu đồng thuận khi cần).\n- Thử nghiệm sơ bộ công cụ và quy trình.", "evidence": "- Đề cương nghiên cứu: giả thuyết, thiết kế, bảng biến, cách chọn mẫu, công cụ, kế hoạch phân tích.\n- Mô hình khái niệm có chú thích + một loại mô hình khác.\n- Đánh giá rủi ro; hồ sơ đạo đức/đồng thuận.\n- Ghi chép thử nghiệm sơ bộ."}, {"indicators": "Thu thập và ghi dữ liệu bằng công cụ và phương pháp đã được đánh giá về độ chụm và độ tin cậy (C2); thực hiện kế hoạch thu thập dữ liệu, theo dõi ảnh hưởng của độ chụm, độ chính xác và cỡ mẫu đến độ tin cậy (C3); thực hiện quy trình được ghi chép, lặp lại được, với các biến được kiểm soát (C4); theo dõi biến gây nhiễu, áp dụng các biện pháp kiểm soát đã lập và kiểm tra hiệu quả sau khi thu thập (C5); cải tiến mô hình hoặc thiết kế qua các chu kỳ thử – cải tiến, ghi lại từng phiên bản (B4).", "boundary": "Học sinh tự thực hiện quy trình và có thể điều chỉnh quy trình khi phát sinh vấn đề, đồng thời bảo đảm liêm chính nghiên cứu. Mọi điều chỉnh đều được ghi lại và được giáo viên hướng dẫn phê duyệt; các điều kiện an toàn và đạo đức của đề cương đã duyệt vẫn bắt buộc. Không yêu cầu: lan truyền sai số chính thức vượt quá toán học của cấp học hay thiết bị đo chuyên nghiệp.", "K": "- Quy ước ghi sổ nghiên cứu và quản lý dữ liệu (phiên bản, sao lưu, dữ liệu thô và đã xử lý).\n- Sai số ngẫu nhiên và hệ thống; độ không đảm bảo của dụng cụ.\n- Sai lệch quy trình và cách ghi lại.\n- Toàn vẹn dữ liệu, bảo mật và xử lý dữ liệu đúng đạo đức.", "U": "- Bằng chứng đáng tin cậy đòi hỏi thực hiện quy trình nghiên cứu có hệ thống và theo dõi liên tục chất lượng dữ liệu.", "D": "- Tiến hành nghiên cứu độc lập.\n- Thực hiện quy trình thu thập dữ liệu.\n- Theo dõi độ tin cậy và tính hợp lệ.\n- Ghi lại các điều chỉnh và quan sát bất ngờ.\n- Duy trì hồ sơ nghiên cứu đầy đủ.", "evidence": "- Sổ nghiên cứu (ghi ngày, sai lệch, ghi chú độ không đảm bảo).\n- Tệp dữ liệu thô.\n- Hồ sơ điều chỉnh quy trình.\n- Báo cáo tiến độ giữa kỳ."}, {"indicators": "Phân tích dữ liệu bằng các đại lượng về độ biến thiên và độ không đảm bảo cùng các kỹ thuật suy luận hoặc tương quan phù hợp (ví dụ kiểm định t, chi bình phương, tương quan/hồi quy) hoặc mã hóa định tính có hệ thống (D1); đánh giá dữ liệu mâu thuẫn (trong dữ liệu của mình hoặc so với kết quả đã công bố) bằng cách kiểm tra nguồn sai số và lỗi thiết kế, và đề xuất, lập luận cho việc chỉnh sửa mô hình hoặc thiết kế (D2); dùng phần mềm thống kê hoặc chuyên dụng để phân tích và khám phá mối quan hệ giữa các biến, ghi lại các bước để có thể lặp lại phân tích (D3); đánh giá kết luận bằng thống kê suy luận và độ lớn hiệu ứng, phân biệt tương quan với nhân quả và nêu độ không đảm bảo (D4); nhận ra các quy luật như tương tác, xu hướng phi tuyến hoặc khác biệt giữa nhóm con và xây dựng giả thuyết kiểm chứng được cho nghiên cứu tiếp theo (D5). Đánh giá mức độ bằng chứng ủng hộ hoặc thách thức lời giải thích, có xét đến chất lượng dữ liệu, độ không đảm bảo và hạn chế của mô hình (E2).", "boundary": "Phân tích dùng thống kê mô tả có đại lượng phân tán và độ không đảm bảo (độ lệch chuẩn, sai số chuẩn, thanh sai số) và ít nhất một kỹ thuật suy luận hoặc tương quan phù hợp với thiết kế: kiểm định t hoặc ANOVA một yếu tố để so sánh trung bình nhóm; chi bình phương cho dữ liệu phân loại; tương quan/hồi quy tuyến tính cho mối quan hệ; mã hóa theo chủ đề cho dữ liệu định tính. Công cụ: công cụ phân tích của bảng tính hoặc phần mềm như JASP, jamovi, Python hoặc R khi có. Học sinh lập luận cho việc chọn kỹ thuật và diễn giải giá trị p và độ lớn hiệu ứng ở mức khái niệm. Không yêu cầu: phương pháp đa biến hoặc Bayes, hay chứng minh công thức thống kê. Đề tài định tính: mã hóa theo chủ đề đáp ứng D1, nhưng D4 ở Bậc 4 cần lập luận suy luận có độ lớn hiệu ứng, nên đề tài định tính phải có ít nhất một thành phần định lượng (ví dụ so sánh tần suất chủ đề giữa các nhóm bằng chi bình phương, hoặc một bảng hỏi đóng ngắn), hoặc dùng tiêu chí D4 thay thế được duyệt trước như một ngoại lệ có ghi nhận.", "K": "- Thống kê mô tả và độ không đảm bảo (độ lệch chuẩn, sai số chuẩn, thanh sai số).\n- Chọn kỹ thuật: kiểm định t/ANOVA, chi bình phương, tương quan/hồi quy, mã hóa định tính.\n- Giả định của kiểm định; giá trị p và độ lớn hiệu ứng (mức khái niệm).\n- Giá trị ngoại lai và bất thường: nhận diện và xử lý có lập luận.\n- Tương quan và nhân quả; độ không đảm bảo và hạn chế của kết luận.", "U": "- Diễn giải dữ liệu đòi hỏi đánh giá phê phán bằng chứng, không chỉ nhận ra quy luật.", "D": "- Phân tích dữ liệu bằng kỹ thuật định lượng hoặc định tính phù hợp.\n- Đánh giá điểm bất thường và bằng chứng mâu thuẫn.\n- Đánh giá độ mạnh của kết quả.\n- Đưa ra giả thuyết mới hoặc hướng nghiên cứu tiếp theo.\n- Lập luận cho việc chọn kỹ thuật thống kê hoặc phân tích.", "evidence": "- Tệp phân tích (dữ liệu thô → đã xử lý, kết quả thống kê).\n- Bản nháp phần kết quả có hình.\n- Ghi chú lập luận chọn phương pháp phân tích."}, {"indicators": "Trình bày kết quả định lượng với biểu diễn độ biến thiên và độ không đảm bảo (ví dụ thanh sai số, khoảng tin cậy), tích hợp với văn bản và sơ đồ (F1); viết báo cáo nghiên cứu đầy đủ theo IMRaD có tóm tắt, trong đó mọi nhận định đều có bằng chứng hoặc trích dẫn (F3); xây dựng lời giải thích nhận định – bằng chứng – lập luận, liên kết kết quả với lý thuyết hoặc mô hình, giải thích cơ chế và xử lý ít nhất một kết quả chưa giải thích được đầy đủ (E1); giải thích nhiều yếu tố cùng tạo ra hiệu ứng như thế nào, kể cả chiều và độ lớn gần đúng của từng yếu tố, và nêu bằng chứng ủng hộ nhận định nhân quả hay chỉ tương quan (E3).", "boundary": "Học sinh truyền đạt kết quả theo quy ước khoa học của lĩnh vực và tiếp nhận phê phán phản hồi cùng các cách diễn giải khác. Công việc diễn ra qua các chu kỳ viết có cấu trúc trong các tuần sẵn có: bản nháp đầy đủ (tuần 36), phản biện có cấu trúc của bạn học (tuần 37), chỉnh sửa (tuần 38–40), poster và tập trình bày (tuần 41–42). Dùng mẫu của trường. Không yêu cầu: nộp tạp chí hay định dạng chuẩn công bố.", "K": "- Cấu trúc IMRaD, viết tóm tắt và văn phong khoa học.\n- Thiết kế hình và bảng, chú thích, báo cáo kết quả thống kê.\n- Nhận định – Bằng chứng – Lập luận gắn với lý thuyết.\n- Thiết kế poster và bài trình bày miệng.\n- Trích dẫn (APA/IEEE) và liêm chính học thuật.", "U": "- Truyền đạt hiệu quả giúp người khác có thể xem xét kỹ, hiểu và vận dụng kết quả nghiên cứu.", "D": "- Viết bài báo khoa học đầy đủ (IMRaD) qua các chu kỳ nháp – phản biện – chỉnh sửa.\n- Thiết kế và trình bày poster nghiên cứu.\n- Lập luận cho kết luận bằng bằng chứng, lập luận và lý thuyết (CER).\n- Phản biện có cấu trúc và phản hồi phản biện.", "evidence": "- Bản nháp đầy đủ, phiếu phản biện, bài báo đã chỉnh sửa kèm ghi chú phản hồi phản biện.\n- Poster nghiên cứu; slide trình bày.\n- Sản phẩm bồi dưỡng (nếu được đánh dấu).\n- Phần Kết quả và Thảo luận của bài báo đã chỉnh sửa là minh chứng thứ hai cho lĩnh vực D (D1, D4, D5)."}, {"indicators": "Đánh giá mức độ bằng chứng ủng hộ lời giải thích khi bảo vệ kết quả (E2); đánh giá tính hợp lệ của lời giải thích của mình và người khác dựa trên bằng chứng và các cách giải thích khác, và chỉnh sửa lời giải thích của mình tương ứng (E4); bảo vệ báo cáo bằng lời nói, trả lời câu hỏi bằng bằng chứng và trình bày kết quả kèm biểu diễn độ không đảm bảo (F1, F3); phân tích phê phán và điều chỉnh câu hỏi nghiên cứu cho nghiên cứu tiếp theo (A4).", "boundary": "Học sinh đánh giá ý nghĩa rộng hơn của công trình và xem xét cách củng cố lời giải thích qua nghiên cứu tiếp theo. Phần bảo vệ là bảo vệ miệng ngắn (ví dụ trình bày 10 phút, sau đó hội đồng hỏi đáp). Không yêu cầu: bảo vệ ở mức hội nghị chuyên ngành.", "K": "- Tiêu chí đánh giá lời giải thích (độ mạnh của bằng chứng, tính mạch lạc, các cách giải thích khác).\n- Các loại hạn chế (thiết kế, mẫu, đo lường, phân tích) và hệ quả của chúng.\n- Quy ước bảo vệ nghiên cứu và phản hồi phản biện.\n- Tự đánh giá theo Chuẩn NCKH.", "U": "Lời giải thích khoa học vững chắc tích hợp lý thuyết, mô hình, bằng chứng và phản tư phê phán về hạn chế.", "D": "- Xây dựng và bảo vệ lời giải thích dựa trên bằng chứng.\n- Đánh giá hạn chế và các cách diễn giải khác.\n- Đề xuất hướng nghiên cứu tiếp theo.\n- Phản tư về sự trưởng thành như một người nghiên cứu độc lập.\n- Bảo vệ kết luận trong phần hỏi đáp với hội đồng.\n- Trả lời câu hỏi và phản biện một cách chuyên nghiệp.", "evidence": "- Bảo vệ miệng (bản ghi hoặc ghi chép của hội đồng).\n- Bài luận phản tư về sự trưởng thành như người nghiên cứu, kèm tự đánh giá theo Chuẩn NCKH.\n- Hồ sơ minh chứng hoàn chỉnh."}];
const DOM_VI={A:"Đặt câu hỏi và xác định vấn đề",B:"Phát triển và sử dụng mô hình",C:"Lập kế hoạch và tiến hành nghiên cứu",D:"Phân tích và diễn giải dữ liệu",E:"Xây dựng giải thích dựa trên bằng chứng",F:"Thu thập, đánh giá và truyền đạt thông tin"};

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CORE=['A','B','C','D'];
const store={get(k,d){try{const v=localStorage.getItem('sr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sr_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('ui_lang','en');
const VI=()=>lang==='vi';
const T=(en,vi)=>VI()?vi:en;
const UI={
 brand:['CIEC – SR assessment pilot','CIEC – Thử nghiệm đánh giá NCKH'],
 title:['PILOT OF THE LSTS SCIENTIFIC RESEARCH COMPETENCY ASSESSMENT TOOL','THỬ NGHIỆM ĐÁNH GIÁ CÔNG CỤ ĐÁNH GIÁ NĂNG LỰC NCKH LSTS'],
 c8:['Grade 8: Tier 2','Lớp 8: Bậc 2'],c10:['Grade 10: Tier 4','Lớp 10: Bậc 4'],
 section:['Section','Mục'],
 tabs:{plan:['Implementation plan','Kế hoạch triển khai'],std:['SR standards','Chuẩn NCKH'],dp:['Domain progression','Tiến trình lĩnh vực'],tool:['Assessment tool','Công cụ đánh giá'],guide:['Assessment guidelines','Hướng dẫn đánh giá'],ld:['Learning design','Thiết kế dạy học']},
 foot:['CIEC AY26-27','CIEC AY26-27'],
 lv:[['Emerging','Bắt đầu'],['Developing','Đang phát triển'],['Proficient','Thành thạo'],['Extending','Mở rộng']]
};
const u=k=>T(UI[k][0],UI[k][1]);
const kn=c=>`<span class="kn${CORE.includes(c)?'':' sup'}" data-d="${c}">${c}</span>`;
function bullets(t){const l=String(t||'').split(/\n/).map(s=>s.replace(/^\s*-\s*/,'').trim()).filter(Boolean);return l.length>1?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:esc(l[0]||'')}
const head=(meta,title,link)=>`<div class="s-head"><div>${meta?`<span class="meta">${esc(meta)}</span>`:''}<h2>${esc(title)}</h2></div>${link?`<a class="hbtn" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer" title="${esc(link.title)}">${esc(link.label)} <span aria-hidden="true">↗</span></a>`:''}</div>`;
const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function subtabs(el,key,parts,top=''){let cur=Math.min(store.get('sub_'+key,0),parts.length-1);
 const draw=()=>{el.innerHTML=top+`<div class="tabs" role="tablist">${parts.map((p,i)=>`<button role="tab" data-sub="${i}" aria-selected="${i===cur}">${p.label}</button>`).join('')}</div><div class="sub fade-in">${parts[cur].html()}</div>`;
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{cur=+b.dataset.sub;store.set('sub_'+key,cur);draw()})};draw();}

/* ---------- plan ---------- */
function renderPlan(){const P=VI()?PLAN_VI:PLAN;const O=P.options;
 const row=(lab,f)=>`<tr><th scope="row">${lab}</th>${O.map(o=>`<td class="${o.rec?'rec':''}">${f(o)}</td>`).join('')}</tr>`;
 subtabs($('#plan'),'plan',[
 {label:T('Purposes and options','Mục đích và phương án'),html:()=>`<h3>${T('Purposes','Mục đích')}</h3>${ul(P.purposes)}
  <h3>${T('Options considered','Các phương án')}</h3>
  <div class="tbl"><table class="opt" style="min-width:980px"><thead><tr><th style="width:120px"></th>${O.map(o=>`<th class="${o.rec?'rec':''}">${T('Option','Phương án')} ${o.n}${o.rec?` <span class="tag">${T('Recommended','Khuyến nghị')}</span>`:''}</th>`).join('')}</tr></thead><tbody>
  ${row(T('Timeline','Tiến độ'),o=>ul(o.timeline))}
  ${row(T('Objective','Mục tiêu'),o=>esc(o.objective))}
  ${row(T('Scope','Phạm vi'),o=>esc(o.scope))}
  ${row(T('Advantages','Ưu điểm'),o=>`<ul class="pro">${o.pros.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)}
  ${row(T('Challenges','Thách thức / hạn chế'),o=>`<ul class="con">${o.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)}
  </tbody></table></div>
  <div class="goal"><p><b>${T('Why Option 1.','Vì sao chọn Phương án 1.')}</b> ${esc(P.recommendation)}</p></div>`},
 {label:T('Pilot schedule','Lịch thử nghiệm'),html:()=>`<h3>${T('Pilot schedule (Option 1)','Lịch thử nghiệm (Phương án 1)')}</h3><div class="tbl"><table style="min-width:760px"><thead><tr><th>${T('Period','Thời gian')}</th><th>${T('Grade 8','Lớp 8')}</th><th>${T('Grade 10','Lớp 10')}</th><th>${T('Decision point','Điểm quyết định')}</th></tr></thead><tbody>${P.schedule.map(r=>`<tr><td class="k">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`},
 {label:T('Validation criteria','Tiêu chí kiểm định'),html:()=>`<h3>${T('Validation design and success criteria','Thiết kế kiểm định và tiêu chí đạt')}</h3><div class="tbl"><table style="min-width:760px"><thead><tr><th>${T('Evidence','Minh chứng')}</th><th>${T('Method','Phương pháp')}</th><th>${T('Success criterion','Tiêu chí đạt')}</th></tr></thead><tbody>${P.validation.map((r,i)=>`<tr><td class="k">${i+1}. ${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><div class="notebox">${esc(P.readiness)}</div>`},
 {label:T('Roles','Phân công'),html:()=>`<h3>${T('Roles and responsibilities','Phân công thực hiện')}</h3>${Object.entries(P.roles).map(([k,v])=>`<article class="skill"><h3>${esc(k)}</h3>${ul(v)}</article>`).join('')}`},

function fig3d(){
 const dx=20,dy=-12,X0=80,Y0=110,W=100,H=65,SX=325,SW=110,SH=58,DOM=['A','B','C','D','E','F'];
 const nm=VI()?['Câu hỏi','Mô hình','Nghiên cứu','Dữ liệu','Giải thích','Truyền đạt']:['Questions','Models','Investigations','Data','Explanations','Communication'];
 const LV=['E','D','P','Ex'],TF=['var(--t0)','var(--t1)','var(--t2)','var(--t3)','var(--t4)'];
 const P=(a,f,s='var(--line)')=>`<polygon points="${a.map(q=>q.join(',')).join(' ')}" fill="${f}" stroke="${s}" stroke-width="1"/>`;
 let s='';
 // stem right face (drawn first)
 for(let k=0;k<4;k++)s+=P([[SX+SW+k*dx,Y0+H+k*dy],[SX+SW+(k+1)*dx,Y0+H+(k+1)*dy],[SX+SW+(k+1)*dx,Y0+H+5*SH+(k+1)*dy],[SX+SW+k*dx,Y0+H+5*SH+k*dy]],`var(--l${k})`);
 // stem fronts
 for(let r=0;r<5;r++){const tier=5-r,y=Y0+H+r*SH;s+=P([[SX,y],[SX+SW,y],[SX+SW,y+SH],[SX,y+SH]],TF[tier-1],'var(--pri-200)');
  s+=`<text x="${SX+SW/2}" y="${y+SH/2+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${tier>=4?'#fff':'var(--pri-d)'}">${VI()?'Bậc':'Tier'} ${tier}</text>`;
  if(tier===2||tier===4)s+=`<text x="${SX-10}" y="${y+SH/2+4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--pri)">${tier===2?T('Grade 8 target','Mục tiêu lớp 8'):T('Grade 10 target','Mục tiêu lớp 10')}</text>`;}
 // bar top + right faces
 for(let k=0;k<4;k++){s+=P([[X0+k*dx,Y0+k*dy],[X0+6*W+k*dx,Y0+k*dy],[X0+6*W+(k+1)*dx,Y0+(k+1)*dy],[X0+(k+1)*dx,Y0+(k+1)*dy]],`var(--l${k})`);
  s+=P([[X0+6*W+k*dx,Y0+k*dy],[X0+6*W+(k+1)*dx,Y0+(k+1)*dy],[X0+6*W+(k+1)*dx,Y0+H+(k+1)*dy],[X0+6*W+k*dx,Y0+H+k*dy]],`var(--l${k})`);
  s+=`<text x="${X0+(k+.5)*dx+16}" y="${Y0+(k+.5)*dy+3.5}" font-size="9" font-weight="700" fill="${k===3?'#fff':'var(--ok-ink)'}">${LV[k]}</text>`;}
 for(let c=1;c<6;c++)s+=`<line x1="${X0+c*W}" y1="${Y0}" x2="${X0+c*W+4*dx}" y2="${Y0+4*dy}" stroke="var(--line)"/>`;
 // bar fronts
 DOM.forEach((d,c)=>{const x=X0+c*W;s+=`<g data-d="${d}">${P([[x,Y0],[x+W,Y0],[x+W,Y0+H],[x,Y0+H]],'var(--ks)','var(--kc)')}<text x="${x+W/2}" y="${Y0+28}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--kc)">${d}</text><text x="${x+W/2}" y="${Y0+48}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--kc)">${nm[c]}</text></g>`;});
 // annotations
 const ar='var(--pri)';
 s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${ar}"/></marker></defs>`;
 s+=`<line x1="${X0}" y1="34" x2="${X0+6*W}" y2="34" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text x="${X0}" y="24" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Scientific practices: 6 domains, 27 skills','Thực hành khoa học: 6 lĩnh vực, 27 kỹ năng')}</text>`;
 s+=`<line x1="190" y1="${Y0+H+5*SH}" x2="190" y2="${Y0+H+6}" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text transform="translate(176 ${Y0+H+5*SH}) rotate(-90)" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Cognitive complexity: 5 tiers','Độ phức tạp nhận thức: 5 bậc')}</text>`;
 s+=`<line x1="${X0+6*W+12}" y1="${Y0+H+22}" x2="${X0+6*W+12+4*dx}" y2="${Y0+H+22+4*dy}" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text x="${X0+6*W+100}" y="${Y0+H+44}" text-anchor="end" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Performance quality','Chất lượng thực hiện')}</text><text x="${X0+6*W+100}" y="${Y0+H+62}" text-anchor="end" font-size="12" fill="var(--muted)">${T('4 levels: E, D, P, Ex','4 mức: E, D, P, Ex')}</text>`;
 return `<figure class="fig3d"><svg viewBox="70 0 720 480" role="img" aria-label="${T('Three-dimensional T-shaped framework: scientific practices across, cognitive complexity down, performance quality in depth','Mô hình chữ T ba chiều: thực hành khoa học theo chiều ngang, độ phức tạp nhận thức theo chiều dọc, chất lượng thực hiện theo chiều sâu')}">${s}</svg></figure>`;}

 {d:'D',en:['D. Analyzing data','Simple tables and charts; mean with guidance; conclusion pointing to data; difference from prediction','Patterns and trends; spreadsheet graphs and simple statistics; conclusion with specific values, compared with prediction; predictions for further work','Descriptive statistics and multi-variable displays; discrepancies → model revision; validity, reliability, alternative interpretations','Variability and uncertainty; inferential/relational techniques; effect sizes; correlation vs. causation','Multivariable or model-based analyses with assumption checks; automated analysis; sensitivity checks and comparison with literature; limits of generalization'],

 {d:'E',en:['E. Constructing explanations','Explain an observation with a classroom idea; point to one supporting observation; simple "X because Y" statement; with prompts, say what an explanation leaves out','Explain a result with a named concept; ≥2 specific pieces of evidence; cause–effect chain with an intermediate step; point out a specific weakness and a fix','Explain data patterns with a theory or model; evidence from more than one source; step-by-step causal mechanism; gaps in own explanation and evidence needed','CER explanation addressing unexplained results; strength of evidence judged against data quality and uncertainty; joint effects of several factors, causal vs. correlational; explanations tested against alternatives','Explanation integrating published findings and compared with competing explanations; argument weighing all evidence; interacting factors and untested parts; written critical feedback (peer review)'],
  vi:['E. Xây dựng giải thích','Giải thích một quan sát bằng một ý tưởng đã học; chỉ ra một quan sát hỗ trợ; câu đơn giản “X vì Y”; với gợi ý, nêu điều lời giải thích còn bỏ sót','Giải thích kết quả bằng một khái niệm được gọi tên; ≥ 2 bằng chứng cụ thể; chuỗi nhân quả có một bước trung gian; chỉ ra một điểm yếu cụ thể và cách khắc phục','Giải thích quy luật dữ liệu bằng lý thuyết hoặc mô hình; bằng chứng từ nhiều nguồn; cơ chế nhân quả từng bước; khoảng trống trong giải thích của mình và bằng chứng cần thêm','Giải thích CER xử lý các kết quả chưa giải thích được; đánh giá độ mạnh bằng chứng theo chất lượng dữ liệu và độ không đảm bảo; tác động kết hợp của nhiều yếu tố, nhân quả hay tương quan; kiểm chứng với các cách giải thích khác','Giải thích tích hợp kết quả đã công bố và so sánh với các giải thích cạnh tranh; lập luận cân nhắc mọi bằng chứng; yếu tố tương tác và phần chưa kiểm chứng; phản hồi phê phán bằng văn bản (phản biện)']},
 {d:'F',en:['F. Communicating information','State the main idea of a short text; whether a report gives evidence and who produced it; titled, labeled chart; poster on a template','Summarize key ideas and what graphs show; check media reports for source, evidence, and exaggeration; graph types suited to data, with units; short report with the main sections',"Explain how a text's data lead to its conclusions; validity of a primary study's sample, measurements, and controls; captioned figures and citations; structured report",'Explain question, method, results, and statistics of primary articles; appraise design, sample, analysis and compare sources; uncertainty shown in figures; IMRaD paper with every claim supported, oral defense','Read unadapted articles and synthesize studies; evaluate a body of literature for replication and bias; field-standard figures; paper meeting journal/competition guidelines, revised after review'],
  vi:['F. Truyền đạt thông tin','Nêu ý chính của một văn bản ngắn; báo cáo có đưa bằng chứng không và ai viết; biểu đồ có tiêu đề, có nhãn; poster theo mẫu','Tóm tắt ý chính và những gì đồ thị thể hiện; kiểm tra bài báo truyền thông về nguồn, bằng chứng và sự phóng đại; dạng đồ thị phù hợp dữ liệu, có đơn vị; báo cáo ngắn có các phần chính','Giải thích dữ liệu của văn bản dẫn đến kết luận thế nào; tính hợp lệ của mẫu, phép đo và kiểm soát trong một nghiên cứu gốc; hình có chú thích và trích dẫn; báo cáo có cấu trúc','Giải thích câu hỏi, phương pháp, kết quả và thống kê của bài báo gốc; đánh giá thiết kế, mẫu, phân tích và so sánh các nguồn; thể hiện độ không đảm bảo trong hình; bài báo IMRaD với mọi nhận định có căn cứ, bảo vệ miệng','Đọc bài báo nguyên bản và tổng hợp các nghiên cứu; đánh giá một tập tài liệu về khả năng lặp lại và thiên lệch; hình theo chuẩn chuyên ngành; bài báo đạt hướng dẫn của tạp chí/cuộc thi, chỉnh sửa sau phản biện']},
 {sep:1,en:['Statistics & tools','Tables, bar/line charts, mean (guided)','Means, percentages, spreadsheet graphs','Mean, median, range, scatter plots, trend lines, category coding','SD, SE, error bars; t-test/ANOVA, chi-square, correlation/regression, thematic coding; spreadsheet, JASP, jamovi, Python, R','Multiple regression, two-way ANOVA, non-parametric, logistic regression; inter-coder agreement; R, Python, JASP, jamovi'],
  vi:['Thống kê & công cụ','Bảng, biểu đồ cột/đường, trung bình (có hướng dẫn)','Trung bình, phần trăm, đồ thị bảng tính','Trung bình, trung vị, khoảng biến thiên, biểu đồ phân tán, đường xu hướng, mã hóa theo nhóm','SD, SE, thanh sai số; kiểm định t/ANOVA, chi bình phương, tương quan/hồi quy, mã hóa theo chủ đề; bảng tính, JASP, jamovi, Python, R','Hồi quy bội, ANOVA hai yếu tố, kiểm định phi tham số, hồi quy logistic; độ đồng thuận giữa người mã hóa; R, Python, JASP, jamovi']},
 {en:['Ethics & safety','Teacher-written risk assessment; student safety checklist; teacher-written anonymous questions','Risk assessment with guidance; informed and parental consent; BSL-1 only','Student-written risk assessment and consent documents; teacher approval','Proposal-level ethics documents; supervising teacher or panel approval','School review panel approval; validated instruments; host-lab approval for external work'],
  vi:['Đạo đức & an toàn','Giáo viên viết đánh giá rủi ro; phiếu kiểm tra an toàn cho học sinh; câu hỏi ẩn danh do giáo viên viết','Đánh giá rủi ro có hướng dẫn; đồng thuận có hiểu biết và đồng ý của phụ huynh; chỉ BSL-1','Học sinh tự viết đánh giá rủi ro và hồ sơ đồng thuận; giáo viên phê duyệt','Hồ sơ đạo đức ở mức đề cương; giáo viên hướng dẫn hoặc hội đồng phê duyệt','Hội đồng của trường phê duyệt; công cụ đã kiểm định; phòng thí nghiệm đối tác phê duyệt khi làm bên ngoài']},
 {en:['Assessment','Checklist feedback only','MS Assessment form – summative Week 18','Checklist feedback only','HS Assessment form – summative Week 43','Checklist feedback only'],
  vi:['Đánh giá','Chỉ phản hồi theo phiếu kiểm tra','Phiếu MS – đánh giá tổng kết tuần 18','Chỉ phản hồi theo phiếu kiểm tra','Phiếu HS – đánh giá tổng kết tuần 43','Chỉ phản hồi theo phiếu kiểm tra']}
 ]};
function renderDp(){const el=$('#dp');const lg=VI()?'vi':'en';const H=DP.hdr[lg];const tgt=i=>i===2||i===4;
 el.innerHTML=head('',T('SR curriculum, Grades 7–11: domain progression','Chương trình NCKH lớp 7–11: tiến trình theo lĩnh vực'),{label:'Link file',title:'CIEC 26 0706 SR learning design model_Map.xlsx',url:'https://dinhthienly.sharepoint.com/:x:/r/sites/repository/Shared%20Documents/General/CIEC/2026-2027/1.%20Work%20Items/16.%20LSTS%20Student%20Standards/01.%20Scientific%20Research/5.%20Others/CIEC%2026%200706%20SR%20learning%20design%20model_Map.xlsx?d=wc14952ea15fd4bf39b5d050881338a71&csf=1&web=1&e=3lWqv2'})+
 `<div class="sub fade-in"><div class="tbl"><table class="dpt"><thead><tr>${H.map((h,i)=>`<th class="${tgt(i)?'tgt':''}">${esc(h)}${tgt(i)?`<small>${T('Formal SR assessment','Đánh giá NCKH chính thức')}</small>`:''}</th>`).join('')}</tr></thead><tbody>${DP.rows.map(r=>`<tr${r.d?` data-d="${r.d}"`:''}${r.sep?' class="sep"':''}>${r[lg].map((c,i)=>`<td class="${tgt(i)?'tgt':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}

/* ---------- learning design ---------- */
let g=store.get('ldg','G8'),st=-1;
const sd=s=>(s||'').trim()[0];
const dname=s=>VI()?DOM_VI[sd(s)]:s.slice(3);
const wk=w=>VI()?w.replace(/Weeks?/,'Tuần'):w;
function renderLd(){const el=$('#ld');const L=DATA.ld[g];const LV=LD_VI[g];const total=L.stages[L.stages.length-1].end;const S=L.stages[st];
 const sname=i=>VI()?LD_VI.stages[i]:L.stages[i].stage;const det=i=>VI()?LV.detail[i]:L.stages[i];const cpt=i=>VI()?LV.checkpoints[i]:L.stages[i].checkpoint;const rows=st<0?L.stages.map((s,i)=>i):[st];
 const notes=VI()?LV.notes:L.notes;
 const cps=[...new Set(L.stages.flatMap(s=>[...s.checkpoint.matchAll(/\bWeek\s(\d+)\s–/g)].map(m=>+m[1])))].filter(w=>w<=total).sort((a,b)=>a-b);
 el.innerHTML=head('',T('SR learning design model map','Bản đồ mô hình thiết kế dạy học NCKH'),{label:'Link file',title:'CIEC 26 0706 SR learning design model_Map.xlsx',url:'https://dinhthienly.sharepoint.com/:x:/r/sites/repository/Shared%20Documents/General/CIEC/2026-2027/1.%20Work%20Items/16.%20LSTS%20Student%20Standards/01.%20Scientific%20Research/5.%20Others/CIEC%2026%200706%20SR%20learning%20design%20model_Map.xlsx?d=wc14952ea15fd4bf39b5d050881338a71&csf=1&web=1&e=3lWqv2'})+
 `<div class="tabs" role="tablist"><button role="tab" data-g="G8" aria-selected="${g==='G8'}">${T('Grade 8 (18 weeks)','Lớp 8 (18 tuần)')}</button><button role="tab" data-g="G10" aria-selected="${g==='G10'}">${T('Grade 10 (43 weeks)','Lớp 10 (43 tuần)')}</button></div>
 <div class="sub fade-in"><dl class="gen">${notes.map(n=>{const i=n.indexOf(':');return `<dt>${esc(n.slice(0,i))}</dt><dd>${esc(n.slice(i+1).trim())}</dd>`}).join('')}</dl>
 <div class="stages"><button class="stage all" data-s="-1" aria-pressed="${st<0}"><span class="sn">${T('Overview','Tổng quát')}</span><span class="st">${T('All stages','Tất cả giai đoạn')}</span><span class="sw">${T('Weeks','Tuần')} 1–${total}</span></button>${L.stages.map((s,i)=>`<button class="stage" data-d="${sd(s.primary)}" data-s="${i}" aria-pressed="${i===st}"><span class="sn">${T('Stage','Giai đoạn')} ${i+1}</span><span class="st">${esc(sname(i).replace(/^\d+\.\s*/,''))}</span><span class="sw">${esc(wk(s.weeks))}</span></button>`).join('')}</div>
 <p class="note" style="margin-top:6px"><b>${T('Checkpoint weeks:','Tuần có mốc kiểm tra:')}</b> ${cps.map(w=>`<span class="chip">${T('Week','Tuần')} ${w}</span>`).join('')}</p>
 <div class="tbl"><table class="ldt"><thead><tr><th>${T('Stage','Giai đoạn')}</th><th>${T('Primary standard','Chuẩn chính')}</th><th>${T('Supporting standard','Chuẩn hỗ trợ')}</th><th>${T('Indicators emphasised','Chỉ báo nhấn mạnh')}</th><th>${T('Knowledge boundary','Phạm vi kiến thức')}</th><th>${T('Know','Biết')}</th><th>${T('Understand','Hiểu')}</th><th>${T('Do','Làm')}</th><th>${T('Evidence','Minh chứng')}</th><th>${T('Checkpoint and remediation','Mốc kiểm tra và bồi dưỡng')}</th></tr></thead><tbody>${rows.map(i=>{const s=L.stages[i],d=det(i);return `<tr data-d="${sd(s.primary)}"><td><b>${esc(sname(i))}</b><span class="wk">${esc(wk(s.weeks))}</span></td><td>${esc(dname(s.primary))}</td><td>${esc(dname(s.supporting))}</td><td>${esc(d.indicators)}</td><td>${esc(d.boundary)}</td><td>${bullets(d.K)}</td><td>${bullets(d.U)}</td><td>${bullets(d.D)}</td><td>${bullets(d.evidence)}</td><td class="cp">${esc(cpt(i))}</td></tr>`}).join('')}</tbody></table></div>
</div>`;
 el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;st=-1;store.set('ldg',g);renderLd()});
 el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st=+b.dataset.s;renderLd()});}

/* ---------- shell ---------- */
const tabs=[...document.querySelectorAll('[role=tab].pill')];
let curTab=null;
function openTab(id,focus){curTab=id;tabs.forEach((t,i)=>{const on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;if(on){$('#count').textContent=`${u('section')} ${i+1} / ${tabs.length}`;$('#prog').style.width=((i+1)/tabs.length*100)+'%';if(focus)t.focus()}});store.set('tab',id);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
tabs.forEach((t,i)=>{t.onclick=()=>{openTab(t.getAttribute('aria-controls'));window.scrollTo({top:0})};t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];openTab(n.getAttribute('aria-controls'),true)}}});
function renderAll(){document.documentElement.lang=VI()?'vi':'en';
 $('.top h1').textContent=u('title');$('#foot').textContent=u('foot');
 document.title=u('title');
 tabs.forEach(t=>{t.textContent=T(...UI.tabs[t.getAttribute('aria-controls')])});
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 renderPlan();renderStd();renderDp();renderTool();renderGuide();renderLd();
 if(curTab)openTab(curTab);}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('ui_lang',lang);renderAll()});
renderAll();
const start=(location.hash||'').slice(1);openTab(['plan','std','dp','tool','guide','ld'].includes(start)?start:store.get('tab','std'));
