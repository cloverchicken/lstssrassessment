 scientific literature or of media reports of science and discuss the validity and reliability of the data, hypotheses, and conclusions.", "vi": "Đọc phê phán các tài liệu khoa học gốc hoặc các bài báo khoa học trên truyền thông, thảo luận về tính hợp lệ và độ tin cậy của dữ liệu, giả thuyết và kết luận"}, "tiers": [{"en": "Identify whether a simple report gives evidence for its claim and who produced it.", "vi": "Nhận biết một báo cáo đơn giản có đưa ra bằng chứng cho nhận định hay không và ai là người viết báo cáo."}, {"en": "Evaluate a media report about science by checking its source, whether it gives evidence for its claims and signs of bias of axeggeration (e.g., a headline that overstates the findings).", "vi": "Đánh giá một bài báo khoa học trên truyền thông bằng cách kiểm tra nguồn, xem bài có đưa bằng chứng cho các luận điểm không, và tìm dấu hiệu thiên lệch hoặc phóng đại (ví dụ: tiêu đề nói quá kết quả nghiên cứu)."}, {"en": "Assess the validity of a primary study by checking whether its sample, measurements and controls are adequate to support its hypothesis and conclusions.", "vi": "Đánh giá tính hợp lệ của một nghiên cứu gốc bằng cách kiểm tra mẫu, cách đo và các đối chứng có đủ để ủng hộ giả thuyết và kết luận của nghiên cứu hay không.."}, {"en": "Critically appraise research reports by evaluating the design, sample, analysis and whether the conclusions follow from the results, and compare the credibility of several sources on the same question.", "vi": "Thẩm định phản biện các báo cáo nghiên cứu bằng cách đánh giá thiết kế, mẫu, phân tích và việc kết luận có xuất phát từ kết quả hay không, đồng thời so sánh độ tin cậy của nhiều nguồn về cùng một câu hỏi."}, {"en": "Evaluate the validity, reliability and contribution of studies within a body of literature, taking into account replication, consistency across studies, and possible publication or funding bias.", "vi": "Đánh giá tính hợp lệ, độ tin cậy và đóng góp của các nghiên cứu trong tổng thể tài liệu của lĩnh vực, có tính đến việc lặp lại nghiên cứu, mức độ nhất quán giữa các nghiên cứu, và khả năng thiên lệch do công bố hoặc do nguồn tài trợ."}]}]}], "forms": {"MS": {"domains": [{"code": "A", "name": "Asking questions", "indicator": "Formulate testable questions from observations and refine the question at least once so that it names what will be changed and what will be measured; explain why a question can or cannot be answered with evidence; ask follow-up questions that request the evidence behind a claim and questions about where results differ from the prediction.", "evidence": "Research-reading journal question-sorting task (Stage 1); question log with revision history (Stage 2).", "checkpoints": "Wk 4 diagnostic; Wk 6 question approval.", "levels": ["Question is not testable, or is taken from the teacher list without adaptation; no refinement recorded.", "Testable question with one variable/factor, but refinement from observations is missing or superficial; follow-up questions are vague.", "Testable question within the teacher topic, refined at least once from recorded observations or an initial investigation so that it names what will be changed and what will be measured; explains why a question can or cannot be answered with evidence and rewrites an opinion-based question as a testable one; asks at least one follow-up question about the evidence behind a claim or about where results differ from the prediction.", "Meets P, and asks counter-questions that challenge an interpretation and propose an alternative explanation, or states the expected form of the relationship and how each variable will be measured."]}, {"code": "B", "name": "Developing models", "indicator": "Construct and use at least one labeled diagram or model of the investigated system (required for every project) that shows how components are connected; identify specific limitations of the model and explain how they affect what it can show; and suggest or test simple improvements based on observations or evidence.", "evidence": "Labeled model/diagram in research plan (Stage 3); model-limitation note in analysis (Stage 5); model discussed in report (Stage 6).", "checkpoints": "Wk 8 plan gate; Wk 14 provisional; Wk 18 final review.", "levels": ["No model, or an unlabeled drawing that does not show relationships.", "Labeled model shows components, but relationships to variables/factors are unclear; no limitation identified.", "Labeled model shows key components and how they are connected, is used to explain the prediction, and at least one specific limitation (scale, missing detail, assumption) is identified and its effect on what the model can show is explained in light of the data.", "Meets P, and the model is revised after data collection, or two models/designs are compared using results."]}, {"code": "C", "name": "Planning investigations", "indicator": "Develop a hypothesis that links the independent and dependent variables with a scientific reason; identify independent, dependent, and control variables (or, for surveys and observations, the factors and participants); decide what data to collect and select suitable tools with a reason; write a step-by-step procedure and complete a risk assessment with guidance. Record data accurately with units, and note deviations, limitations of the measurement technique, and obvious sources of error.", "evidence": "Research plan with variables/factors table, step-by-step procedure and risk assessment (Stage 3); consent and debrief materials where people are involved (stage 3); dated logbook with raw data, deviations and error notes (Stage 4).", "checkpoints": "Wk 8 plan gate; Wk 10 logbook check; Wk 12 raw data submitted.", "levels": ["Plan lacks a hypothesis, variables, or data table; data incomplete or unrecorded.", "IV and DV (or factors) identified with some controls; procedure or risk assessment incomplete; data recorded, but units, deviations, or error notes are missing.", "Hypothesis that links IV and DV with a scientific reason (“If …, then …, because …”); IV, DV and at least two controlled variables (or, for surveys and observations, the factors and participants); other factors that could affect the results named, and those to be kept the same identified as controlled variables; step-by-step procedure; risk assessment completed with guidance; data recorded accurately with units; deviations, limitations of the measurement technique, and obvious error sources noted.", "Meets P, and several confounding factors are anticipated and their likely effect on the results is predicted; the procedure is adjusted during collection with documented reasons."]}, {"code": "D", "name": "Analyzing data", "indicator": "Organize data in tables and graphs using spreadsheet tools and describe patterns with simple calculations (e.g., means, percentages); where results differ from the prediction, suggest possible causes and choose the most likely one; state a conclusion supported by specific data values and say whether the data support or contradict the prediction; and use the patterns to make a prediction for a new condition or propose a question for further investigation.", "evidence": "Analysis workbook and written analysis: patterns, comparison with prediction, anomalies (Stage 5); results and discussion sections of the report (stage 6).", "checkpoints": "Wk 14 provisional; Wk 16 Report; Wk 18 final review.", "levels": ["Data not organized, or graph type inappropriate; conclusion not based on data.", "Appropriate table/graph and pattern described, but simple statistics, comparison with the prediction, or anomalies missing; conclusion only partly supported.", "Appropriate tables/graphs made with a spreadsheet; simple calculations (e.g., means, percentages) correct; pattern described with specific values; where results differ from the prediction, possible causes listed and the most likely one chosen with a reason; conclusion answers the question, is supported by specific data values, and states whether the data support or contradict the prediction; a prediction for a new condition or a question for further investigation proposed.", "Meets P, and the variability between trials or respondents (e.g., range) is described and used in judging the conclusion; the proposed next investigation is justified from the pattern."]}, {"code": "E", "name": "Constructing explanations", "indicator": "Explain a result using a named scientific concept, supported by at least two specific pieces of evidence from the investigation, with a cause–effect chain that includes at least one intermediate step. Point out a specific weakness in their own or a classmate's explanation and suggest how to fix it.", "evidence": "Claim–evidence explanation in report (Stage 6); Q&A notes and reflection with revision proposal (Stage 7).", "checkpoints": "Wk 16 report; Wk 18 final review.", "levels": ["Claim not linked to evidence, or scientifically incorrect.", "Claim supported by a general reference to results; reasoning incomplete; no weakness identified.", "Result explained with a named scientific concept, supported by at least two specific pieces of evidence, with a cause–effect chain that includes at least one intermediate step; a specific weakness in own or a peer’s explanation identified and a fix suggested.", "Meets P, and an alternative explanation is considered and ruled in or out with evidence."]}, {"code": "F", "name": "Communicating information", "indicator": "Present findings in a short report and a presentation that include the main sections, graph types suited to the data, and labeled axes and units; summarize the key ideas of scientific texts and what their graphs show; and evaluate a media report for its source, evidence, and signs of bias or exaggeration, comparing it with their own findings.", "evidence": "Research-reading journal (Stage 1); comparison with an external source (Stage 5); report and presentation (Stages 6–7).", "checkpoints": "Wk 4 diagnostic; Wk 16 report; Wk 18 final review.", "levels": ["Report missing major sections; representations unclear; external sources not evaluated.", "Most report sections present; representations mostly clear; judgment of external sources superficial.", "Complete G8 report (question, method, results, conclusion) with graph types suited to the data, labeled axes and units; oral presentation delivered; key ideas of at least one scientific text, and what its graphs show, summarized accurately; at least one media report evaluated for its source, evidence, and signs of bias or exaggeration, and compared with own findings.", "Meets P, and the report follows scientific conventions beyond P (figure and table captions, in-text citations with a reference list), or explains how a text’s data lead to its conclusions."]}]}, "HS": {"domains": [{"code": "A", "name": "Asking questions", "indicator": "Develop and justify a precise, testable scientific question derived from models, theories, or prior studies that specifies the mechanism or relationship to be investigated, defines variables operationally, judges feasibility with available resources, and is refined by probing its own assumptions.", "evidence": "Critical-appraisal forms and annotated bibliography (Stage 1); problem statement, rationale and question revision history (Stage 2).", "checkpoints": "Wk 3 diagnostic; Wk 5 question approval.", "levels": ["Question is broad, not measurable, or not linked to any model, theory, or prior study.", "Testable question with measurable variables, but the link to theory or prior studies, the operational definitions, or the feasibility justification is weak.", "Precise, testable question derived from models, theories or prior studies (≥5 reviewed sources) that specifies the mechanism or relationship; variables defined operationally; feasibility justified; refinement documented, including at least one assumption of the question probed and revised.", "Meets P, and the question addresses an unresolved question, inconsistency or untested context in the reviewed sources, or a gap original to the wider field."]}, {"code": "B", "name": "Developing models", "indicator": "Develop and use an annotated conceptual model plus one additional model type; compare the models on accuracy, scope, and assumptions and justify the choice; test at least one assumption against the data or the literature; and revise the model using the data. In design projects, refine prototypes through test-and-improve cycles, using data to decide trade-offs.", "evidence": "Annotated conceptual model + one additional model type (Stage 3); model revision based on data (Stages 4–5).\nNote:  Minimum evidence: an annotated conceptual model plus one additional model type (mathematical, physical, or computational), revised in light of the data.", "checkpoints": "Wk 9 proposal review; Wk 13 approval gate; Wk 31 summative; Wk 43 final review", "levels": ["Only one simple model; assumptions not stated.", "Conceptual model plus another model type, but comparison or evaluation of assumptions is superficial.", "Annotated conceptual model plus one additional model type; models compared on accuracy, scope, and assumptions and the choice justified; at least one assumption tested against the data or the literature; model revised using the data.", "Meets P, and models are iteratively refined and used to make quantitative predictions tested against the data."]}, {"code": "C", "name": "Planning investigations", "indicator": "Design and conduct an investigation by choosing and justifying an experimental, quasi-experimental, correlational, or field design; formulating a theory-based hypothesis that involves more than one variable or an interaction and states what result would refute it; selecting tools by comparing their precision and reliability; justifying the sample size or number of trials from expected or pilot variability; applying design controls for confounders and checking that they worked; and implementing documented, reproducible procedures with the required risk assessment and ethics approval.", "evidence": "Research proposal, risk assessment, ethics/consent documents, pilot notes (Stage 3); research log, protocol-modification record, mid-point report (Stage 4).\nNote: Justify sampling and sample size, pilot-test procedures, and document all protocol deviations; data collection begins only after the proposal, risk assessment, and ethics review are approved.", "checkpoints": "Wk 9 proposal review; Wk 13 approval gate; Wk 18 log audit.", "levels": ["Proposal lacks a justified design, variables, or approvals; data collection inconsistent.", "Variables/factors and controls identified, but the refutation criterion, sampling/sample size, or reliability is not justified; deviations partly documented.", "Theory-based hypothesis involving more than one variable or an interaction and stating what result would refute it; design (experimental, quasi-experimental, correlational, or field) chosen and justified for the question; tools chosen by comparing precision and reliability; variables or factors identified (for experiments: IV, DV and at least three controlled variables); design controls for key confounders (e.g., matching, counterbalancing, random assignment) and a check after data collection that they worked; sample size or number of trials justified from expected or pilot variability; pilot-tested; approved proposal, risk assessment and ethics documents; all deviations logged; procedure reproducible.", "Meets P, and blinding, stratified or block randomization, or statistical adjustment is used for subtle confounders; instruments are piloted and evidence of their accuracy and reliability is reported; the protocol is adapted only with documented justification."]}, {"code": "D", "name": "Analyzing data", "indicator": "Analyze data using descriptive statistics with uncertainty plus at least one justified inferential or relational technique (e.g., t-test/ANOVA, chi-square, correlation/regression), run in statistical software with the steps documented; qualitative projects use systematic coding plus at least one quantified component. Evaluate conclusions with effect sizes, distinguishing correlation from causation and stating the uncertainty; evaluate conflicting data by checking error sources and design flaws and justify revisions to models or designs; and formulate a testable follow-up hypothesis from patterns such as interactions, non-linear trends, or subgroup differences.", "evidence": "Analysis file with statistical outputs and analysis-justification note; draft results section (Stage 5); Results and Discussion of the revised paper (Stage 6)", "checkpoints": "Wk 31 provisional; Wk 42 final paper, Wk 43 final review", "levels": ["Only descriptive summaries, or calculation errors; conclusions overstated.", "Descriptive statistics with uncertainty are correct, but the inferential/relational technique is missing, unjustified, or misinterpreted.", "Descriptive statistics with SD/SE/error bars plus at least one justified inferential or relational technique interpreted correctly (p-value and effect size, conceptually), run in statistical software with the steps documented so the analysis can be repeated; correlation distinguished from causation and uncertainty stated; qualitative projects use systematic coding plus at least one quantified component; conflicting data checked for error sources and design flaws and revisions justified; strength and limitations of the conclusion assessed; a testable follow-up hypothesis formulated from an identified pattern (e.g., interaction, non-linear trend, subgroup difference).", "Meets P, and test assumptions are checked, alternative analyses compared, or uncertainty quantified in a way that materially strengthens the conclusions."]}, {"code": "E", "name": "Constructing explanations", "indicator": "Construct and defend a claim–evidence–reasoning explanation that links the findings to theory and model(s) and explains the mechanism; explain how several factors jointly produce the effect, with their direction and approximate size, and whether the claim is causal or correlational; judge how strongly the evidence supports it given data quality and uncertainty; and test it against alternative explanations, addressing results it does not fully account for and revising it in response.", "evidence": "Discussion section of the paper (Stage 6); oral defense and reflection essay (Stage 7).", "checkpoints": "Wk 36 draft; Wk 42 final paper; Wk 43 defense.", "levels": ["Explanation not supported by own evidence or theory.", "Explanation links evidence and theory, but the causal mechanism or alternatives are underdeveloped.", "CER explanation linking the findings to theory and model(s) and explaining the mechanism; the contribution of each main factor (direction, approximate size) explained and the claim stated as causal or correlational; strength of the evidence judged against data quality and uncertainty; at least one alternative explanation tested against the evidence and at least one unexplained result addressed; explanation defended with evidence in the panel Q&A.", "Meets P, and the explanation integrates published findings with own evidence, is compared with at least one competing explanation, and states the conditions under which it holds."]}, {"code": "F", "name": "Communicating information", "indicator": "Present quantitative results with representations of variability and uncertainty; explain the question, method, results, and statistics of the primary articles reviewed; produce an IMRaD research paper, poster, and oral defense in which every claim is supported by evidence or a citation; and appraise the design, sample, analysis, and conclusions of research reports, comparing the credibility of several sources on the same question.", "evidence": "Appraisal forms (Stage 1); full paper with peer-review responses, poster and presentation (Stage 6).", "checkpoints": "Wk 3 diagnostic; Wk 36 draft; Wk 42 final paper.", "levels": ["Paper incomplete or not in IMRaD form; sources not appraised.", "Complete IMRaD paper, but representations or referencing inconsistent; literature appraisal mostly descriptive.", "Complete IMRaD paper with abstract, captioned figures/tables that show variability and uncertainty, and correct referencing; every claim supported by evidence or a citation; peer-review responses documented; clear poster and oral defense; question, method, results, and statistics of the reviewed primary articles explained accurately; design, sample, analysis, and conclusions of the sources appraised and the credibility of several sources on the same question compared.", "Meets P, and the paper meets the author guidelines of a chosen journal or competition, or the findings of several studies are synthesized to place the results in context."]}]}}, "guideNote": "Use with Guidelines Table 3 (E/D/P/Ex). Tick the level whose descriptor is fully met; if between two levels, tick the lower. Proficient descriptors contain the core demand of the target tier in SR Standards 2026. Nothing listed as “not required” in the learning design’s Knowledge boundary may be used to lower a score, but a learning design may not remove the core demand of the target-tier descriptor. When choosing between two levels, also consider the degree of independence described in Table 3.", "ld": {"G8": {"stages": [{"stage": "1. Foundations", "weeks": "Weeks 1–4", "start": 1, "end": 4, "primary": "F. Communicating Information", "supporting": "A. Asking Questions", "indicators": "Summarize the key ideas of age-appropriate scientific texts and explain what their tables or graphs show (F2); identify the main sections of scientific reporting (question, method, results, conclusion) (F3); evaluate selected media reports about science by checking their source, whether they give evidence for their claims, and signs of bias or exaggeration (F4); explain why a question can be answered with evidence while another depends on opinion, and rewrite an opinion-based question as a testable one (A2).", "boundary": "Teacher-selected, age-appropriate examples from different research fields. Students work with accessible scientific texts, excerpts, tables, diagrams, graphs, and media reports. Full critical appraisal of complete primary research articles is not required; evaluation focuses on whether data, hypotheses, and conclusions are reasonably supported.", "K": "- Common research methods and the types of research questions they are suited to address. \n- Major components and features of a basic research report. \n- Common forms of scientific evidence and data representation. \n- Basic distinctions between evidence/fact-based and opinion-based questions.", "U": "- Scientific claims are trustworthy only to the extent that they are backed by evidence others can examine; not every question can be answered scientifically.", "D": "- Compare research examples and identify the research question, method, data/evidence, and conclusion. \n- Interpret basic scientific texts, tables, diagrams, and graphs. \n- Distinguish scientific from nonscientific questions and give a basic reason for the distinction. \n- Recognize the main features of a research report. \n- Make a basic judgment about whether the data presented reasonably support a hypothesis or conclusion.", "evidence": "- Research-reading journal: analysis template for 2–3 research examples (question – method – evidence – conclusion).\n- Question-sorting task (scientific vs. nonscientific; fact- vs. opinion-based) with reasons.", "checkpoint": "Week 4 – Diagnostic check on F and A (MS form, formative only). Students scoring ≤2 on domain F or A (judged mainly from F2 and A2 evidence) receive a guided re-reading task during Weeks 5–6."}, {"stage": "2. Problem Identification", "weeks": "Weeks 5–6", "start": 5, "end": 6, "primary": "A. Asking Questions", "supporting": "E. Constructing Explanations", "indicators": "Ask “why” questions about the causes of phenomena or problems (A1); revise questions after initial observations or trials so that they name what will be changed and what will be measured or observed (A3); ask follow-up questions that request the evidence behind a claim or clarify how a conclusion was reached (A4); ask questions about where observations differ from what was expected (A5); point out a specific weakness in an explanation and suggest how to fix it (E4). In design-oriented projects (e.g., Energy, Robotics), define a simple design problem with several criteria for success and constraints on materials, time, or cost (A1).", "boundary": "Research problems and questions are developed within a teacher-provided topic or context. Students are not expected to identify an original research gap, demonstrate novelty, or independently establish a new research topic. Questions should be investigable using methods and resources appropriate to G8 and accessible in the school context.", "K": "- Research problem and research question.\n- Characteristics of an investigable research question.\n- Roles of observations and initial investigations in refining questions.\n- Purposes of follow-up questions and questions arising from patterns, contradictions, or unexpected observations.", "U": "- Research questions become more useful when they are refined in response to observations and initial investigations.", "D": "- Formulate a research problem and an initial research question from a teacher-provided topic.\n- Refine the research question based on observations or an initial investigation.\n- Ask follow-up questions to clarify or further examine an idea or argument.\n- Ask questions about patterns, contradictions, or unexpected observations.", "evidence": "- Question log: observation notes, initial question, refined question with revision history, follow-up questions.", "checkpoint": "Week 6 – Teacher approves the research question (A, formative). Domain A ≤2 → revision conference before Week 7; flagged for remediation."}, {"stage": "3. Method Development", "weeks": "Weeks 7–8", "start": 7, "end": 8, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Formulate a hypothesis that links the independent and dependent variables and is supported by a scientific idea or prior evidence (“If …, then …, because …”) (C1); determine what data are needed, select suitable tools, and decide how measurements or observations will be recorded (C2); plan an experimental or field-research procedure and identify relevant independent, dependent, and control variables where applicable (C4); recognize factors other than the independent variable that could affect the results and identify which of them must be kept the same as controlled variables (C5). Construct a labeled diagram or model of the system or set-up showing key components, variables/factors, and their relationships (B1), and use it to explain the expected result (B2).", "boundary": "Methods are limited to those appropriate for G8 and feasible within the selected field and school context. For experimental investigations, students identify independent, dependent, and relevant control variables; for other approaches, appropriate factors, parameters, or data sources may be identified instead. Tools and procedures should be accessible to G8 students. Every project produces at least one model (e.g., labeled system diagram, process flowchart, physical model, or simple mathematical relationship) as required evidence for Domain B; formal conceptual frameworks or advanced methodological justification are not required. Only school-approved materials and procedures may be used; a teacher-checked risk assessment is required before data collection, projects involving people (e.g., surveys, observations, behavioural tasks) require informed consent (with parental consent for participants under 18), voluntary participation with the right to withdraw, anonymity and confidentiality, teacher-approved questions or tasks, minimal psychological risk, and a debrief where participants are not told the full purpose in advance. Projects with living organisms follow school biosafety rules: BSL-1 microorganisms only, under teacher supervision, with school-approved culturing and disposal procedures.", "K": "- Basic principles of experimental/research design.\n- Hypothesis and prediction.\n- Independent, dependent, and control variables, or other relevant factors where appropriate.\n- Types of data and appropriate data-collection/measurement tools.\n- Factors other than the independent variable that could affect the results, and which of them to keep the same as controlled variables.\n- Purposes of models (representing, explaining, predicting) and how to label components and relationships.\n- Basic laboratory/field safety, risk assessment, and voluntary/anonymous participation for surveys.", "U": "- Different research questions require different investigation methods, and a fair investigation requires careful alignment among the question, method, relevant variables or factors, and the data to be collected.", "D": "- Formulate a hypothesis/prediction when appropriate.\n- Select an investigation method appropriate to the research question.\n- Determine what data are needed and how they will be collected and recorded.\n- Identify relevant variables/factors and possible confounding influences.\n- Plan reasonable ways to control or account for relevant factors.\n- Decide which factors must be kept the same as controlled variables.\n- Design a fair and feasible investigation.\n- Use a model or diagram when it meaningfully supports the investigation.\n- Complete a risk assessment (and participation plan where relevant) before data collection.", "evidence": "- Research plan (template): hypothesis/prediction, variables/factors table, data-table design, procedure, tools.\n- Labeled model/diagram of the system or set-up.\n- Risk assessment (and survey/participation plan if relevant).", "checkpoint": "Week 8 – Plan approval gate: no data collection until plan, model, and risk assessment are approved. C and B scored formatively; domains ≤2 → plan conference and revision at the start of Week 9."}, {"stage": "4. Data Collection", "weeks": "Weeks 9–12", "start": 9, "end": 12, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Use appropriate tools and recording procedures to gather the required data (C2); record measurements or observations accurately with units, identify limitations of the measurement techniques, and note obvious sources of error (C3); carry out the planned procedure consistently while managing relevant variables or factors (C4); keep the identified controlled variables the same during data collection (C5). In design-oriented investigations, test models or designs and use observed results to compare or refine solutions where appropriate (B4).", "boundary": "Students collect manageable data sets using school-accessible instruments, observation/survey tools, or other field-appropriate methods.Repeated trials and systematic data collection are not required; measurements or observations are recorded accurately with units. Students are expected to identify obvious limitations and take reasonable steps to reduce or account for sources of error; formal uncertainty analysis, error propagation, or advanced reliability analysis is not required. All safety conditions in the approved risk assessment must be followed throughout data collection.", "K": "- Accurate recording of measurements and observations with units. \n- Measurement or data-collection limitations and common sources of error. \n- Relevant variables/factors and possible confounding influences. \n- Consistency in implementing an investigation procedure.", "U": "- The quality of evidence is determined while it is being collected: errors or inconsistencies that are not recorded at the time cannot be corrected afterwards.", "D": "- Carry out a fair investigation according to the agreed plan. \n- Use selected tools and recording procedures appropriately. \n- Record observations and measurements systematically. \n- Monitor relevant variables/factors and record important deviations from the plan. \n- Identify and take reasonable steps to address major sources of error or factors that may affect the results.\n- Follow the approved safety procedures at all times.", "evidence": "- Dated research logbook with raw data tables, deviations, and error notes.\n- Photos of the set-up.\n- For design projects: test records of each prototype version.", "checkpoint": "Week 10 – Logbook check (C, formative). Students at ≤2 complete or correct their records (units, deviations, error notes) with teacher guidance in Weeks 11–12. Week 12 – raw data submitted."}, {"stage": "5. Analysis", "weeks": "Weeks 13–14", "start": 13, "end": 14, "primary": "D. Analyzing Data", "supporting": "E. Constructing Explanations", "indicators": "Organize data in tables and graphs and use simple calculations (e.g., means, percentages, differences) to describe patterns and trends with specific values (D1); identify where the data differ from the prediction, suggest possible causes, and choose the most likely one with a reason (D2); use appropriate computational tools to organize, visualize, and interpret data through tables and graphs (D3); state a conclusion that answers the question, support it with specific data values, and say whether the data support or contradict the prediction (D4); use observed patterns to make a prediction for a new condition or propose a question for further investigation (D5). Support emerging explanations with at least two specific pieces of evidence from their own investigation (E2); explain results using a named scientific concept and a cause–effect chain with at least one intermediate step (E1, E3). Identify specific limitations of their model or diagram (e.g., scale, missing parts, simplifying assumptions) and explain how each affects what the model can show in light of the data (B3); compare findings with a media report on the same topic, checking its source, evidence, and signs of bias or exaggeration (F4).", "boundary": "Analysis uses methods appropriate to G8 and the research context, such as tables, graphs, comparisons, percentages, averages/basic calculations, or basic qualitative categorization where appropriate. Spreadsheet or graphing tools may be used to organize, visualize, and interpret data. Advanced inferential statistics or specialized analytical software are not expected.", "K": "- Methods for organizing, analyzing, and interpreting data. \n- Patterns, trends, relationships, discrepancies, and unexpected results.\n- Appropriate tables, graphs, and basic computational tools. \n- Stating a conclusion supported by specific data values. \n- Relationship between data, evidence, explanation, and conclusion.\n- Limitations of models (scale, missing details, assumptions).", "U": "- Patterns in data become evidence only when they are analyzed systematically; unexpected or conflicting results are information to be explained, not errors to be ignored.", "D": "- Organize and represent data appropriately. \n- Identify and describe patterns, trends, or relationships. \n- Compare results with the hypothesis, prediction, or initial expectation. \n- Examine unexpected or conflicting results and propose plausible evidence-based explanations.\n- State a conclusion supported by specific data values and say whether the data support or contradict the prediction. \n- Use identified patterns to suggest a prediction, hypothesis, or possible direction for further investigation.\n- Identify at least one limitation of their model in light of the data.\n- Compare their findings with a published or media source and comment on agreement and reliability.", "evidence": "- Analysis workbook (spreadsheet tables and graphs).\n- Written analysis: patterns, comparison with prediction, anomalies, model-limitation note, comparison with an external source.", "checkpoint": "Week 14 – Provisional D score (and B via model-limitation note) recorded on the MS form; confirmed at the Week 18 portfolio review together with the report (Stage 6). Where a remediation output is re-scored, the higher of the two scores is recorded. Any A–D domain ≤2 → remediation plan agreed with the student; remediation tasks completed alongside report writing in Weeks 15–16."}, {"stage": "6. Communication", "weeks": "Weeks 15–16", "start": 15, "end": 16, "primary": "F. Communicating Information", "supporting": "E. Constructing Explanations", "indicators": "Communicate findings with table or graph types suited to the data, labeled axes and units, and a description of what they show (F1); write a short report and give a presentation that include the main sections of scientific reporting (F3); explain the results using a named scientific concept, showing how it links to what was observed (E1); support the explanation with at least two specific pieces of evidence from their own investigation (E2); explain how a cause leads to the effect through at least one intermediate step (E3).", "boundary": "A complete research report at G8 level communicates the investigation coherently, including the research problem/question, method, data/results, and evidence-based explanation/conclusion, with other components adapted to the research field. Students use scientific conventions appropriate to G8; a formal journal-style research article is not expected.", "K": "- Major structure and features of a complete G8 research report. \n- Features of scientific written and oral communication. \n- Appropriate use of text, tables, graphs, diagrams, and mathematical representations. \n- Relationship among data/evidence, scientific concepts, explanations, and conclusions.", "U": "- Effective scientific communication lets an audience follow the path from question to evidence to conclusion and judge the conclusion for themselves.", "D": "- Construct an evidence-based explanation of the findings. \n- Select specific evidence that supports or challenges the explanation. \n- Produce a complete G8-level research report. \n- Use appropriate text and data representations to communicate findings clearly. \n- Prepare an oral/visual presentation of the research findings.\n- Include the model/diagram and explain how the results support, change, or limit it.", "evidence": "- Complete G8 research report.\n- Presentation slides or poster.\n- Remediation task outputs (if flagged).\n- Results and discussion sections of the report are the second piece of evidence for Domain D (D1, D4, D5).", "checkpoint": "Week 16 – Report submitted; E and F scored. Remediation outputs re-scored for flagged A–D domains."}, {"stage": "7. Showcase & Reflection", "weeks": "Week 17-18", "start": 17, "end": 18, "primary": "E. Constructing Explanations", "supporting": "F. Communicating Information", "indicators": "Support explanations with specific pieces of evidence when responding to questions (E2); point out a specific weakness in their own or others’ explanations and suggest how to fix it (E4); present findings orally with suitable, labeled graphs and the main sections of scientific reporting (F1, F3).", "boundary": "Reflection focuses on the quality of the evidence-based explanation: whether claims are supported by evidence, where the explanation is incomplete or weak, and how it could reasonably be improved. Students are not expected to conduct sophisticated methodological critique or formally defend research at a professional level.", "K": "- Criteria for an evidence-based explanation. \n- Common gaps or weaknesses in scientific explanations. \n- Ways evidence and feedback can be used to strengthen research communication and explanations.", "U": "- Scientific explanations become stronger when their weaknesses are identified and claims are reconsidered in light of evidence and constructive feedback.", "D": "- Present the completed research clearly. \n- Respond to questions by referring to specific evidence from the investigation. \n- Identify a gap or weakness in their own or others’ explanation. \n- Explain how the evidence supports, challenges, or limits a conclusion. \n- Suggest a reasonable revision or improvement to strengthen the explanation or research communication.", "evidence": "- Showcase presentation (Q&A notes or recording).\n- Peer-feedback forms.\n- Written reflection with a revision proposal.\n- Complete evidence portfolio.", "checkpoint": "Week 18 – Summative portfolio review on the MS Assessment form (Tier 2): final A–F scores and proficiency decision (Guidelines, Section 3). Remaining domains ≤2 recorded as remediation targets for G9. Before the Week 18 decisions, teachers of the grade calibrate on two anonymised sample portfolios, and at least 10% of portfolios (including all borderline decisions) are second-marked."}], "notes": ["Target: Tier 2 (Applies with some independence).", "Context: Guided field exploration.", "Independence: Students make selected research decisions within teacher-provided topics/contexts.", "Complexity: School-accessible methods, manageable datasets, basic scientific representations and reporting.", "Outcome: Students can formulate/refine questions, plan and conduct investigations, analyze evidence, construct explanations, and communicate findings across different research contexts."], "fields": ["Mathematics", "Energy: Sustainable Materials & Design", "Materials Science", "Microbiology", "Robotics & Intelligent Machines", "Behavioral & Social Science: Cognitive & Social Psychology", "Earth & Environmental Sciences", "Behavioral & Social Science: Society & Human Culture"]}, "G10": {"stages": [{"stage": "1. Foundations", "weeks": "Weeks 1-3", "start": 1, "end": 3, "primary": "F. Communicating Information", "supporting": "A. Asking Questions", "indicators": "Read primary research articles (full or adapted) and explain the research question, method, main results, and conclusions, including statistical results reported in figures and tables (F2); critically appraise research reports by evaluating the design, sample, analysis, and whether the conclusions follow from the results, and compare the credibility of several sources (F4); recognize the conventions of a full research report in standard format (e.g., IMRaD) (F3); distinguish questions that require new empirical data from those that can be answered from the literature or theoretical analysis (A2).", "boundary": "Students read primary research articles and review articles selected or approved by the teacher in the field of their intended project (about 5–8 sources). They evaluate alignment among problem, method, evidence, and conclusion and identify methodological strengths and weaknesses. Not required: systematic reviews or meta-analyses, evaluation of statistical models beyond grade-level mathematics, or a publishable literature review.", "K": "- Structure and conventions of primary research and review articles.\n- Research designs: experimental, quasi-experimental, correlational, observational/field, survey, design-based.\n- Validity (internal/external), reliability, and reproducibility.\n- Common sources of bias (sampling, measurement, confirmation, publication).\n- Search strategies, source credibility, and citation (APA/IEEE).\n- Empirical vs. theoretical research questions.", "U": "- Scientific knowledge is built through rigorous investigation, critical evaluation of evidence, and scholarly communication.", "D": "- Analyze published research papers.\n- Evaluate strengths and weaknesses of studies.\n- Identify research gaps, patterns, and unanswered questions.\n- Maintain an annotated bibliography with full citations.", "evidence": "- Critical-appraisal forms for at least 3 articles.\n- Annotated bibliography (5–8 sources).", "checkpoint": "Week 3 – Diagnostic scoring of F and A (HS form, formative). Students at ≤2 redo a guided appraisal with teacher feedback in Weeks 4–5."}, {"stage": "2. Problem Identification", "weeks": "Weeks 4-5", "start": 4, "end": 5, "primary": "A. Asking Questions", "supporting": "E. Constructing Explanations", "indicators": "Formulate questions derived from models, theories, or prior studies that specify the mechanism or relationship to be investigated; in design-oriented projects, define a design problem with multiple criteria and constraints and prioritize them (A1); develop and justify precise, testable questions linked to theory-based hypotheses, defining variables operationally and judging feasibility with available resources (A3); ask probing questions that expose the assumptions, premises, and potential biases behind an argument, a data interpretation, or their own research question, and use them to refine the question (A4); identify contradictions across data sets or studies and construct questions whose answers would resolve them, specifying the evidence required (A5); evaluate the validity of explanations in the sources by testing them against the evidence and alternative explanations (E4).", "boundary": "The research problem is derived from the sources reviewed in Foundations: students identify an unresolved question, an inconsistency, or an untested local context within those sources and justify its significance and feasibility. Questions must be feasible with school or partner resources within Weeks 6–23. Not required: demonstrating originality in the wider field or a comprehensive literature review (Tier 5 / G11–12). Scoring: locating a gap or inconsistency is the task, but Domain A is scored against the Tier 4 descriptors; a student is not scored down for failing to find a genuine gap in the wider literature (gap-based questions are Tier 5 in A1 and A3).", "K": "- Research problem, research question, objectives, and scope.\n- Types of research gaps (contextual, methodological, conflicting evidence).\n- Criteria for a precise, testable question: measurable variables, feasibility, ethical acceptability.\n- Writing a problem statement and rationale.", "U": "- Meaningful research advances understanding by addressing questions that have not yet been fully answered.", "D": "- Conduct a focused preliminary literature review building on the Foundations sources.\n- Identify gaps or inconsistencies across the reviewed sources.\n- Formulate and refine a research question.\n- Justify the significance and feasibility of the study.", "evidence": "- Problem statement and rationale (about 1 page) with citations.\n- Research question with revision history.", "checkpoint": "Week 5 – Research-question approval (A, formative). Domain A ≤2 → revision conference; the question must be approved before Method Development begins."}, {"stage": "3. Method Development", "weeks": "Weeks 6-13", "start": 6, "end": 13, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Develop hypotheses that involve more than one variable or an interaction, are grounded in a theoretical model, and state what result would refute them (C1); select tools and methods by comparing their precision and reliability (e.g., resolution, calibration, test–retest consistency) and justify the choice (C2); justify the sample size or number of trials from the variability expected or observed in a pilot, and explain how precision and accuracy affect validity and reliability (C3); choose an experimental, quasi-experimental, correlational, or field design appropriate to the question and justify the choice, with a risk assessment and the required ethics approval (C4); analyze how confounding variables could bias the results and apply appropriate design controls (e.g., matching, counterbalancing, random assignment) (C5). Construct detailed, annotated diagrams of the system (B1); explain the phenomenon with several models, compare them on accuracy, scope, and assumptions, and justify the choice (B2); identify the assumptions underlying the model, test at least one against the literature or pilot data, and propose evidence-based improvements (B3); in design-oriented projects, refine a model or prototype through test-and-improve cycles, using data to decide trade-offs (B4).", "boundary": "Students select and justify their research design, sampling, and measurement methods, and develop a conceptual model plus at least one other model type (e.g., mathematical, physical, computational) as required evidence for Domain B. A research proposal, risk assessment, and ethics review must be approved before data collection: human-participant studies require informed consent (parental consent for minors), voluntary participation with the right to withdraw, anonymity and confidentiality, minimal psychological risk, a debrief where relevant, and approval by the supervising teacher or school review panel; microbiology work is limited to BSL-1 organisms under supervision; hazardous chemicals, sharps, and unsupervised fieldwork are not permitted without an approved risk assessment. Not required: formal power analysis, validated psychometric scale development, or multivariate designs beyond two factors. A simple two-factor design (or one manipulated variable plus a measured moderator) is expected when it is needed to test the C1 hypothesis.", "K": "- Research designs and when to use them; randomization, control groups, blinding (where feasible).\n- Sampling methods and sample-size considerations.\n- Validity, reliability, accuracy, precision, and uncertainty.\n- Operational definitions and measurement instruments (including questionnaire design where relevant).\n- Confounding variables and control strategies.\n- Types of models (conceptual, mathematical, physical, computational) and their assumptions.\n- Research ethics (informed consent, confidentiality, organism-handling rules) and risk assessment.", "U": "- A well-designed investigation minimizes bias, generates valid evidence, and enables meaningful interpretation of results.", "D": "- Develop theory-informed hypotheses that state what result would refute them.\n- Design a rigorous investigation.\n- Select appropriate tools, sampling methods, and measurements.\n- Construct and justify models or conceptual frameworks.\n- Complete a risk assessment and ethics review (consent forms where relevant).\n- Pilot-test instruments and procedures.", "evidence": "- Research proposal: hypothesis, design, variables table, sampling, instruments, analysis plan.\n- Annotated conceptual model + one additional model type.\n- Risk assessment; ethics/consent documents.\n- Pilot-test notes.", "checkpoint": "Week 9 – Proposal draft review (peer + teacher; C and B formative). Week 13 – Approval gate: no data collection without an approved proposal, risk assessment, and ethics documents. Domains ≤2 at Week 9 → revision cycle in Weeks 10–13, re-checked at the Week 13 gate."}, {"stage": "4. Data Collection", "weeks": "Weeks 14-23", "start": 14, "end": 23, "primary": "C. Planning Investigations", "supporting": "B. Developing Models", "indicators": "Collect and record data using tools and methods evaluated for precision and reliability (C2); carry out the data-collection plan while monitoring how precision, accuracy, and sample size affect reliability (C3); implement documented, reproducible procedures with controlled variables (C4); monitor confounding variables, apply the planned controls, and check after data collection whether they worked (C5); refine models or designs through test-and-improve cycles, documenting each version (B4).", "boundary": "Students independently implement procedures and may adapt protocols when unexpected issues arise while maintaining research integrity. All adaptations are logged and approved by the supervising teacher; the safety and ethics conditions of the approved proposal remain binding. Not required: formal error propagation beyond grade-level mathematics or professional-grade instrumentation.", "K": "- Research-log conventions and data management (versioning, backups, raw vs. processed data).\n- Random and systematic error; instrument uncertainty.\n- Protocol deviations and how to document them.\n- Data integrity, confidentiality, and ethical data handling.", "U": "- Reliable evidence requires systematic implementation of research procedures and continuous monitoring of data quality.", "D": "- Conduct independent investigations.\n- Implement data collection protocols.\n- Monitor reliability and validity.\n- Document modifications and unexpected observations.\n- Maintain comprehensive research records.", "evidence": "- Research log (dated entries, deviations, uncertainty notes).\n- Raw data files.\n- Protocol-modification record.\n- Mid-point progress report.", "checkpoint": "Week 18 – Mid-point progress report and log audit (C, formative). Domain C ≤2 → corrective plan (additional trials/sampling) completed by Week 23."}, {"stage": "5. Analysis", "weeks": "Weeks 24-31", "start": 24, "end": 31, "primary": "D. Analyzing Data", "supporting": "E. Constructing Explanations", "indicators": "Analyze data using measures of variability and uncertainty and appropriate inferential or relational techniques (e.g., t-test, chi-square, correlation/regression) or systematic qualitative coding (D1); evaluate conflicting data (within their own data or against published findings) by checking possible sources of error and design flaws, and propose and justify revisions to the model or design (D2); use statistical or specialized software to run analyses and explore relationships between variables, documenting the steps so that the analysis can be repeated (D3); evaluate conclusions using inferential statistics and effect sizes, distinguishing correlation from causation and stating the uncertainty (D4); identify patterns such as interactions, non-linear trends, or subgroup differences and formulate a testable hypothesis for a follow-up study (D5). Evaluate how strongly the evidence supports or challenges the explanation, taking into account data quality, uncertainty, and model limitations (E2).", "boundary": "Analysis uses descriptive statistics with measures of spread and uncertainty (standard deviation, standard error, error bars) and at least one inferential or relational technique matched to the design: t-test or one-way ANOVA to compare group means; chi-square for categorical data; correlation/linear regression for relationships; thematic coding for qualitative data. Tools: spreadsheet analysis tools or software such as JASP, jamovi, Python, or R where available. Students justify the choice of technique and interpret p-values and effect sizes conceptually. Not required: multivariate or Bayesian methods, or derivation of statistical formulas. Qualitative projects: thematic coding meets D1, but D4 at Tier 4 requires inferential reasoning with effect sizes, so qualitative projects include at least one quantified component (e.g., theme frequencies compared across groups with chi-square, or a short closed-item questionnaire), or use an alternative D4 criterion approved in advance as a documented exception.", "K": "- Descriptive statistics and uncertainty (SD, standard error, error bars).\n- Choosing a technique: t-test/ANOVA, chi-square, correlation/regression, qualitative coding.\n- Assumptions of tests; p-values and effect size (conceptual).\n- Outliers and anomalies: identification and justified treatment.\n- Correlation vs. causation; uncertainty and limitations of conclusions.", "U": "- Data interpretation requires critical evaluation of evidence, not simply identifying patterns.", "D": "- Analyze data using appropriate quantitative or qualitative techniques.\n- Evaluate anomalies and conflicting evidence.\n- Assess the strength of findings.\n- Generate new hypotheses or future research directions.\n- Justify the choice of statistical or analytical technique.", "evidence": "- Analysis file (raw → processed data, statistical outputs).\n- Draft results section with figures.\n- Analysis-justification note.", "checkpoint": "Week 31 – Provisional D score (and B from model revision) recorded on the HS form; confirmed at the Week 43 portfolio review together with the paper (Stage 6). Where a remediation output is re-scored, the higher of the two scores is recorded. Any A–D domain ≤2 → remediation plan; remediation completed in Weeks 32–36 alongside drafting."}, {"stage": "6. Communication", "weeks": "Weeks 32-42", "start": 32, "end": 42, "primary": "F. Communicating Information", "supporting": "E. Constructing Explanations", "indicators": "Present quantitative results with representations of variability and uncertainty (e.g., error bars, confidence intervals) integrated with text and diagrams (F1); produce a full research report in IMRaD format with an abstract, in which every claim is supported by evidence or a citation (F3); construct a claim–evidence–reasoning explanation that connects the findings to theory or a model, explains the mechanism, and addresses at least one result it does not fully account for (E1); explain how several factors jointly produce the effect, including the direction and approximate size of each, and state whether the evidence supports a causal or only a correlational claim (E3).", "boundary": "Students communicate findings using discipline-appropriate scientific conventions and engage critically with feedback and alternative interpretations. Work proceeds through structured drafting cycles within the existing weeks: full draft (Week 36), structured peer review (Week 37), revision (Weeks 38–40), poster and presentation rehearsal (Weeks 41–42). A school template is used. Not required: journal submission or publication-standard formatting.", "K": "- IMRaD structure, abstract writing, and scientific style.\n- Figure and table design, captions, and reporting statistical results.\n- Claim–Evidence–Reasoning linked to theory.\n- Poster and oral-presentation design.\n- Referencing (APA/IEEE) chi tiết thiếu, giả định) và giải thích, dựa trên dữ liệu, hạn chế đó ảnh hưởng thế nào đến những gì mô hình thể hiện được.", "Đạt P, và mô hình được chỉnh sửa sau khi thu thập dữ liệu, hoặc so sánh hai mô hình/thiết kế dựa trên kết quả."]}, {"code": "C", "name": "Lập kế hoạch nghiên cứu", "indicator": "Xây dựng giả thuyết liên kết biến độc lập và biến phụ thuộc, có lý do khoa học; xác định biến độc lập, phụ thuộc và kiểm soát (hoặc, với khảo sát và quan sát, các yếu tố và người tham gia); quyết định dữ liệu cần thu và chọn công cụ phù hợp có lý do; viết quy trình từng bước và hoàn thành đánh giá rủi ro có hướng dẫn. Ghi dữ liệu chính xác, có đơn vị, và ghi chú sai lệch, giới hạn của kỹ thuật đo và các nguồn sai số rõ ràng.", "levels": ["Kế hoạch thiếu giả thuyết, biến hoặc bảng dữ liệu; dữ liệu không đầy đủ hoặc không được ghi.", "Xác định được biến độc lập và phụ thuộc (hoặc các yếu tố) và một số biến kiểm soát; quy trình hoặc đánh giá rủi ro chưa đầy đủ; có ghi dữ liệu nhưng thiếu đơn vị, sai lệch hoặc ghi chú sai số.", "Giả thuyết liên kết biến độc lập và phụ thuộc với lý do khoa học (“Nếu …, thì …, vì …”); biến độc lập, phụ thuộc và ít nhất hai biến kiểm soát (hoặc, với khảo sát và quan sát, các yếu tố và người tham gia); nêu các yếu tố khác có thể ảnh hưởng đến kết quả và xác định yếu tố cần giữ nguyên làm biến kiểm soát; quy trình từng bước; hoàn thành đánh giá rủi ro có hướng dẫn; ghi dữ liệu chính xác, có đơn vị; ghi chú sai lệch, giới hạn của kỹ thuật đo và các nguồn sai số rõ ràng.", "Đạt P, và dự liệu được nhiều yếu tố gây nhiễu cùng ảnh hưởng có thể của chúng đến kết quả; điều chỉnh quy trình trong khi thu thập có ghi lý do."]}, {"code": "D", "name": "Phân tích dữ liệu", "indicator": "Sắp xếp dữ liệu thành bảng và đồ thị bằng bảng tính và mô tả quy luật bằng phép tính đơn giản (ví dụ trung bình, phần trăm); ở chỗ kết quả khác dự đoán, đề xuất nguyên nhân có thể và chọn nguyên nhân khả dĩ nhất; nêu kết luận kèm giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán; dùng quy luật để dự đoán cho một điều kiện mới hoặc đề xuất câu hỏi nghiên cứu tiếp theo.", "levels": ["Dữ liệu không được sắp xếp, hoặc chọn dạng đồ thị không phù hợp; kết luận không dựa trên dữ liệu.", "Bảng/đồ thị phù hợp và mô tả được quy luật, nhưng thiếu thống kê đơn giản, so sánh với dự đoán hoặc xem xét điểm bất thường; kết luận chỉ được hỗ trợ một phần.", "Bảng/đồ thị phù hợp làm bằng bảng tính; phép tính đơn giản (ví dụ trung bình, phần trăm) đúng; mô tả quy luật kèm giá trị cụ thể; ở chỗ kết quả khác dự đoán, liệt kê nguyên nhân có thể và chọn nguyên nhân khả dĩ nhất có lý do; kết luận trả lời câu hỏi, được hỗ trợ bằng giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán; đề xuất dự đoán cho điều kiện mới hoặc câu hỏi nghiên cứu tiếp theo.", "Đạt P, và mô tả độ biến thiên giữa các lần đo hoặc người trả lời (ví dụ khoảng biến thiên) và dùng nó khi đánh giá kết luận; nghiên cứu tiếp theo được lập luận từ quy luật."]}, {"code": "E", "name": "Xây dựng giải thích", "indicator": "Giải thích kết quả bằng một khái niệm khoa học được gọi tên, hỗ trợ bằng ít nhất hai bằng chứng cụ thể từ nghiên cứu, với chuỗi nhân quả có ít nhất một bước trung gian. Chỉ ra một điểm yếu cụ thể trong giải thích của mình hoặc của bạn và đề xuất cách khắc phục.", "levels": ["Nhận định không gắn với bằng chứng, hoặc sai khoa học.", "Nhận định được hỗ trợ bằng việc dẫn chung chung kết quả; lập luận chưa đầy đủ; không nêu điểm yếu.", "Kết quả được giải thích bằng một khái niệm khoa học được gọi tên, hỗ trợ bằng ít nhất hai bằng chứng cụ thể, với chuỗi nhân quả có ít nhất một bước trung gian; chỉ ra một điểm yếu cụ thể trong giải thích của mình hoặc của bạn và đề xuất cách khắc phục.", "Đạt P, và xem xét một giải thích khác rồi chấp nhận hoặc loại bỏ nó bằng bằng chứng."]}, {"code": "F", "name": "Truyền đạt thông tin", "indicator": "Trình bày kết quả bằng một báo cáo ngắn và một bài thuyết trình có đủ các phần chính, dạng đồ thị phù hợp với dữ liệu, trục có nhãn và đơn vị; tóm tắt ý chính của văn bản khoa học và những gì đồ thị của văn bản thể hiện; đánh giá một bài báo truyền thông về nguồn, bằng chứng và dấu hiệu thiên lệch hoặc phóng đại, và so sánh với kết quả của mình.", "levels": ["Báo cáo thiếu các phần chính; biểu diễn không rõ; không đánh giá nguồn bên ngoài.", "Có hầu hết các phần của báo cáo; biểu diễn tương đối rõ; đánh giá nguồn bên ngoài còn hời hợt.", "Báo cáo lớp 8 đầy đủ (câu hỏi, phương pháp, kết quả, kết luận) với dạng đồ thị phù hợp dữ liệu, trục có nhãn và đơn vị; đã trình bày miệng; tóm tắt chính xác ý chính của ít nhất một văn bản khoa học và những gì đồ thị của nó thể hiện; đánh giá ít nhất một bài báo truyền thông về nguồn, bằng chứng và dấu hiệu thiên lệch hoặc phóng đại, và so sánh với kết quả của mình.", "Đạt P, và báo cáo theo quy ước khoa học vượt mức P (chú thích hình và bảng, trích dẫn trong bài kèm danh mục tài liệu tham khảo), hoặc giải thích dữ liệu của một văn bản dẫn đến kết luận của nó như thế nào."]}]}, "HS": {"domains": [{"code": "A", "name": "Đặt câu hỏi", "indicator": "Xây dựng và lập luận cho một câu hỏi khoa học chính xác, kiểm chứng được, xuất phát từ mô hình, lý thuyết hoặc nghiên cứu trước, nêu rõ cơ chế hoặc mối quan hệ cần khảo sát, định nghĩa biến theo cách đo được, đánh giá tính khả thi với nguồn lực sẵn có, và được điều chỉnh qua việc chất vấn các giả định của chính câu hỏi.", "levels": ["Câu hỏi rộng, không đo được, hoặc không gắn với mô hình, lý thuyết hay nghiên cứu trước nào.", "Câu hỏi kiểm chứng được với biến đo được, nhưng liên kết với lý thuyết hoặc nghiên cứu trước, định nghĩa thao tác hoặc lập luận về tính khả thi còn yếu.", "Câu hỏi chính xác, kiểm chứng được, xuất phát từ mô hình, lý thuyết hoặc nghiên cứu trước (≥ 5 nguồn đã đọc), nêu rõ cơ chế hoặc mối quan hệ; biến được định nghĩa thao tác; lập luận tính khả thi; có ghi lại quá trình điều chỉnh, gồm việc chất vấn và sửa ít nhất một giả định của câu hỏi.", "Đạt P, và câu hỏi giải quyết một vấn đề chưa được trả lời, một điểm mâu thuẫn hoặc một bối cảnh chưa được kiểm chứng trong các nguồn đã đọc, hoặc một khoảng trống mới đối với lĩnh vực rộng hơn."]}, {"code": "B", "name": "Phát triển mô hình", "indicator": "Xây dựng và sử dụng một mô hình khái niệm có chú thích cùng một loại mô hình khác; so sánh các mô hình về độ chính xác, phạm vi và giả định và lập luận lựa chọn; kiểm chứng ít nhất một giả định với dữ liệu hoặc tài liệu; chỉnh sửa mô hình bằng dữ liệu. Với đề tài thiết kế, cải tiến mẫu thử qua các chu kỳ thử – cải tiến, dùng dữ liệu để cân nhắc đánh đổi.", "levels": ["Chỉ có một mô hình đơn giản; không nêu giả định.", "Có mô hình khái niệm và một loại mô hình khác, nhưng so sánh hoặc đánh giá giả định còn hời hợt.", "Mô hình khái niệm có chú thích và một loại mô hình khác; các mô hình được so sánh về độ chính xác, phạm vi và giả định, có lập luận lựa chọn; ít nhất một giả định được kiểm chứng với dữ liệu hoặc tài liệu; mô hình được chỉnh sửa bằng dữ liệu.", "Đạt P, và mô hình được điều chỉnh lặp lại và dùng để đưa ra dự đoán định lượng được kiểm chứng bằng dữ liệu."]}, {"code": "C", "name": "Lập kế hoạch nghiên cứu", "indicator": "Thiết kế và tiến hành nghiên cứu bằng cách chọn và lập luận cho thiết kế thực nghiệm, bán thực nghiệm, tương quan hoặc thực địa; xây dựng giả thuyết dựa trên lý thuyết, có nhiều hơn một biến hoặc một tương tác và nêu kết quả nào sẽ bác bỏ nó; chọn công cụ bằng cách so sánh độ chụm và độ tin cậy; lập luận cho cỡ mẫu hoặc số lần thử từ độ biến thiên dự kiến hoặc từ thử nghiệm sơ bộ; áp dụng biện pháp kiểm soát biến gây nhiễu trong thiết kế và kiểm tra hiệu quả của chúng; thực hiện quy trình được ghi chép, lặp lại được, với đánh giá rủi ro và phê duyệt đạo đức cần thiết.", "levels": ["Đề cương thiếu thiết kế có lập luận, thiếu biến hoặc phê duyệt; thu thập dữ liệu không nhất quán.", "Xác định được biến/yếu tố và cách kiểm soát, nhưng chưa lập luận cho tiêu chí bác bỏ, cách chọn mẫu/cỡ mẫu hoặc độ tin cậy; ghi sai lệch chưa đầy đủ.", "Giả thuyết dựa trên lý thuyết có nhiều hơn một biến hoặc một tương tác và nêu kết quả nào sẽ bác bỏ nó; thiết kế (thực nghiệm, bán thực nghiệm, tương quan hoặc thực địa) được chọn và lập luận phù hợp với câu hỏi; công cụ được chọn bằng cách so sánh độ chụm và độ tin cậy; xác định biến hoặc yếu tố (với thực nghiệm: biến độc lập, phụ thuộc và ít nhất ba biến kiểm soát); biện pháp kiểm soát biến gây nhiễu chính trong thiết kế (ví dụ ghép cặp, đối trọng, phân nhóm ngẫu nhiên) và kiểm tra hiệu quả sau khi thu thập; cỡ mẫu hoặc số lần thử được lập luận từ độ biến thiên dự kiến hoặc từ thử nghiệm sơ bộ; có thử nghiệm sơ bộ; đề cương, đánh giá rủi ro và hồ sơ đạo đức được duyệt; ghi lại mọi sai lệch; quy trình lặp lại được.", "Đạt P, và dùng làm mù, ngẫu nhiên hóa phân tầng hoặc theo khối, hoặc hiệu chỉnh thống kê cho các biến gây nhiễu khó nhận ra; công cụ được thử nghiệm sơ bộ và có báo cáo bằng chứng về độ chính xác, độ tin cậy; quy trình chỉ được điều chỉnh khi có lập luận ghi lại."]}, {"code": "D", "name": "Phân tích dữ liệu", "indicator": "Phân tích dữ liệu bằng thống kê mô tả có độ không đảm bảo và ít nhất một kỹ thuật suy luận hoặc tương quan có lập luận (ví dụ kiểm định t/ANOVA, chi bình phương, tương quan/hồi quy), chạy bằng phần mềm thống kê và ghi lại các bước; đề tài định tính dùng mã hóa có hệ thống kèm ít nhất một thành phần định lượng. Đánh giá kết luận bằng độ lớn hiệu ứng, phân biệt tương quan với nhân quả và nêu độ không đảm bảo; đánh giá dữ liệu mâu thuẫn bằng cách kiểm tra nguồn sai số và lỗi thiết kế, và lập luận cho việc chỉnh sửa mô hình hoặc thiết kế; xây dựng giả thuyết tiếp theo kiểm chứng được từ các quy luật như tương tác, xu hướng phi tuyến hoặc khác biệt giữa các nhóm con.", "levels": ["Chỉ có tóm tắt mô tả, hoặc tính sai; kết luận phóng đại.", "Thống kê mô tả có độ không đảm bảo đúng, nhưng thiếu kỹ thuật suy luận/tương quan, hoặc không lập luận, hoặc diễn giải sai.", "Thống kê mô tả có SD/SE/thanh sai số và ít nhất một kỹ thuật suy luận hoặc tương quan có lập luận, diễn giải đúng (giá trị p và độ lớn hiệu ứng, ở mức khái niệm), chạy bằng phần mềm thống kê và ghi lại các bước để có thể lặp lại phân tích; phân biệt tương quan với nhân quả và nêu độ không đảm bảo; đề tài định tính dùng mã hóa có hệ thống kèm ít nhất một thành phần định lượng; dữ liệu mâu thuẫn được kiểm tra nguồn sai số và lỗi thiết kế, các chỉnh sửa có lập luận; đánh giá độ mạnh và hạn chế của kết luận; xây dựng giả thuyết tiếp theo kiểm chứng được từ một quy luật đã nhận ra (ví dụ tương tác, xu hướng phi tuyến, khác biệt giữa nhóm con).", "Đạt P, và kiểm tra giả định của kiểm định, so sánh các cách phân tích khác, hoặc định lượng độ không đảm bảo theo cách làm kết luận vững chắc hơn rõ rệt."]}, {"code": "E", "name": "Xây dựng giải thích", "indicator": "Xây dựng và bảo vệ lời giải thích theo mô hình nhận định – bằng chứng – lập luận, liên kết kết quả với lý thuyết và mô hình và giải thích cơ chế; giải thích nhiều yếu tố cùng tạo ra hiệu ứng như thế nào, với chiều và độ lớn gần đúng của từng yếu tố, và nhận định là nhân quả hay tương quan; đánh giá mức độ bằng chứng hỗ trợ dựa trên chất lượng dữ liệu và độ không đảm bảo; kiểm chứng lời giải thích với các cách giải thích khác, xử lý những kết quả nó chưa giải thích được và chỉnh sửa tương ứng.", "levels": ["Giải thích không được hỗ trợ bởi bằng chứng của bản thân hoặc lý thuyết.", "Giải thích có liên kết bằng chứng và lý thuyết, nhưng cơ chế nhân quả hoặc các cách giải thích khác chưa được phát triển.", "Giải thích CER liên kết kết quả với lý thuyết và mô hình và giải thích cơ chế; giải thích đóng góp của từng yếu tố chính (chiều, độ lớn gần đúng) và nêu nhận định là nhân quả hay tương quan; đánh giá độ mạnh của bằng chứng dựa trên chất lượng dữ liệu và độ không đảm bảo; kiểm chứng ít nhất một cách giải thích khác với bằng chứng và xử lý ít nhất một kết quả chưa giải thích được; bảo vệ lời giải thích bằng bằng chứng trong phần hỏi đáp với hội đồng.", "Đạt P, và lời giải thích tích hợp kết quả đã công bố với bằng chứng của bản thân, được so sánh với ít nhất một cách giải thích cạnh tranh, và nêu điều kiện để nó đúng."]}, {"code": "F", "name": "Truyền đạt thông tin", "indicator": "Trình bày kết quả định lượng với biểu diễn độ biến thiên và độ không đảm bảo; giải thích câu hỏi, phương pháp, kết quả và thống kê của các bài báo gốc đã đọc; viết bài báo IMRaD, làm poster và bảo vệ miệng, trong đó mọi nhận định đều có bằng chứng hoặc trích dẫn; đánh giá thiết kế, mẫu, phân tích và kết luận của các báo cáo nghiên cứu, so sánh độ tin cậy của nhiều nguồn về cùng một câu hỏi.", "levels": ["Bài báo chưa hoàn chỉnh hoặc không theo IMRaD; không đánh giá nguồn.", "Bài báo IMRaD đầy đủ, nhưng biểu diễn hoặc trích dẫn không nhất quán; đánh giá tài liệu chủ yếu mang tính mô tả.", "Bài báo IMRaD đầy đủ có tóm tắt, hình/bảng có chú thích thể hiện độ biến thiên và độ không đảm bảo, trích dẫn đúng; mọi nhận định có bằng chứng hoặc trích dẫn; có ghi lại phản hồi phản biện; poster và bảo vệ miệng rõ ràng; giải thích chính xác câu hỏi, phương pháp, kết quả và thống kê của các bài báo gốc đã đọc; đánh giá thiết kế, mẫu, phân tích và kết luận của các nguồn và so sánh độ tin cậy của nhiều nguồn về cùng một câu hỏi.", "Đạt P, và bài báo đáp ứng hướng dẫn tác giả của một tạp chí hoặc cuộc thi đã chọn, hoặc tổng hợp kết quả của nhiều nghiên cứu để đặt kết quả của mình vào bối cảnh."]}]}};
const LD_VI = {
 G8:{notes:["Bậc mục tiêu: Bậc 2 (Vận dụng với mức độ độc lập nhất định).","Bối cảnh: Khám phá lĩnh vực có hướng dẫn.","Mức độ độc lập: Học sinh đưa ra một số quyết định nghiên cứu trong chủ đề/bối cảnh giáo viên giao.","Độ phức tạp: Phương pháp phù hợp điều kiện trường, bộ dữ liệu vừa sức, biểu diễn và báo cáo khoa học cơ bản.","Kết quả đầu ra: Học sinh có thể đặt/điều chỉnh câu hỏi, lập kế hoạch và tiến hành nghiên cứu, phân tích bằng chứng, xây dựng giải thích và truyền đạt kết quả trong các bối cảnh nghiên cứu khác nhau."],
  checkpoints:["Tuần 4 – Kiểm tra chẩn đoán F và A (phiếu MS, chỉ quá trình). Học sinh đạt ≤ 2 ở F hoặc A (chủ yếu dựa trên minh chứng F2 và A2) làm nhiệm vụ đọc lại có hướng dẫn trong tuần 5–6.","Tuần 6 – Giáo viên duyệt câu hỏi nghiên cứu (A, quá trình). A ≤ 2 → trao đổi chỉnh sửa trước tuần 7; đánh dấu cần bồi dưỡng.","Tuần 8 – Cổng duyệt kế hoạch: chưa thu thập dữ liệu khi kế hoạch, mô hình và đánh giá rủi ro chưa được duyệt. Chấm quá trình C và B; lĩnh vực ≤ 2 → trao đổi và chỉnh sửa kế hoạch đầu tuần 9.","Tuần 10 – Kiểm tra sổ nghiên cứu (C, quá trình). Học sinh ≤ 2 hoàn thiện hoặc sửa lại ghi chép (đơn vị, sai lệch, ghi chú sai số) với hướng dẫn của giáo viên trong tuần 11–12. Tuần 12 – nộp dữ liệu thô.","Tuần 14 – Ghi điểm tạm D (và B qua ghi chú hạn chế của mô hình) trên phiếu MS; xác nhận tại đánh giá hồ sơ tuần 18 cùng với báo cáo (Giai đoạn 6). Khi sản phẩm bồi dưỡng được chấm lại, ghi điểm cao hơn. Lĩnh vực A–D ≤ 2 → thống nhất kế hoạch bồi dưỡng với học sinh; hoàn thành song song với viết báo cáo trong tuần 15–16.","Tuần 16 – Nộp báo cáo; chấm E và F. Chấm lại sản phẩm bồi dưỡng của các lĩnh vực A–D đã đánh dấu.","Tuần 18 – Đánh giá tổng kết hồ sơ trên phiếu MS (Bậc 2): điểm cuối A–F và kết luận mức (Hướng dẫn, Mục 3). Lĩnh vực còn ≤ 2 ghi làm mục tiêu bồi dưỡng cho lớp 9. Trước khi kết luận tuần 18, giáo viên khối hiệu chuẩn trên hai hồ sơ mẫu ẩn danh, và ít nhất 10% hồ sơ (gồm mọi trường hợp sát ngưỡng) được chấm lần hai."]},
 G10:{notes:["Bậc mục tiêu: Bậc 4 (Phân tích và đánh giá tốt).","Bối cảnh: Nghiên cứu độc lập có giám sát trong lĩnh vực tự chọn.","Mức độ độc lập: Học sinh tự xác định vấn đề từ tài liệu, tự thiết kế, tiến hành và phân tích nghiên cứu, với các cổng phê duyệt ở tuần 5, 13 và 31.","Độ phức tạp: Giả thuyết dựa trên lý thuyết, chọn mẫu có lập luận, thống kê suy luận phù hợp trình độ, bài báo IMRaD, poster và bảo vệ miệng.","Kết quả đầu ra: Học sinh có thể lập kế hoạch, tiến hành, phân tích và bảo vệ một nghiên cứu đúng đạo đức, có phương pháp vững chắc, đồng thời đánh giá hạn chế và ý nghĩa của nó."],
  checkpoints:["Tuần 3 – Chấm chẩn đoán F và A (phiếu HS, quá trình). Học sinh ≤ 2 làm lại phiếu đánh giá có hướng dẫn và phản hồi của giáo viên trong tuần 4–5.","Tuần 5 – Duyệt câu hỏi nghiên cứu (A, quá trình). A ≤ 2 → trao đổi chỉnh sửa; câu hỏi phải được duyệt trước khi bắt đầu Xây dựng phương pháp.","Tuần 9 – Rà soát bản nháp đề cương (bạn học + giáo viên; C và B quá trình). Tuần 13 – Cổng phê duyệt: chưa thu thập dữ liệu khi đề cương, đánh giá rủi ro và hồ sơ đạo đức chưa được duyệt. Lĩnh vực ≤ 2 ở tuần 9 → chu kỳ chỉnh sửa tuần 10–13, kiểm tra lại ở cổng tuần 13.","Tuần 18 – Báo cáo giữa kỳ và kiểm tra sổ nghiên cứu (C, quá trình). C ≤ 2 → kế hoạch khắc phục (bổ sung thí nghiệm/mẫu) hoàn thành trước tuần 23.","Tuần 31 – Ghi điểm tạm D (và B từ việc chỉnh sửa mô hình) trên phiếu HS; xác nhận tại đánh giá hồ sơ tuần 43 cùng với bài báo (Giai đoạn 6). Khi sản phẩm bồi dưỡng được chấm lại, ghi điểm cao hơn. Lĩnh vực A–D ≤ 2 → kế hoạch bồi dưỡng; hoàn thành trong tuần 32–36 song song với viết bản nháp.","Tuần 36 – Chấm quá trình bản nháp (E, F). Tuần 42 – Nộp bài báo cuối; chấm E và F; chấm lại sản phẩm bồi dưỡng của các lĩnh vực đã đánh dấu.","Tuần 43 – Đánh giá tổng kết hồ sơ trên phiếu HS (Bậc 4): điểm cuối A–F và kết luận mức (Hướng dẫn, Mục 3). Lĩnh vực còn ≤ 2 chuyển làm mục tiêu cho lớp 11. Hiệu chuẩn trên hai hồ sơ mẫu ẩn danh và chấm lần hai ít nhất 10% hồ sơ (gồm mọi trường hợp sát ngưỡng) diễn ra trước tuần 43 và được xếp vào lịch khóa học."]},
