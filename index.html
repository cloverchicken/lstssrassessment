<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSTS Scientific Research Standards – Assessment Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f1f5f9;--ink:#0f172a;--ink2:#1e293b;--body:#1e293b;--muted:#475569;--faint:#64748b;--line:#e2e8f0;
  --pri:#4f46e5;--pri-d:#3730a3;--pri-50:#eef2ff;--pri-100:#e0e7ff;--pri-200:#c7d2fe;--pri-ink:#312e81;
  --ok:#059669;--ok-100:#d1fae5;--ok-200:#a7f3d0;--ok-ink:#065f46;
  --A:#1d4ed8;--As:#eff6ff;--B:#6d28d9;--Bs:#f5f3ff;--C:#c2410c;--Cs:#fff7ed;--D:#047857;--Ds:#ecfdf5;--E:#be123c;--Es:#fff1f2;--F:#475569;--Fs:#f1f5f9;
  --l0:#f8fafc;--l1:#ecfdf5;--l2:#d1fae5;--l3:#059669;--l3ink:#ffffff;
  --warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fde68a;
  --sticky:rgba(255,255,255,.96);--shadow:0 1px 2px 0 rgba(15,23,42,.05);--shadow2:0 1px 3px 0 rgba(15,23,42,.1),0 1px 2px -1px rgba(15,23,42,.1);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
button{font:inherit}

.shell{padding:16px 12px}
@media (min-width:640px){.shell{padding:24px}}
@media (min-width:1024px){.shell{padding:24px 40px}}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);margin:-16px -12px 16px;padding:12px 12px 12px}
@media (min-width:640px){.sticky{margin:-24px -24px 16px;padding:14px 24px 12px}}
@media (min-width:1024px){.sticky{margin:-24px -40px 20px;padding-left:40px;padding-right:40px}}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{margin:0;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.top h1{margin:0;font-size:1.125rem;line-height:1.35;font-weight:800;color:var(--ink)}
@media (min-width:640px){.top h1{font-size:1.25rem}}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.count{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.count.p{border-color:var(--pri-200);background:var(--pri-50);color:var(--pri-d)}
@media (max-width:640px){.count{padding:5px 8px;font-size:.7rem}.top-r{gap:4px}}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress div{height:100%;background:var(--pri);border-radius:999px;transition:width .4s ease}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{flex:none;appearance:none;border:0;font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;background:var(--ok-100);color:var(--ok-ink);transition:background-color .15s}
.pill:hover{background:var(--ok-200)}
.pill[aria-selected="true"]{background:var(--pri);color:#fff;box-shadow:var(--shadow2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
@media (min-width:640px){.card{padding:32px}}
.foot{text-align:center;font-size:.75rem;color:var(--faint);padding-top:8px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
section[role=tabpanel][hidden]{display:none}

.s-head{margin-bottom:16px}
.s-head .meta{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.s-head h2{margin:0;font-size:1.25rem;line-height:1.35;font-weight:700;color:var(--pri-d)}
.goal{background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem;color:var(--pri-ink)}
.goal b{color:var(--pri-d)}
.goal p{color:var(--pri-ink);margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-bottom:20px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{flex:none;appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--body);font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{border-color:var(--pri-200);color:var(--pri)}
.tabs button[aria-selected="true"]{background:var(--pri-50);border-color:var(--pri-200);color:var(--pri-d)}
h3{font-size:1.05rem;font-weight:700;color:var(--ink2);margin:24px 0 10px}
.sub>h3:first-child{margin-top:0}
h4{font-size:.95rem;font-weight:700;color:var(--ink2);margin:16px 0 6px}
p{margin:0 0 10px;color:var(--body);font-size:.9rem}
.note{color:var(--muted);font-size:.85rem}
ul,ol{padding-left:1.25em;margin:0 0 10px;color:var(--body);font-size:.9rem}
li{margin:3px 0}
.tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;color:var(--body)}
th,td{padding:10px 12px;vertical-align:top;text-align:left;border:1px solid var(--line)}
tr>:first-child{border-left:0} tr>:last-child{border-right:0}
thead tr:first-child>*{border-top:0} tbody tr:last-child>*{border-bottom:0}
th{background:var(--surface2);font-weight:700;color:var(--ink2)}
td.k{font-weight:600;white-space:nowrap;color:var(--ink2)}
.notebox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.875rem;color:var(--warn)}
.toolbar{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.toolbar .lab{font-size:.75rem;font-weight:600;color:var(--muted);margin-right:2px}
.toolbar button{appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}
.toolbar button:hover{border-color:var(--pri-200);color:var(--pri)}
.toolbar button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.toolbar .gap{width:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 4px 4px 0;font-size:.8rem;background:var(--surface2);color:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.legend span{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--body)}

/* domain tag (like .kn) */
.kn{display:inline-block;font-weight:700;font-size:.78em;padding:1px 7px;border-radius:6px;white-space:nowrap;color:var(--kc);background:var(--ks)}
.kn.sup{background:transparent;box-shadow:inset 0 0 0 1.5px var(--kc)}
[data-d="A"]{--kc:var(--A);--ks:var(--As)}[data-d="B"]{--kc:var(--B);--ks:var(--Bs)}[data-d="C"]{--kc:var(--C);--ks:var(--Cs)}
[data-d="D"]{--kc:var(--D);--ks:var(--Ds)}[data-d="E"]{--kc:var(--E);--ks:var(--Es)}[data-d="F"]{--kc:var(--F);--ks:var(--Fs)}

/* skill card */
.skill{border:1px solid var(--line);border-left:4px solid var(--kc,var(--pri));border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.skill h3{margin:0 0 10px;color:var(--kc,var(--pri-d));font-size:1rem}
.skill dl{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;margin:0;font-size:.9rem}
.skill dt{font-weight:600;color:var(--muted);font-size:.85rem}
.skill dd{margin:0;color:var(--body)}
.skill dd p{margin:0 0 4px}
.skill dd ul{margin:2px 0 0}
.skill dd .vi{color:var(--muted)}
.skill dd.tgt{background:var(--ks,var(--pri-50));border-radius:8px;padding:6px 10px;margin:-6px 0}
.linkbtn{appearance:none;background:none;border:0;padding:8px 0 0;color:var(--pri);font-weight:600;font-size:.8rem;cursor:pointer}
@media (max-width:640px){.skill dl{grid-template-columns:1fr;gap:2px}.skill dd{margin-bottom:10px}.skill dd.tgt{margin:0 0 10px}}
.gen{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem}
.gen dt{font-weight:700;color:var(--pri-d)}
.gen dd{margin:0;color:var(--pri-ink)}
@media (max-width:640px){.gen{grid-template-columns:1fr;gap:2px}.gen dd{margin-bottom:8px}}

/* indicator with 4-level ladder */
.ind{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ind header{padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line)}
.ind header h4{margin:0;font-size:.95rem}
.ind header .forms{font-size:.85rem;color:var(--body);flex-basis:100%;margin:4px 0 0}
.ind .meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ind .meta div{padding:10px 16px;font-size:.83rem;color:var(--body)}
.ind .meta div+div{border-left:1px solid var(--line)}
.ind .meta b{display:block;font-size:.75rem;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:0}
.ladder li{margin:0;border-right:1px solid var(--line)}
.ladder li:last-child{border-right:0}
.ladder button{appearance:none;display:flex;flex-direction:column;justify-content:flex-start;width:100%;height:100%;text-align:left;border:0;padding:12px 14px;font-size:.85rem;color:var(--body);cursor:pointer;background:transparent}
.ladder button b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="0"]{background:var(--l0)}.ladder li[data-l="1"]{background:var(--l1)}.ladder li[data-l="2"]{background:var(--l2)}
.ladder li[data-l="3"]{background:var(--l3)}.ladder li[data-l="3"] button,.ladder li[data-l="3"] button b{color:var(--l3ink)}
.ladder button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--pri)}
.ladder button[aria-pressed="true"] b::after{content:"  ✓ selected";font-weight:700}
@media (max-width:760px){.ladder{grid-template-columns:1fr}.ladder li{border-right:0;border-bottom:1px solid var(--line)}.ladder li:last-child{border-bottom:0}.ind .meta{grid-template-columns:1fr}.ind .meta div+div{border-left:0;border-top:1px solid var(--line)}}
.summary{position:sticky;bottom:0;z-index:5;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.summary .lb{font-size:.7rem;font-weight:600;color:var(--muted)}
.summary .dec{font-size:1.05rem;font-weight:800;color:var(--pri-d)}
.summary .sc{display:flex;gap:4px}
.summary .sc span{min-width:30px;height:26px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--faint)}
.summary .val{font-size:.85rem;font-weight:600;color:var(--body)}
.summary .reset{margin-left:auto;appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}

/* list items (toc style) */
.toc-list{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.toc-list li{margin:0}
.toc-item{display:grid;grid-template-columns:40px 110px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.toc-item.two{grid-template-columns:40px 1fr}
.toc-item .n{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--pri-50);color:var(--pri)}
.toc-item .w{font-weight:700;font-size:.8rem;color:var(--pri);padding-top:7px}
.toc-item .c b{display:block;font-size:.95rem;font-weight:700;color:var(--ink2);margin-bottom:2px}
.toc-item .c p{margin:0;color:var(--muted);font-size:.85rem}
.toc-item.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.toc-item.warn .n{background:var(--warn-line);color:var(--warn)}
@media (max-width:640px){.toc-item{grid-template-columns:36px 1fr;gap:4px 12px}.toc-item .c{grid-column:1 / -1}}

/* option cards */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.tm{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px}
.tm.rec{border-left-color:var(--pri);background:var(--pri-50);border-color:var(--pri-200)}
.tm h4{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pri);color:#fff}
.tm dl{margin:0;font-size:.85rem}
.tm dt{color:var(--muted);font-size:.75rem;font-weight:600;margin-top:8px}
.tm dd{margin:0;color:var(--body)}
.tm ul{margin:2px 0 0;font-size:.85rem}
.pro li::marker{content:"+  ";color:var(--ok);font-weight:700}
.con li::marker{content:"–  ";color:var(--E);font-weight:700}

/* timeline */
.bar{display:flex;min-height:44px;border-radius:999px;overflow:hidden;margin:6px 0 4px;gap:2px;background:var(--line)}
.bar button{appearance:none;border:0;display:flex;flex-direction:column;justify-content:center;padding:4px 12px;font-size:.72rem;font-weight:700;color:var(--kc);background:var(--ks);text-align:left;cursor:pointer;line-height:1.2;min-width:0;overflow:hidden}
.bar button span{font-weight:500;opacity:.85}
.bar button[aria-pressed="true"]{background:var(--kc);color:#fff}
.ticks{position:relative;height:28px;margin-bottom:12px}
.ticks i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:.68rem;font-weight:600;color:var(--pri);display:flex;flex-direction:column;align-items:center}
.ticks i::before{content:"";width:2px;height:8px;background:var(--pri);margin-bottom:1px;border-radius:2px}
@media (max-width:760px){.bar{flex-direction:column;border-radius:12px}.bar button{flex:none!important;padding:8px 12px;font-size:.8rem}.ticks{display:none}}
.pillv{display:inline-block;min-width:28px;text-align:center;padding:1px 8px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700}
.dash{color:var(--faint)}

.lang{display:inline-flex;border:2px solid var(--pri-200);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--pri-d);font-size:.75rem;font-weight:700;padding:4px 10px;cursor:pointer}
.lang button+button{border-left:2px solid var(--pri-200)}
.lang button[aria-pressed="true"]{background:var(--pri);color:#fff}
@media (max-width:640px){.lang button{padding:3px 8px;font-size:.7rem}}
table.opt th.rec,table.opt td.rec{background:var(--pri-50)}
table.opt th.rec{color:var(--pri-d)}
table.opt tbody th{white-space:normal;background:var(--surface2)}
table.opt{table-layout:fixed}
table.opt td ul{margin:0;font-size:.85rem}
table.std{table-layout:fixed;min-width:980px}
table.std th:first-child,table.std td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);width:160px;box-shadow:1px 0 0 var(--line)}
table.std thead th:first-child{background:var(--surface2)}
table.std th.tgt{background:var(--pri-100);color:var(--pri-d)}
table.std td.tgt{background:var(--pri-50)}
table.std td:first-child b{display:block;color:var(--kc)}
table.std th small{display:block;font-weight:600;color:var(--pri)}
@media (max-width:640px){table.std th:first-child,table.std td:first-child{width:130px}}
.ladder li{padding:12px 14px;font-size:.85rem;color:var(--body)}
.ladder li b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="3"] b{color:var(--l3ink)}
.tabs.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.tabs.dgrid button{white-space:normal;text-align:left;align-items:flex-start;line-height:1.35}
.tabs.dgrid button .kn{margin-top:1px}
@media (max-width:640px){.tabs.dgrid{gap:4px}.tabs.dgrid button{flex-direction:column;gap:4px;padding:6px 8px;font-size:.72rem}}

:root{--t0:#eef2ff;--t1:#e0e7ff;--t2:#c7d2fe;--t3:#818cf8;--t4:#4f46e5}
.ladder.t5{grid-template-columns:repeat(5,1fr)}
.ladder li[data-t="0"]{background:var(--t0)}.ladder li[data-t="1"]{background:var(--t1)}.ladder li[data-t="2"]{background:var(--t2)}
.ladder li[data-t="3"]{background:var(--t3);color:#fff}.ladder li[data-t="4"]{background:var(--t4);color:#fff}
.ladder li[data-t="3"] b,.ladder li[data-t="4"] b,.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{color:#fff}
.ladder .gr{display:block;width:fit-content;font-size:.7rem;font-weight:700;color:var(--pri);margin-bottom:4px}
.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{background:rgba(255,255,255,.2);padding:0 6px;border-radius:6px}
@media (max-width:760px){.ladder.t5{grid-template-columns:1fr}}
.fig3d{margin:0;overflow-x:auto}
.fig3d svg{display:block;width:100%;max-width:760px;min-width:480px;height:auto;margin:0 auto;font-family:var(--sans)}
.ladder li[data-l="3"]{color:var(--l3ink)}

.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.stage{appearance:none;text-align:left;border:2px solid var(--line);border-top:5px solid var(--kc);border-radius:12px;background:var(--surface);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;font:inherit;color:inherit}
.stage:hover{border-color:var(--kc);border-top-width:5px}
.stage .sn{font-size:.7rem;font-weight:700;color:var(--kc)}
.stage .st{font-size:.85rem;font-weight:700;color:var(--ink2);line-height:1.3;overflow-wrap:anywhere}
.stage .sw{font-size:.75rem;font-weight:600;color:var(--muted)}
.stage[aria-pressed="true"]{background:var(--ks);border-color:var(--kc);box-shadow:var(--shadow2)}
@media (max-width:1100px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tlwrap{position:relative;margin:2px 0 4px;padding:4px 0}
.tl{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line)}
.tl span{background:var(--ks)}
.tl span.on{background:var(--kc)}
.tlwrap .dot{position:absolute;top:0;width:3px;height:20px;border-radius:2px;background:var(--pri);transform:translateX(-50%)}
.tlaxis{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--faint)}
</style>
</head>
<body>
<div class="shell">
  <div class="sticky">
    <header class="top">
      <div><h1>LSTS Scientific Research Standards</h1></div>
      <div class="top-r"><span class="count" id="count"></span><span class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="vi">VN</button></span></div>
    </header>
    <div class="progress" aria-hidden="true"><div id="prog"></div></div>
    <nav class="pills" role="tablist" aria-label="Sections">
      <button class="pill" role="tab" id="t-plan" aria-controls="plan"></button>
      <button class="pill" role="tab" id="t-std" aria-controls="std"></button>

<script>
const DATA = {"domains": [{"code": "A", "title": {"en": "Asking questions and defining problems", "vi": "Đặt câu hỏi và xác định vấn đề"}, "def": [{"en": "A practice is to ask and refine questions that lead to descriptions and explanations of how the natural and designed world(s) works and which can be empirically tested.", "vi": "Kỹ thuật thực hành này là đặt và điều chỉnh các câu hỏi dẫn đến mô tả và lý giải phương thức hoạt động của thế giới tự nhiên và thế giới do con người tạo ra, đồng thời có thể kiểm chứng bằng thực nghiệm."}, {"en": "Engineering questions clarify problems to determine criteria for successful solutions and identify constraints to solve problems about the designed world. Both scientists and engineers also ask questions to clarify ideas.", "vi": "Các câu hỏi trong kỹ thuật giúp làm rõ vấn đề, xác định tiêu chí cho giải pháp thành công và nhận diện các ràng buộc để giải quyết vấn đề. Các nhà khoa học và kỹ sư cũng đặt câu hỏi để làm rõ ý tưởng."}], "skills": [{"code": "A1", "name": {"en": "Asking questions about the natural and human-built worlds", "vi": "Đặt câu hỏi về thế giới tự nhiên và thế giới nhân tạo"}, "tiers": [{"en": "Identify basic questions about observations and extend them to explore \"what-if\" scenarios (e.g., what would happen if a variable were changed). Define a simple design problem with one criterion for success.", "vi": "Xác định các câu hỏi cơ bản về quan sát và mở rộng chúng thành các tình huống “nếu… thì…” (ví dụ: điều gì sẽ xảy ra nếu thay đổi một biến). Xác định một vấn đề thiết kế đơn giản với một tiêu chí thành công."}, {"en": "Formulate \"why\" questions to explore underlying causes of natural phenomena, encouraging deeper analysis and critical thinking.  Define a simple design problem with several criteria for success and constraints on materials, time, or cost.", "vi": "Hình thành các câu hỏi “tại sao” để khám phá nguyên nhân sâu xa của hiện tượng tự nhiên, khuyến khích phân tích và tư duy phản biện sâu hơn. Xác định một vấn đề thiết kế đơn giản với một số tiêu chí thành công và các ràng buộc về vật liệu, thời gian hoặc chi phí."}, {"en": "Formulate detailed and specific questions to analyze complex systems and identify underlying patterns. Define a design problem with multiple criteria and constraints, including scientific knowledge that may limit possible solutions.", "vi": "Hình thành các câu hỏi chi tiết và cụ thể để phân tích các hệ thống phức tạp và nhận diện các quy luật tiềm ẩn. Xác định một vấn đề thiết kế với nhiều tiêu chí và ràng buộc, bao gồm cả kiến thức khoa học có thể giới hạn các giải pháp khả thi."}, {"en": "Formulate questions derived from models, theories, or prior studies that specify the mechanism or relationship to be investigated. Define a design problem with multiple criteria and constraints and prioritize them.", "vi": "Hình thành các câu hỏi xuất phát từ mô hình, lý thuyết hoặc các nghiên cứu trước, nêu rõ cơ chế hoặc mối quan hệ cần khảo sát. Xác định một vấn đề thiết kế với nhiều tiêu chí và ràng buộc, đồng thời xếp thứ tự ưu tiên cho chúng."}, {"en": "Formulate questions that identify gaps in existing scientific knowledge or understanding, driving further inquiry and exploration. Define a design problem for a system with interacting components, including social, technical, and/or environmental constraints.", "vi": "Hình thành các câu hỏi xác định các khoảng trống trong tri thức khoa học hiện tại, thúc đẩy tìm tòi và khám phá thêm. Xác định một vấn đề thiết kế cho một hệ thống có các thành phần tương tác, bao gồm các ràng buộc về xã hội, kỹ thuật và/hoặc môi trường."}]}, {"code": "A2", "name": {"en": "Distinguishing a scientific question from a nonscientific question", "vi": "Phân biệt câu hỏi khoa học và câu hỏi phi khoa học"}, "tiers": [{"en": "Sort questions into scientific (testable) and non-scientific (non-testable) and give a simple reason.", "vi": "Phân loại câu hỏi thành câu hỏi khoa học (có thể kiểm chứng) và phi khoa học (không thể kiểm chứng) và nêu lý do đơn giản."}, {"en": "Distinguish between fact-based questions grounded in evidence and opinion-based questions, emphasizing the importance of scientific objectivity.", "vi": "Phân biệt các câu hỏi dựa trên sự thật và bằng chứng với các câu hỏi mang tính ý kiến, nhằm nhấn mạnh tính khách quan của khoa học."}, {"en": "Evaluate how empirical evidence supports or contradicts scientific questions, considering multiple perspectives.", "vi": "Đánh giá các bằng chứng thực nghiệm xem chúng ủng hộ hay mâu thuẫn với câu hỏi khoa học, đồng thời xem xét dưới nhiều góc độ khác nhau."}, {"en": "Differentiate between scientific questions that require empirical data and those that rely on theoretical analysis.", "vi": "Phân biệt các câu hỏi khoa học cần dữ liệu thực nghiệm và các câu hỏi dựa vào phân tích lý thuyết."}, {"en": "Analyze and evaluate the scope of scientific questions, distinguishing them from philosophical or ethical considerations to ensure appropriate methods of investigation.", "vi": "Phân tích và đánh giá phạm vi của các câu hỏi khoa học, phân biệt với các câu hỏi triết học hoặc đạo đức để lựa chọn phương pháp nghiên cứu phù hợp."}]}, {"code": "A3", "name": {"en": "Formulating and refining questions that can be answered empirically in a classroom", "vi": "Xây dựng và điều chỉnh các câu hỏi có thể trả lời bằng thực nghiệm trong phạm vi lớp học"}, "tiers": [{"en": "Develop questions that arise from observations of phenomena, models, or unexpected results, aimed at clarifying understanding or seeking additional information.", "vi": "Phát triển các câu hỏi từ quan sát hiện tượng, các mô hình hoặc các kết quả bất ngờ nhằm làm rõ sự hiểu biết hoặc tìm thêm thông tin."}, {"en": "Refine and adapt questions based on insights gained from initial investigations or observations, promoting iterative thinking and problem-solving.", "vi": "Điều chỉnh và sử dụng các câu hỏi dựa trên những hiểu biết thu được từ các nghiên cứu hoặc quan sát ban đầu, thúc đẩy tư duy lặp và giải quyết vấn đề."}, {"en": "Develop research questions that focus on measurable data, testable hypotheses, and the relationships between variables.", "vi": "Phát triển các câu hỏi nghiên cứu tập trung vào dữ liệu có thể đo lường, các giả thuyết có thể kiểm chứng và các mối quan hệ giữa các biến số."}, {"en": "Develop and justify precise, testable questions linked to theory-based hypotheses, defining variables operationally and judging feasibility with available resources.", "vi": "Xây dựng và lập luận cho các câu hỏi chính xác, có thể kiểm chứng, gắn với giả thuyết dựa trên lý thuyết; định nghĩa biến số theo cách đo lường được và đánh giá tính khả thi với nguồn lực sẵn có."}, {"en": "Construct research questions that address a gap identified in the literature, specifying variables, scope, and the evidence needed, and justify their significance.", "vi": "Xây dựng các câu hỏi nghiên cứu nhằm giải quyết một khoảng trống được xác định từ tài liệu, nêu rõ biến số, phạm vi và bằng chứng cần có, đồng thời lập luận về ý nghĩa của câu hỏi."}]}, {"code": "A4", "name": {"en": "Asking probing questions that seek to identify the premises of an argument, request further elaboration, refine a research question or engineering problem, or challenge the interpretation of a data set", "vi": "Đặt các câu hỏi thăm dò nhằm xác định tiền đề của lập luận, yêu cầu giải thích thêm, điều chỉnh các câu hỏi nghiên cứu hoặc vấn đề kỹ thuật, hoặc thách thức cách diễn giải dữ liệu"}, "tiers": [{"en": "Ask simple follow-up questions (e.g., “How do we know?”, “What happens next?”) to clarify an observation or explanation, using teacher prompts.", "vi": "Đặt các câu hỏi tiếp nối đơn giản (ví dụ: “Làm sao ta biết?”, “Điều gì xảy ra tiếp theo?”) để làm rõ một quan sát hoặc lời giải thích, với gợi ý của giáo viên."}, {"en": "Develop follow-up questions to critically evaluate, clarify, or expand on scientific arguments, fostering logical reasoning and evidence-based discussion.", "vi": "Phát triển các câu hỏi tiếp theo để đánh giá phê phán, làm rõ hoặc mở rộng các lập luận khoa học, thúc đẩy lập luận logic và thảo luận dựa trên bằng chứng."}, {"en": "Ask counter-questions that challenge a data interpretation and propose alternative explanations for it.", "vi": "Đặt các câu hỏi phản biện nhằm chất vấn một cách diễn giải dữ liệu và đề xuất các lý giải thay thế."}, {"en": "Ask probing questions that expose the assumptions, premises, and potential biases behind an argument, a data interpretation, or their own research question, and use them to refine the question.", "vi": "Đặt các câu hỏi thăm dò nhằm làm rõ các giả định, tiền đề và thiên lệch tiềm ẩn đằng sau một lập luận, một cách diễn giải dữ liệu hoặc câu hỏi nghiên cứu của chính mình, và dùng chúng để điều chỉnh câu hỏi."}, {"en": "Develop probing, analytical questions that critically examine assumptions, limitations, and potential biases in scientific data or research methodologies.", "vi": "Phát triển các câu hỏi phân tích thăm dò chuyên sâu  nhằm đánh giá phê phán các giả định, hạn chế và các yếu tố thiên lệch tiềm ẩn trong dữ liệu hoặc phương pháp nghiên cứu khoa học."}]}, {"code": "A5", "name": {"en": "Noting features, patterns, or contradictions in observations and ask questions about them.", "vi": "Nhận diện các đặc điểm, quy luật hoặc mâu thuẫn trong các quan sát và đặt câu hỏi về chúng"}, "tiers": [{"en": "Predict reasonable outcomes based on patterns, such as cause-and-effect relationships, and use these predictions to guide question formation.", "vi": "Dự đoán các kết quả hợp lý dựa trên các quy luật (ví dụ: mối quan hệ nhân quả) và sử dụng các dự đoán này để định hướng việc đặt câu hỏi."}, {"en": "Construct targeted questions to analyze discrepancies between observed patterns and predictions, encouraging students to hypothesize and reason about unexpected outcomes.", "vi": "Xây dựng các câu hỏi tập trung để phân tích sự sai lệch giữa quy luật quan sát được và dự đoán, khuyến khích học sinh đưa ra các giả thuyết và lý giải các kết quả không mong đợi."}, {"en": "Construct questions about discrepancies between observed patterns and predictions that propose possible causes to be tested.", "vi": "Xây dựng các câu hỏi về sự khác biệt giữa quy luật quan sát được và dự đoán, kèm theo các nguyên nhân có thể cần kiểm chứng."}, {"en": "Identify contradictions across data sets or studies and construct questions whose answers would resolve them, specifying the evidence required.", "vi": "Nhận diện các mâu thuẫn giữa các bộ dữ liệu hoặc các nghiên cứu và xây dựng các câu hỏi mà câu trả lời sẽ giải quyết được mâu thuẫn đó, nêu rõ bằng chứng cần có."}, {"en": "Generate questions from multivariable patterns, anomalies, and contradictions that open new lines of investigation beyond the original study.", "vi": "Tạo ra các câu hỏi từ các quy luật đa biến, điểm bất thường và mâu thuẫn, mở ra các hướng nghiên cứu mới vượt ra ngoài nghiên cứu ban đầu."}]}]}, {"code": "B", "title": {"en": "Developing and using models", "vi": "Phát triển và sử dụng mô hình"}, "def": [{"en": "A practice is to use and construct models as helpful tools for representing ideas and explanations. These tools include diagrams, drawings, physical replicas, mathematical representations, analogies, and computer simulations. Modeling tools are used to develop questions, predictions, and explanations; analyze and identify flaws in systems; and communicate ideas. Models are used to build and revise scientific explanations and proposed engineered systems. Measurements and observations are used to revise models and designs.", "vi": "Kỹ thuật thực hành này là sử dụng và xây dựng các mô hình như công cụ hữu ích để trình bày các ý tưởng và các lý giải. Các công cụ này bao gồm sơ đồ, bản vẽ, mô hình vật lý, biểu diễn toán học, phép so sánh và mô phỏng máy tính. Mô hình được dùng để phát triển câu hỏi, dự đoán, giải thích; phân tích và phát hiện điểm yếu của hệ thống; và truyền đạt ý tưởng. Mô hình được dùng để xây dựng và điều chỉnh các giải thích khoa học hoặc hệ thống kỹ thuật được đề xuất. Các phép đo và quan sát được sử dụng để điều chỉnh mô hình và thiết kế."}], "skills": [{"code": "B1", "name": {"en": "Constructing drawings or diagrams as representations of events or systems", "vi": "Phác họa các bản vẽ hoặc sơ đồ để biểu diễn sự kiện hoặc hệ thống"}, "tiers": [{"en": "Draw and label a simple diagram of an object, event, or set-up, showing its main parts.", "vi": "Vẽ và ghi chú một sơ đồ đơn giản của một vật thể, sự kiện hoặc bố trí thí nghiệm, thể hiện các bộ phận chính."}, {"en": "Draw labeled diagrams that show how components are connected and how a change in one component affects another.", "vi": "Vẽ sơ đồ có ghi chú thể hiện cách các thành phần liên kết với nhau và sự thay đổi của một thành phần ảnh hưởng đến thành phần khác như thế nào."}, {"en": "Create diagrams that represent multiple components, their interactions, and changes over time, and explain these relationships.", "vi": "Tạo các sơ đồ thể hiện nhiều thành phần, sự tương tác giữa chúng và sự thay đổi theo thời gian, đồng thời giải thích các mối quan hệ này."}, {"en": "Construct annotated diagrams that show interactions between several systems or processes and explain the underlying principles and interdependencies.", "vi": "Xây dựng các sơ đồ có chú thích thể hiện sự tương tác giữa nhiều hệ thống hoặc quá trình và giải thích các nguyên lý nền tảng cũng như mối phụ thuộc lẫn nhau."}, {"en": "Design diagrams that follow standard scientific conventions and symbols to represent complex systems accurately enough to support quantitative prediction or communication with experts.", "vi": "Thiết kế các sơ đồ tuân theo quy ước và ký hiệu khoa học chuẩn, biểu diễn hệ thống phức tạp đủ chính xác để hỗ trợ dự đoán định lượng hoặc trao đổi với chuyên gia."}]}, {"code": "B2", "name": {"en": "Representing and explaining phenomena with multiple types of models", "vi": "Biểu diễn và giải thích hiện tượng bằng nhiều loại mô hình"}, "tiers": [{"en": "Use a given physical model or analogy to describe a phenomenon, stating which part of the model represents which part of reality.", "vi": "Sử dụng một mô hình vật lý hoặc phép so sánh có sẵn để mô tả hiện tượng, chỉ ra phần nào của mô hình đại diện cho phần nào của thực tế."}, {"en": "Develop a simple physical or conceptual model to explain a basic phenomenon, connecting the model to relevant scientific concepts.", "vi": "Xây dựng một mô hình vật lý hoặc mô hình khái niệm đơn giản để giải thích một hiện tượng cơ bản, liên kết mô hình với các khái niệm khoa học liên quan."}, {"en": "Use various types of models (physical, mathematical, conceptual) to analyze and explain complex phenomena, evaluating their strengths and weaknesses in different contexts.", "vi": "Sử dụng nhiều loại mô hình (vật lý, toán học, khái niệm) để phân tích và giải thích các hiện tượng phức tạp, đánh giá ưu điểm và hạn chế trong các bối cảnh khác nhau."}, {"en": "Explain complex phenomena using multiple models, critically comparing their strengths, weaknesses, and applicability in different contexts, and justifying the choice of model.", "vi": "Giải thích các hiện tượng phức tạp bằng nhiều mô hình, so sánh phê phán các điểm mạnh, điểm yếu và tính phù hợp trong các bối cảnh khác nhau, đồng thời giải thích cho việc chọn mô hình."}, {"en": "Represent scientific phenomena through a variety of models, critically analyzing their strengths and limitations, and evaluating their relevance and applicability in different contexts to enhance problem-solving.", "vi": "Biểu diễn các hiện tượng khoa học thông qua nhiều loại mô hình, phân tích phê phán ưu điểm và hạn chế, đánh giá mức độ phù hợp để nâng cao khả năng giải quyết vấn đề."}]}, {"code": "B3", "name": {"en": "Discussing the limitations and precision of a model and suggest ways in which the model might be improved to better fit available evidence", "vi": "Thảo luận về hạn chế và độ chính xác của các mô hình, đề xuất cách cải thiện mô hình"}, "tiers": [{"en": "Identify one way in which a model differs from the real object or system (e.g., size, missing parts, materials).", "vi": "Chỉ ra một điểm khác biệt giữa mô hình và vật thể hoặc hệ thống thực (ví dụ: kích thước, bộ phận bị thiếu, vật liệu)."}, {"en": "Evaluate and identify specific limitations in models, such as scale, missing details, or assumptions, and consider their impact on the model's accuracy and application.", "vi": "Đánh giá và xác định giới hạn cụ thể của các mô hình, như tỉ lệ, chi tiết bị thiếu hoặc giả định, và xem xét tác động tới độ chính xác và khả năng ứng dụng."}, {"en": "Evaluate the limitations of a model’s precision, exploring how adjustments to assumptions or parameters could improve its accuracy and reliability.", "vi": "Đánh giá các giới hạn về độ chụm của mô hình, xem xét việc điều chỉnh giả định hoặc thông số có thể cải thiện độ chính xác và độ tin cậy của mô hình như thế nào."}, {"en": "Evaluate the assumptions underlying a given model, critically assessing their validity, and propose specific, evidence-based improvements to enhance the model’s accuracy and reliability.", "vi": "Đánh giá các giả định của mô hình, phân tích phê phán tính hợp lệ và đề xuất cải tiến dựa trên bằng chứng nhằm nâng cao độ chính xác và độ tin cậy."}, {"en": "Critically assess the limitations and assumptions of complex models, propose thoughtful refinements, and explore alternative approaches to improve their accuracy and reliability in explaining real-world scenarios.", "vi": "Đánh giá phê phán các giới hạn và giả định của các mô hình phức tạp, đề xuất điều chỉnh một cách hợp lý và tìm kiếm phương án thay thế để cải thiện độ chính xác và tin cậy trong quá trình giải thích các tình huống thực tế."}]}, {"code": "B4", "name": {"en": "Making and using a model to test a design, or aspects of a design, and to compare the effectiveness of different design solutions", "vi": "Tạo và sử dụng các mô hình để kiểm nghiệm một thiết kế hoặc các khía cạnh của thiết kế, và so sánh hiệu quả của các giải pháp thiết kế khác nhau"}, "tiers": [{"en": "Build and test a simple model or prototype with teacher guidance and describe what worked and what did not.", "vi": "Chế tạo và thử nghiệm một mô hình hoặc nguyên mẫu đơn giản với sự hướng dẫn của giáo viên, mô tả điều gì hiệu quả và điều gì chưa."}, {"en": "Build and test models of two or more design solutions, compare them against given criteria, and use the results to improve the design.", "vi": "Chế tạo và thử nghiệm mô hình của hai hay nhiều giải pháp thiết kế, so sánh chúng theo các tiêu chí cho trước và dùng kết quả để cải tiến thiết kế."}, {"en": "Apply models to systematically test and compare the effectiveness of multiple design solutions, using evidence and reasoning to justify the best approach.", "vi": "Áp dụng các mô hình để kiểm nghiệm và so sánh có hệ thống hiệu quả của nhiều giải pháp thiết kế, sử dụng bằng chứng và lập luận để chứng minh cho sự lựa chọn mô hình tối ưu."}, {"en": "Develop and iteratively refine models to explore different design aspects, critically testing hypotheses and optimizing solutions based on data-driven outcomes and feedback.", "vi": "Phát triển và điều chỉnh lặp lại các mô hình để khám phá các khía cạnh thiết kế khác nhau, kiểm nghiệm phê phán các giả thuyết và tối ưu hóa giải pháp dựa trên dữ liệu và phản hồi."}, {"en": "Create, refine, and iteratively improve sophisticated models, applying advanced reasoning to thoroughly evaluate and compare multiple complex design solutions, considering both theoretical and practical implications.", "vi": "Tạo, điều chỉnh và cải tiến các mô hình phức tạp, áp dụng lập luận nâng cao để đánh giá và so sánh nhiều giải pháp thiết kế phức tạp, xem xét cả khía cạnh lý thuyết và thực tiễn."}]}]}, {"code": "C", "title": {"en": "Planning and carrying out investigations", "vi": "Lập kế hoạch và tiến hành nghiên cứu"}, "def": [{"en": "A practice is to plan and carry out investigations in the field or laboratory, working collaboratively as well as individually. Their investigations are systematic and require clarifying what counts as data and  identifying variables or parameters. Investigations are planned and carried out safely and ethically.", "vi": "Kỹ thuật thực hành này là việc lập kế hoạch và tiến hành nghiên cứu tại hiện trường hoặc phòng thí nghiệm, làm việc hợp tác cũng như cá nhân. Các nghiên cứu này cần có hệ thống và yêu cầu xác định rõ cái gì được tính là dữ liệu, cũng như nhận diện biến số hoặc tham số. Nghiên cứu được lập kế hoạch và tiến hành một cách an toàn và đúng đạo đức nghiên cứu."}], "skills": [{"code": "C1", "name": {"en": "Formulating a hypothesis (that is, a possible explanation that predicts a particular and stable outcome) based on a model or theory", "vi": "Xây dựng giả thuyết (một lời giải thích có thể dự đoán kết quả nhất định và ổn định) dựa trên mô hình hoặc lý thuyết"}, "tiers": [{"en": "Make a testable prediction (“If … then …”) based on observations or prior knowledge.", "vi": "Đưa ra một dự đoán có thể kiểm chứng (“Nếu … thì …”) dựa trên quan sát hoặc kiến thức sẵn có."}, {"en": "Formulate hypotheses that predict outcomes based on established scientific theories and evidence, considering underlying assumptions and potential variables.", "vi": "Xây dựng các giả thuyết có thể dự đoán kết quả dựa trên lý thuyết và bằng chứng khoa học đã được thiết lập, cân nhắc các giả định và các biến số tiềm ẩn."}, {"en": "Develop hypotheses grounded in established theories or models, clearly articulating cause-and-effect relationships and their underlying mechanisms.", "vi": "Phát triển các giả thuyết dựa trên các lý thuyết hoặc mô hình khoa học, mô tả rõ các mối quan hệ nguyên nhân – kết quả và các cơ chế nền tảng."}, {"en": "Develop hypotheses that involve more than one variable or an interaction, are grounded in a theoretical model, and state what result would refute them.", "vi": "Xây dựng các giả thuyết liên quan đến nhiều hơn một biến hoặc một tương tác, dựa trên mô hình lý thuyết và nêu rõ kết quả nào sẽ bác bỏ giả thuyết."}, {"en": "Formulate hypotheses that synthesize several theories or prior studies, specify the predicted direction and size or form of the effect, and identify competing hypotheses.", "vi": "Xây dựng các giả thuyết tổng hợp từ nhiều lý thuyết hoặc nghiên cứu trước, nêu rõ chiều hướng và độ lớn hoặc dạng của tác động dự đoán, đồng thời xác định các giả thuyết cạnh tranh."}]}, {"code": "C2", "name": {"en": "Deciding what data are to be gathered, what tools are needed to do the gathering, and how measurements will be recorded", "vi": "Quyết định loại dữ liệu cần thu thập, các công cụ cần dùng và các phương pháp đo lường"}, "tiers": [{"en": "Choose, from given options, the data to collect and a suitable basic tool or recording format.", "vi": "Lựa chọn, từ các phương án cho sẵn, dữ liệu cần thu thập và một công cụ cơ bản hoặc mẫu ghi chép phù hợp."}, {"en": "Determine the types of data to collect (measurements, observations, or survey responses) and select tools or instruments, giving a reason for each choice.", "vi": "Xác định loại dữ liệu cần thu thập (số đo, quan sát hoặc câu trả lời khảo sát) và lựa chọn công cụ hoặc thiết bị, nêu lý do cho mỗi lựa chọn."}, {"en": "Identify the types of data required to test hypotheses and justify the selection of tools or methods, considering both accuracy and relevance to the research question.", "vi": "Xác định các loại dữ liệu cần thiết để kiểm nghiệm các giả thuyết và lý giải cho các lựa chọn công cụ/phương pháp, cân nhắc độ chính xác và sự phù hợp với câu hỏi nghiên cứu."}, {"en": "Determine relevant data to collect, carefully evaluating the precision and reliability of tools and methods for accurate recording and analysis.", "vi": "Xác định các dữ liệu cần thu thập, đánh giá cẩn thận độ chính xác và độ tin cậy của các công cụ/phương pháp để đảm bảo ghi nhận và phân tích dữ liệu chính xác."}, {"en": "Select data types, tools, and measurement methods (including validated instruments for human-participant research) that ensure accuracy, precision, reliability, and alignment with the hypothesis, and justify each decision.", "vi": "Lựa chọn loại dữ liệu, công cụ và phương pháp đo (bao gồm công cụ đã được kiểm định đối với nghiên cứu có người tham gia) bảo đảm độ chính xác, độ chụm, độ tin cậy và sự phù hợp với giả thuyết, đồng thời lập luận cho từng quyết định."}]}, {"code": "C3", "name": {"en": "Deciding how much data are needed to produce reliable measurements and consider any limitations on the precision of the data", "vi": "Quyết định khối lượng dữ liệu cần thu thập để đảm bảo phép đo đáng tin cậy và xem xét các giới hạn về độ chính xác của dữ liệu"}, "tiers": [{"en": "Take repeated measurements or observations as instructed and notice when values vary.", "vi": "Thực hiện các phép đo hoặc quan sát lặp lại theo hướng dẫn và nhận ra khi các giá trị thay đổi."}, {"en": "Record measurements or observations accurately with units, identify limitations of the measurement techniques, and note obvious sources of error.", "vi": "Ghi lại các phép đo hoặc quan sát một cách chính xác, có đơn vị, nhận diện các giới hạn của kỹ thuật đo và ghi chú các nguồn sai số rõ ràng."}, {"en": "Determine the quantity (number of trials or sample size) and quality of data needed for reliable and valid results, taking into account measurement precision and practical constraints.", "vi": "Xác định số lượng (số lần lặp hoặc kích thước mẫu) và chất lượng dữ liệu cần thiết để có kết quả tin cậy và hợp lệ, có tính đến độ chụm của phép đo và các ràng buộc thực tế."}, {"en": "Strategically plan data collection processes, considering how precision, accuracy, and sample size influence the validity and reliability of conclusions.", "vi": "Lập kế hoạch chiến lược cho các quy trình thu thập dữ liệu, xem xét mức độ ảnh hưởng của độ chính xác, độ tin cậy và kích thước mẫu và tính hợp lệ của các kết luận."}, {"en": "Plan and justify sampling strategies and sample size for large or complex data sets, quantify uncertainty, and evaluate potential biases to strengthen the validity of findings.", "vi": "Lập kế hoạch và lập luận cho chiến lược chọn mẫu và kích thước mẫu đối với các tập dữ liệu lớn hoặc phức tạp, định lượng độ không đảm bảo và đánh giá các thiên lệch tiềm ẩn để củng cố tính hợp lệ của kết quả."}]}, {"code": "C4", "name": {"en": "Planning experimental or field-research procedures, identifying relevant independent, dependent, and control variables", "vi": "Lập kế hoạch thực hiện các thí nghiệm hoặc nghiên cứu hiện trường, xác định các biến độc lập, phụ thuộc và biến kiểm soát"}, "tiers": [{"en": "Follow a given procedure for a fair test, stating what is changed, what is measured, and what is kept the same, and follow safety instructions.", "vi": "Thực hiện theo quy trình cho sẵn của một thí nghiệm công bằng, nêu rõ yếu tố được thay đổi, yếu tố được đo và các yếu tố được giữ nguyên, đồng thời tuân thủ hướng dẫn an toàn."}, {"en": "Identify independent, dependent, and control variables (or, for surveys and observations, the factors and participants to be studied), write a step-by-step procedure, and complete a risk assessment with guidance.", "vi": "Xác định biến độc lập, biến phụ thuộc và biến kiểm soát (hoặc, với khảo sát và quan sát, các yếu tố và đối tượng tham gia cần nghiên cứu), viết quy trình từng bước và hoàn thành đánh giá rủi ro với sự hướng dẫn."}, {"en": "Design detailed research plans that account for controlled, independent, and dependent variables, ensuring replicability through comprehensive documentation of procedures. Include safety measures and, where people or living organisms are involved, informed consent and ethical safeguards.", "vi": "Thiết kế các kế hoạch nghiên cứu chi tiết, xác định rõ các biến kiểm soát, độc lập, phụ thuộc và đảm bảo khả năng lặp lại thí nghiệm thông qua việc ghi chép cụ thể các quá trình thực hiện thí nghiệm. Bao gồm các biện pháp an toàn và, khi có con người hoặc sinh vật sống tham gia, sự đồng thuận có hiểu biết và các biện pháp bảo vệ về đạo đức."}, {"en": "Design experimental, quasi-experimental, correlational, or field studies appropriate to the question, clearly identifying variables or factors, with fully documented procedures, a risk assessment, and the required ethics approval.", "vi": "Thiết kế nghiên cứu thực nghiệm, bán thực nghiệm, tương quan hoặc thực địa phù hợp với câu hỏi, xác định rõ các biến hoặc yếu tố, với quy trình được ghi chép đầy đủ, đánh giá rủi ro và phê duyệt đạo đức cần thiết."}, {"en": "Design and carry out multi-stage or multi-variable investigations with reproducible procedures and a pre-specified analysis plan, in full compliance with safety and ethics requirements, adapting protocols only with documented justification.", "vi": "Thiết kế và thực hiện các nghiên cứu nhiều giai đoạn hoặc nhiều biến với quy trình có thể lặp lại và kế hoạch phân tích được xác định trước, tuân thủ đầy đủ các yêu cầu an toàn và đạo đức, chỉ điều chỉnh quy trình khi có lý do được ghi chép."}]}, {"code": "C5", "name": {"en": "Considering possible confounding variables or effects and ensure that the investigation’s design has controlled for them", "vi": "Xem xét các biến gây nhiễu hoặc có ảnh hưởng và đảm bảo thiết kế nghiên cứu đã kiểm soát chúng"}, "tiers": [{"en": "Name factors, other than the one being changed, that could affect the result.", "vi": "Kể tên các yếu tố, ngoài yếu tố đang được thay đổi, có thể ảnh hưởng đến kết quả."}, {"en": "Recognize factors other than the independent variable that could affect the results and identify which of them must be kept the same as controlled variables.", "vi": "Nhận diện các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả và xác định những yếu tố cần giữ nguyên làm biến kiểm soát."}, {"en": "Analyze potential confounding variables, predict their impact on results, and propose strategies to mitigate their effects within the experimental design.", "vi": "Phân tích các biến số gây nhiễu, dự đoán các ảnh hưởng và đề xuất các biện pháp giảm thiểu trong thiết kế thí nghiệm."}, {"en": "Analyze the potential impact of confounding variables and apply appropriate controls to minimize their influence, ensuring robust and unbiased research findings.", "vi": "Phân tích các tác động tiềm ẩn của các biến gây nhiễu và áp dụng các phương án kiểm soát phù hợp để giảm ảnh hưởng, đảm bảo tính khách quan của kết quả."}, {"en": "Anticipate subtle or interacting confounders and biases (e.g., selection, observer, or response bias) and apply rigorous controls such as randomization, blinding, or statistical adjustment.", "vi": "Dự đoán các biến gây nhiễu và thiên lệch khó nhận biết hoặc tương tác với nhau (ví dụ: thiên lệch chọn mẫu, thiên lệch người quan sát, thiên lệch trả lời) và áp dụng các biện pháp kiểm soát chặt chẽ như ngẫu nhiên hóa, làm mù hoặc hiệu chỉnh thống kê."}]}]}, {"code": "D", "title": {"en": "Analyzing and interpreting data", "vi": "Phân tích và diễn giải dữ liệu"}, "def": [{"en": "A practice is to apply quantitative methods for collecting data and to conduct multiple trials of qualitative observations in order to identify significant features and patterns in the data, determine sources of error, and calculate the degree of certainty.", "vi": "Kỹ thuật thực hành này là việc áp dụng các phương pháp định lượng để thu thập dữ liệu và tiến hành nhiều lần quan sát định tính nhằm xác định các đặc điểm và quy luật của dữ liệu, nhận diện các nguồn sai số tiềm ẩn, và tính toán mức độ tin cậy."}], "skills": [{"code": "D1", "name": {"en": "Analyzing data systematically", "vi": "Phân tích dữ liệu một cách có hệ thống"}, "tiers": [{"en": "Organize data in simple tables and charts and describe what they show.", "vi": "Sắp xếp dữ liệu vào bảng và biểu đồ đơn giản và mô tả những gì chúng thể hiện."}, {"en": "Analyze patterns and trends in data using systematic methods and logical reasoning.", "vi": "Phân tích các quy luật và xu hướng trong dữ liệu bằng các phương pháp có hệ thống và lập luận logic."}, {"en": "Analyze data systematically using graphs, descriptive statistics (e.g., mean, median, range), and computational tools to identify trends and relationships; for qualitative data, sort responses into categories.", "vi": "Phân tích dữ liệu một cách có hệ thống bằng đồ thị, thống kê mô tả (ví dụ: trung bình, trung vị, khoảng biến thiên) và công cụ tính toán để tìm ra xu hướng và mối quan hệ; với dữ liệu định tính, phân loại câu trả lời thành các nhóm."}, {"en": "Analyze data using measures of variability and uncertainty and appropriate inferential or relational techniques (e.g., t-test, chi-square, correlation/regression) or systematic qualitative coding.", "vi": "Phân tích dữ liệu bằng các đại lượng về độ biến thiên và độ không đảm bảo cùng các kỹ thuật suy luận hoặc tương quan phù hợp (ví dụ: kiểm định t, chi bình phương, tương quan/hồi quy) hoặc mã hóa định tính có hệ thống."}, {"en": "Apply and justify multivariable or model-based analyses to explore patterns, relationships, and anomalies, checking the assumptions of the methods used.", "vi": "Áp dụng và lập luận cho các phân tích đa biến hoặc dựa trên mô hình để khám phá quy luật, mối quan hệ và điểm bất thường, kiểm tra các giả định của phương pháp được sử dụng."}]}, {"code": "D2", "name": {"en": "Recognizing when data are in conflict with expectations and consider what revisions in the initial model are needed", "vi": "Nhận diện khi dữ liệu mâu thuẫn với dự đoán và xem xét điều chỉnh mô hình ban đầu"}, "tiers": [{"en": "Notice when results differ from the prediction and suggest a simple reason.", "vi": "Nhận ra khi kết quả khác với dự đoán và đưa ra một lý do đơn giản."}, {"en": "Identify conflicts between data and expectations, critically evaluate potential causes, and propose evidence-based explanations.", "vi": "Nhận diện các xung đột giữa dữ liệu và các kết quả dự đoán, đánh giá nguyên nhân có thể và đề xuất các lý giải dựa trên bằng chứng."}, {"en": "Critically evaluate discrepancies in data and propose revisions to models or theories, incorporating logical reasoning and evidence-based justifications.", "vi": "Đánh giá phê phán các sự khác biệt giữa dữ liệu và dự đoán, đề xuất điều chỉnh mô hình hoặc lý thuyết, kết hợp lập luận logic và bằng chứng."}, {"en": "Critically evaluate conflicting data, considering possible revisions to models or experimental designs.", "vi": "Đánh giá phê phán các mâu thuẫn trong bộ dữ liệu, xem xét khả năng điều chỉnh các mô hình hoặc thiết kế thí nghiệm."}, {"en": "Detect and investigate data conflicts rigorously, revising models or experimental approaches as needed.", "vi": "Phát hiện và điều tra kỹ lưỡng các mâu thuẫn trong bộ dữ liệu, điều chỉnh các mô hình hoặc phương pháp nghiên cứu khi cần."}]}, {"code": "D3", "name": {"en": "Using computational tools to collate, summarize, and display data and to explore relationships between variables", "vi": "Sử dụng các công cụ tính toán để tổng hợp, tóm tắt, hiển thị dữ liệu và khám phá mối quan hệ giữa các biến số"}, "tiers": [{"en": "Enter data into a spreadsheet and create a simple chart with teacher guidance.", "vi": "Nhập dữ liệu vào bảng tính và tạo biểu đồ đơn giản với sự hướng dẫn của giáo viên."}, {"en": "Use spreadsheets or graphing software independently to organize and visualize data and calculate simple statistics.", "vi": "Sử dụng bảng tính hoặc phần mềm vẽ đồ thị một cách độc lập để tổ chức, trực quan hóa dữ liệu và tính các thống kê đơn giản."}, {"en": "Use computational tools to combine data sets, create multi-variable displays, and explore relationships between variables.", "vi": "Sử dụng công cụ tính toán để kết hợp các bộ dữ liệu, tạo các biểu diễn nhiều biến và khám phá mối quan hệ giữa các biến số."}, {"en": "Employ specialized software or tools to analyze data and explore variable relationships in depth.", "vi": "Sử dụng phần mềm hoặc các công cụ chuyên biệt để phân tích dữ liệu và khám phá mối quan hệ giữa các biến số một cách chuyên sâu."}, {"en": "Use computational tools (e.g., scripting or statistical software) to automate analyses and model relationships among multiple variables.", "vi": "Sử dụng công cụ tính toán (ví dụ: lập trình hoặc phần mềm thống kê) để tự động hóa phân tích và mô hình hóa mối quan hệ giữa nhiều biến số."}]}, {"code": "D4", "name": {"en": "Evaluating the strength of a conclusion that can be inferred from any data set, using appropriate grade-level mathematical and statistical techniques", "vi": "Đánh giá độ thuyết phục của kết luận rút ra từ bất kỳ tập dữ liệu nào bằng kỹ thuật toán học và thống kê phù hợp với trình độ"}, "tiers": [{"en": "State a conclusion that answers the question and point to the data that support it.", "vi": "Nêu một kết luận trả lời câu hỏi và chỉ ra dữ liệu ủng hộ kết luận đó."}, {"en": "State a conclusion that answers the question, support it with specific data values, and say whether the data support or contradict the prediction.", "vi": "Nêu kết luận trả lời câu hỏi, dẫn chứng bằng các giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán."}, {"en": "Assess the validity and reliability of conclusions by applying mathematical and statistical reasoning, considering limitations and alternative interpretations.", "vi": "Đánh giá tính hợp lệ và độ tin cậy của các kết luận bằng lập luận toán học và thống kê, xem xét hạn chế và diễn giải thay thế."}, {"en": "Evaluate conclusions using inferential statistics and effect sizes, distinguishing correlation from causation and stating the uncertainty.", "vi": "Đánh giá kết luận bằng thống kê suy luận và độ lớn hiệu ứng, phân biệt tương quan với nhân quả và nêu rõ độ không đảm bảo."}, {"en": "Evaluate the strength of conclusions using multiple analyses, sensitivity checks, or comparison with published findings, and state the limits of generalization.", "vi": "Đánh giá mức độ thuyết phục của kết luận bằng nhiều phân tích, kiểm tra độ nhạy hoặc so sánh với các kết quả đã công bố, và nêu rõ giới hạn của việc khái quát hóa."}]}, {"code": "D5", "name": {"en": "Recognizing patterns in data that suggest relationships worth investigating further", "vi": "Nhận diện các quy luật trong bộ dữ liệu từ đó đề xuất mối quan hệ tiềm năng giữa các biến để mở rộng nghiên cứu"}, "tiers": [{"en": "Describe a simple pattern in data (increases, decreases, no change) and suggest what could be tested next.", "vi": "Mô tả một quy luật đơn giản trong dữ liệu (tăng, giảm, không đổi) và gợi ý điều có thể kiểm chứng tiếp theo."}, {"en": "Synthesize observed patterns and relationships to generate predictions, develop hypotheses, and inform future investigations.", "vi": "Tổng hợp các quy luật và mối quan hệ quan sát được để đưa ra các dự đoán, phát triển các giả thuyết và định hướng cho các nghiên cứu tiếp theo."}, {"en": "Identify significant patterns in data, hypothesize potential relationships, and propose directions for further investigation.", "vi": "Xác định các quy luật quan trọng trong dữ liệu, đưa ra các giả thuyết về mối quan hệ và đề xuất hướng nghiên cứu tiếp theo."}, {"en": "Recognize complex patterns in data that may suggest deeper relationships worth investigating.", "vi": "Nhận diện các quy luật phức tạp trong dữ liệu, từ đó đề xuất mối quan hệ sâu hơn giữa các biến số đáng để điều tra."}, {"en": "Critically evaluate patterns in data, exploring relationships that could lead to further research.", "vi": "Đánh giá phê phán các quy luật của bộ dữ liệu, khám phá các mối quan hệ  giữa các biến số có thể dẫn tới nghiên cứu mới."}]}]}, {"code": "E", "title": {"en": "Constructing evidence-based explanations", "vi": "Xây dựng giải thích dựa trên bằng chứng"}, "def": [{"en": "A practice is to construct theories that provide explanatory accounts of features of the world, demonstrating superiority over other explanations in terms of breadth of phenomena covered, coherence, and parsimony. Scientific explanations are explicit applications of theory to specific situations or phenomena, possibly through a theory-based model of the system under study. The goal is to develop logically coherent explanations that incorporate current scientific understanding, or a model representing it, and are consistent with available evidence.", "vi": "Kỹ thuật thực hành này là việc xây dựng các lý thuyết có thể giải thích cho các đặc điểm của thế giới, thể hiện sự vượt trội so với các lời giải thích khác về phạm vi hiện tượng được giải thích, tính gắn kết và tính đơn giản trong lập luận. Giải thích khoa học là sự áp dụng rõ ràng của lý thuyết vào một tình huống hoặc hiện tượng cụ thể, có thể thông qua mô hình lý thuyết của hệ thống đang được nghiên cứu. Mục tiêu là phát triển các giải thích logic, gắn kết, phản ánh đúng hiểu biết khoa học hiện tại hoặc mô hình đại diện cho hiểu biết đó, và phù hợp với bằng chứng hiện có."}], "skills": [{"code": "E1", "name": {"en": "Constructing their own explanations of phenomena using their knowledge of accepted scientific theory and linking it to models and evidence.", "vi": "Xây dựng các lý giải hiện tượng dựa trên lý thuyết khoa học đã được chấp nhận, liên kết với các mô hình và bằng chứng"}, "tiers": [{"en": "Offer simple explanations based on classroom knowledge.", "vi": "Đưa ra các lý giải đơn giản dựa trên kiến thức trong phạm vi lớp học."}, {"en": "Provide explanations using scientific concepts and models.", "vi": "Đưa ra các lý giải sử dụng các khái niệm và mô hình khoa học."}, {"en": "Develop explanations linking phenomena to scientific theories and models.", "vi": "Phát triển các lý giải liên kết hiện tượng với các lý thuyết và mô hình khoa học."}, {"en": "Construct detailed explanations using models, theories, and evidence.", "vi": "Xây dựng các lý giải chi tiết bằng cách sử dụng các mô hình, lý thuyết và bằng chứng."}, {"en": "Provide comprehensive explanations grounded in scientific theory, evidence, and critical evaluation.", "vi": "Đưa ra các lý giải toàn diện dựa trên các lý thuyết khoa học, bằng chứng và đánh giá phê phán."}]}, {"code": "E2", "name": {"en": "Using primary or secondary scientific evidence and models to support or refute an explanatory account of a phenomenon.", "vi": "Sử dụng bằng chứng khoa học sơ cấp hoặc thứ cấp và mô hình để ủng hộ hoặc bác bỏ lời giải thích về hiện tượng"}, "tiers": [{"en": "Use basic evidence from classroom experiments to explain phenomena.", "vi": "Sử dụng bằng chứng cơ bản từ thí nghiệm lớp học để giải thích hiện tượng."}, {"en": "Support explanations with specific pieces of evidence from scientific activities.", "vi": "Hỗ trợ các lý giải bằng các bằng chứng cụ thể từ hoạt động khoa học."}, {"en": "Use models and a range of evidence to support or refute explanations in more complex scenarios.", "vi": "Sử dụng các mô hình và nhiều nguồn bằng chứng để ủng hộ hoặc bác bỏ lý giải trong các tình huống phức tạp."}, {"en": "Critically analyze evidence and models to support or challenge explanations.", "vi": "Phân tích phê phán các bằng chứng và mô hình để ủng hộ hoặc thách thức các lý giải."}, {"en": "Present advanced arguments based on solid scientific evidence and model evaluations.", "vi": "Trình bày lập luận nâng cao dựa trên bằng chứng khoa học vững chắc và đánh giá mô hình."}]}, {"code": "E3", "name": {"en": "Offering causal explanations appropriate to their level of scientific knowledge.", "vi": "Đưa ra lý giải nhân quả phù hợp với trình độ kiến thức khoa học"}, "tiers": [{"en": "Provide simple cause-effect explanations for basic phenomena.", "vi": "Đưa ra các lý giải nguyên nhân – kết quả đơn giản cho các hiện tượng cơ bản."}, {"en": "Offer more complex causal explanations that include underlying scientific concepts.", "vi": "Đưa ra các lý giải nguyên nhân - kết quả phức tạp hơn bao gồm các khái niệm khoa học nền tảng."}, {"en": "Present detailed causal explanations for phenomena, integrating models and evidence.", "vi": "Trình bày các lý giải nguyên nhân - kết quả chi tiết cho hiện tượng, tích hợp các mô hình và bằng chứng."}, {"en": "Offer nuanced causal explanations that reflect deeper scientific understanding.", "vi": "Đưa ra các lý giải nguyên nhân - kết quả sâu sắc, phản ánh sự hiểu biết khoa học sâu hơn."}, {"en": "Provide advanced causal explanations, incorporating multiple factors, evidence, and theoretical models.", "vi": "Đưa ra các lý giải nguyên nhân - kết quả nâng cao, tích hợp nhiều yếu tố, bằng chứng và mô hình lý thuyết."}]}, {"code": "E4", "name": {"en": "Identifying gaps or weaknesses in explanatory accounts (their own or those of others).", "vi": "Nhận diện khoảng trống hoặc điểm yếu trong lời giải thích (của bản thân hoặc của người khác)"}, "tiers": [{"en": "Identify basic gaps or limitations in classroom explanations.", "vi": "Xác định khoảng trống hoặc hạn chế cơ bản trong các lý giải trong phạm vi lớp học."}, {"en": "Point out potential weaknesses in explanations provided during class.", "vi": "Chỉ ra điểm yếu tiềm ẩn trong các lý giải được đưa ra trong lớp."}, {"en": "Discuss the gaps or weaknesses in more complex explanations, including their own.", "vi": "Thảo luận các khoảng trống hoặc điểm yếu trong các lý giải phức tạp, bao gồm các lý giải của bản thân."}, {"en": "Critically evaluate the validity of explanations, identifying and addressing gaps or weaknesses.", "vi": "Đánh giá phê phán tính hợp lệ của các lý giải, nhận diện và khắc phục các khoảng trống hoặc điểm yếu."}, {"en": "Offer critical feedback on scientific explanations, identifying significant gaps or weaknesses in reasoning.", "vi": "Đưa ra các phản hồi phê phán về các lý giải khoa học, nhận diện khoảng trống hoặc điểm yếu quan trọng trong lập luận."}]}]}, {"code": "F", "title": {"en": "Obtaining, evaluating, and communicating information", "vi": "Thu thập, đánh giá và truyền đạt thông tin"}, "def": [{"en": "A practice is to communicate scientific ideas and research findings orally and in writing, using tables, diagrams, graphs, and equations, and by engaging in extended discussions with scientific peers. It also requires the ability to extract meaning from scientific texts (including papers, online resources, symposia, and lectures), evaluate the scientific validity of the acquired information, and integrate it effectively.", "vi": "Kỹ thuật thực hành này là việc truyền đạt ý tưởng khoa học và kết quả nghiên cứu bằng các hình thức nói và viết, sử dụng bảng, sơ đồ, biểu đồ, phương trình, và tham gia thảo luận mở rộng với đồng nghiệp khoa học. Kỹ thuật này cũng đòi hỏi khả năng rút ra ý nghĩa từ các văn bản khoa học (bao gồm bài báo, nguồn trực tuyến, hội nghị và bài giảng), đánh giá tính hợp lệ và khoa học của thông tin thu nhận được, và tích hợp thông tin đó một cách hiệu quả."}], "skills": [{"code": "F1", "name": {"en": "Using words, tables, diagrams, and graphs as well as mathematical expressions, to communicate their understanding or to ask questions about a system under study", "vi": "Sử dụng chữ viết, bảng, sơ đồ, biểu đồ cũng như biểu thức toán học để truyền đạt hiểu biết hoặc đặt câu hỏi về hệ thống được nghiên cứu"}, "tiers": [{"en": "Present findings using simple tables, diagrams, and words.", "vi": "Trình bày các phát hiện bằng bảng biểu, sơ đồ và chữ viết đơn giản."}, {"en": "Use tables, diagrams, and graphs to communicate basic understanding of a system.", "vi": "Sử dụng bảng biểu, sơ đồ và biểu đồ để truyền đạt hiểu biết cơ bản về hệ thống."}, {"en": "Incorporate words, tables, diagrams, and mathematical expressions to explain phenomena more effectively.", "vi": "Kết hợp chữ viết, bảng biểu, sơ đồ và biểu thức toán học để giải thích hiện tượng hiệu quả hơn."}, {"en": "Communicate understanding of complex systems using a variety of representations (tables, graphs, math).", "vi": "Truyền đạt hiểu biết về hệ thống phức tạp bằng nhiều hình thức biểu diễn (bảng, biểu đồ, toán học)."}, {"en": "Use comprehensive representations, including advanced mathematical expressions, to clearly communicate complex systems or questions.", "vi": "Sử dụng đầy đủ các hình thức biểu diễn, bao gồm biểu thức toán học nâng cao, để truyền đạt nội dung về các hệ thống hoặc câu hỏi phức tạp một cách rõ ràng."}]}, {"code": "F2", "name": {"en": "Reading scientific text, including tables, diagrams, and graphs, commensurate with their scientific knowledge and explain the key ideas being communicated.", "vi": "Đọc văn bản khoa học, bao gồm bảng, sơ đồ và biểu đồ, phù hợp với trình độ kiến thức khoa học và giải thích các ý chính đang được thảo luận"}, "tiers": [{"en": "Interpret simple scientific text and basic tables or diagrams.", "vi": "Diễn giải văn bản khoa học đơn giản và bảng hoặc sơ đồ cơ bản."}, {"en": "Read and explain key ideas from more complex scientific texts, including data representations.", "vi": "Đọc và giải thích các ý chính từ văn bản khoa học phức tạp hơn, bao gồm biểu diễn dữ liệu."}, {"en": "Analyze and explain the key concepts in scientific texts, diagrams, and graphs.", "vi": "Phân tích và giải thích các khái niệm chính trong văn bản khoa học, sơ đồ và biểu đồ."}, {"en": "Critically read and interpret scientific texts, tables, and diagrams, explaining key scientific concepts.", "vi": "Đọc và diễn giải phê phán các văn bản, bảng và sơ đồ khoa học, giải thích các khái niệm khoa học then chốt."}, {"en": "Engage with advanced scientific literature, identifying key concepts and interpreting complex data sets and graphs.", "vi": "Tiếp cận tài liệu khoa học nâng cao, nhận diện khái niệm chính và diễn giải các bộ dữ liệu, biểu đồ phức tạp."}]}, {"code": "F3", "name": {"en": "Recognizing the major features of scientific writing and speaking and be able to produce written and illustrated text or oral presentations that communicate their own ideas and accomplishments.", "vi": "Nhận diện các đặc điểm chính của văn bản và trình bày khoa học, đồng thời tạo sản phẩm văn bản minh họa hoặc bài trình bày truyền đạt ý tưởng và kết quả của mình"}, "tiers": [{"en": "Recognize basic features of scientific reports and present simple findings.", "vi": "Nhận biết các đặc điểm cơ bản của báo cáo khoa học và trình bày các phát hiện đơn giản."}, {"en": "Identify features of scientific writing and create basic presentations of their findings.", "vi": "Xác định các đặc điểm của văn bản khoa học và viết bài viết trình bày cơ bản về phát hiện của mình."}, {"en": "Produce written and oral presentations that communicate their findings using scientific conventions.", "vi": "Soạn báo cáo và trình bày truyền đạt phát hiện theo đúng quy ước khoa học."}, {"en": "Present detailed reports or presentations that adhere to scientific writing standards, including evidence.", "vi": "Trình bày báo cáo hoặc thuyết trình chi tiết, tuân thủ tiêu chuẩn viết khoa học, bao gồm bằng chứng."}, {"en": "Produce polished, formal scientific reports and presentations, reflecting high standards of scientific communication.", "vi": "Soạn báo cáo và trình bày khoa học hoàn chỉnh, chuẩn mực, phản ánh tiêu chuẩn cao của giao tiếp khoa học."}]}, {"code": "F4", "name": {"en": "Engaging in a critical reading of primary scientific literature or of media reports of science and discuss the validity and reliability of the data, hypotheses, and conclusions.", "vi": "Đọc phê phán các tài liệu khoa học gốc hoặc các bài báo khoa học trên truyền thông, thảo luận về tính hợp lệ và độ tin cậy của dữ liệu, giả thuyết và kết luận"}, "tiers": [{"en": "Identify whether a simple report gives evidence for its claim and who produced it.", "vi": "Nhận biết một báo cáo đơn giản có đưa ra bằng chứng cho nhận định hay không và ai là người viết báo cáo."}, {"en": "Evaluate media reports of science, discussing their validity and potential biases.", "vi": "Đánh giá các bài báo khoa học trên truyền thông, thảo luận về tính hợp lệ và thiên lệch tiềm ẩn."}, {"en": "Analyze primary scientific literature, assessing the validity of data and hypotheses.", "vi": "Phân tích các tài liệu khoa học gốc, đánh giá tính hợp lệ của dữ liệu và giả thuyết."}, {"en": "Engage critically with advanced scientific reports, evaluating their validity and methodology rigorously.", "vi": "Tiếp cận phê phán các báo cáo khoa học nâng cao, đánh giá tính hợp lệ và phương pháp luận một cách nghiêm ngặt."}, {"en": "Perform in-depth evaluations of scientific reports, analyzing validity, reliability, and broader scientific impact.", "vi": "Đánh giá chuyên sâu các báo cáo khoa học, phân tích tính hợp lệ, độ tin cậy và tác động khoa học rộng hơn."}]}]}], "forms": {"MS": {"domains": [{"code": "A", "name": "Asking questions", "indicator": "Formulate simple, testable questions from observations, distinguish scientific questions from non-scientific ones, identify basic patterns or inconsistencies, and ask follow-up questions that can be investigated through observation or evidence-based inquiry. Refine the question at least once in response to recorded observations or an initial investigation.", "evidence": "Research-reading journal question-sorting task (Stage 1); question log with revision history (Stage 2).", "checkpoints": "Wk 4 diagnostic; Wk 6 question approval.", "levels": ["Question is not testable, or is taken from the teacher list without adaptation; no refinement recorded.", "Testable question with one variable/factor, but refinement from observations is missing or superficial; follow-up questions are vague.", "Testable question within the teacher topic, refined at least once from recorded observations or an initial investigation; distinguishes scientific from nonscientific (fact- vs. opinion-based) questions with a reason; asks at least one targeted follow-up question about a pattern or contradiction.", "Meets P, and refinement is justified with pilot/observation evidence; generates several precise follow-up questions that sharpen the investigation."]}, {"code": "B", "name": "Developing models", "indicator": "Construct and use at least one labeled diagram or model of the investigated system (required for every project) to represent a phenomenon, identify key components and relationships, recognize basic model limitations, and suggest or test simple improvements based on observations or evidence.", "evidence": "Labeled model/diagram in research plan (Stage 3); model-limitation note in analysis (Stage 5); model discussed in report (Stage 6).", "checkpoints": "Wk 8 plan gate; Wk 14 provisional; Wk 18 final review.", "levels": ["No model, or an unlabeled drawing that does not show relationships.", "Labeled model shows components, but relationships to variables/factors are unclear; no limitation identified.", "Labeled model shows key components and relationships, is used to explain the prediction, and at least one specific limitation (scale, missing detail, assumption) is identified in light of the data.", "Meets P, and the model is revised after data collection, or two models/designs are compared using results."]}, {"code": "C", "name": "Planning investigations", "indicator": "Develop a testable hypothesis or reasoned prediction; identify independent, dependent, and control variables (or, for surveys and observations, the factors, and participants); decide what data to collect and select suitable tools with a reason; write a step-by-step procedure and complete a risk assessment with guidance. Record data with units and note deviations and main sources of error.", "evidence": "Research plan with variables/factors table, step-by-step procedure and risk assessment (Stage 3); consent and debrief materials where people are involved (stage 3); dated logbook with raw data, deviations and error notes (Stage 4).", "checkpoints": "Wk 8 plan gate; Wk 10 logbook check; Wk 12 raw data submitted.", "levels": ["Plan lacks a hypothesis, variables, or data table; data incomplete or unrecorded.", "IV and DV (or factors) identified with some controls; procedure or risk assessment incomplete; data recorded, but units, deviations or error sources are not noted.", "Hypothesis or reasoned prediction linked to a scientific idea; IV, DV and at least two controlled variables (or, for surveys and observations, the factors and participants) with a control strategy; step-by-step procedure; risk assessment completed with guidance; other factors that could affect the results named and those to be kept the same identified as controlled variables; data recorded accurately with units; deviations and main error sources noted.", "Meets P, and several confounding factors are anticipated and their likely effect on the results is predicted; the procedure is adjusted during collection with documented reasons."]}, {"code": "D", "name": "Analyzing data", "indicator": "Organize and analyze data using tables, graphs, and simple spreadsheet tools, calculate simple statistics (e.g., means, percentages); identify patterns, compare results with expectations, and examine unexpected results, draw an evidence-based conclusion; and use the patterns to propose a prediction or hypothesis for further investigation.", "evidence": "Analysis workbook and written analysis: patterns, comparison with prediction, anomalies (Stage 5); results and discussion sections of the report (stage 6).", "checkpoints": "Wk 14 provisional; Wk 16 Report; Wk 18 final review.", "levels": ["Data not organized, or graph type inappropriate; conclusion not based on data.", "Appropriate table/graph and pattern described, but simple statistics, comparison with the prediction, or anomalies missing; conclusion only partly supported.", "Appropriate tables/graphs made with a spreadsheet; simple statistics (e.g., means, percentages) calculated correctly; pattern described with values; results compared with the prediction; anomalies examined; conclusion stated with specific data values, saying whether the data support or contradict the prediction; a prediction or hypothesis for further investigation proposed.", "Meets P, and the variability between trials or respondents (e.g., range) is described and used in judging the conclusion; the proposed next investigation is justified from the pattern."]}, {"code": "E", "name": "Constructing explanations", "indicator": "Construct a simple scientific explanation for an observable phenomenon using basic scientific concepts, evidence from observations or investigations, and clear cause-and-effect reasoning. Identify at least one gap or weakness in their own or others’ explanations and suggest an improvement.", "evidence": "Claim–evidence explanation in report (Stage 6); Q&A notes and reflection with revision proposal (Stage 7).", "checkpoints": "Wk 16 report; Wk 18 final review.", "levels": ["Claim not linked to evidence, or scientifically incorrect.", "Claim supported by a general reference to results; reasoning incomplete; no weakness identified.", "Claim supported by at least two specific pieces of evidence with correct scientific concepts/causal reasoning; at least one gap or weakness in own or a peer’s explanation identified.", "Meets P, and an alternative explanation is considered and ruled in or out with evidence."]}, {"code": "F", "name": "Communicating information", "indicator": "Communicate scientific information using simple representations, interpret key ideas from scientific texts and data displays, and present evidence-based findings using basic scientific conventions. Judge the reliability of simple scientific or media reports and compare them with their own findings.", "evidence": "Research-reading journal (Stage 1); comparison with an external source (Stage 5); report and presentation (Stages 6–7).", "checkpoints": "Wk 4 diagnostic; Wk 16 report; Wk 18 final review.", "levels": ["Report missing major sections; representations unclear; external sources not evaluated.", "Most report sections present; representations mostly clear; judgment of external sources superficial.", "Complete G8 report (question, method, results, explanation/conclusion) with clear, labeled tables/graphs; oral presentation delivered; key ideas of at l
