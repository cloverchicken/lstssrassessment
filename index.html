 {label:T('Decision rules','Quy tắc kết luận'),html:()=>`<h3>${T('Core and supporting domains','Lĩnh vực cốt lõi và hỗ trợ')}</h3><p>${esc(G.coreText)}</p><p class="note">${esc(G.diag)}</p>
  <h3>${T('Overall decision rules (Table 5)','Quy tắc kết luận chung (Bảng 5)')}</h3><p class="note">${T('Apply from top to bottom; the first rule met gives the decision.','Áp dụng từ trên xuống; quy tắc đầu tiên được thỏa mãn cho kết luận.')}</p><div class="tbl"><table><thead><tr><th>${T('Decision','Kết luận')}</th><th>${T('Criteria','Tiêu chí')}</th><th>${T('Remediation target','Mục tiêu bồi dưỡng')}</th></tr></thead><tbody>${G.decisions.map(r=>`<tr><td class="k">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <h4>${T('Examples (A-B-C-D)','Ví dụ (A-B-C-D)')}</h4><div>${G.examples.map(x=>`<span class="chip">${esc(x[0])}: <b>${x[1]}</b></span>`).join('')}</div>`}
 ],head('',T('Guidelines for Teachers','Hướng dẫn cho giáo viên'))+``);}


function fig3d(){
 const dx=20,dy=-12,X0=80,Y0=110,W=100,H=65,SX=325,SW=110,SH=58,DOM=['A','B','C','D','E','F'];
 const nm=VI()?['Câu hỏi','Mô hình','Nghiên cứu','Dữ liệu','Giải thích','Truyền đạt']:['Questions','Models','Investigations','Data','Explanations','Communication'];
 const LV=['E','D','P','Ex'],TF=['var(--t0)','var(--t1)','var(--t2)','var(--t3)','var(--t4)'];
 const P=(a,f,s='var(--line)')=>`<polygon points="${a.map(q=>q.join(',')).join(' ')}" fill="${f}" stroke="${s}" stroke-width="1"/>`;
 let s='';
 // stem right face (drawn first)
 for(let k=0;k<4;k++)s+=P([[SX+SW+k*dx,Y0+H+k*dy],[SX+SW+(k+1)*dx,Y0+H+(k+1)*dy],[SX+SW+(k+1)*dx,Y0+H+5*SH+(k+1)*dy],[SX+SW+k*dx,Y0+H+5*SH+k*dy]],`var(--l${k})`);
 // stem fronts
 for(let r=0;r<5;r++){const tier=5-r,y=Y0+H+r*SH;s+=P([[SX,y],[SX+SW,y],[SX+SW,y+SH],[SX,y+SH]],TF[tier-1],'var(--pri-200)');
  s+=`<text x="${SX+SW/2}" y="${y+SH/2+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${tier>=4?'#fff':'var(--pri-d)'}">${VI()?'Bậc':'Tier'} ${tier}</text>`;
  if(tier===2||tier===4)s+=`<text x="${SX-10}" y="${y+SH/2+4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--pri)">${tier===2?T('Grade 8 target','Mục tiêu lớp 8'):T('Grade 10 target','Mục tiêu lớp 10')}</text>`;}
 // bar top + right faces
 for(let k=0;k<4;k++){s+=P([[X0+k*dx,Y0+k*dy],[X0+6*W+k*dx,Y0+k*dy],[X0+6*W+(k+1)*dx,Y0+(k+1)*dy],[X0+(k+1)*dx,Y0+(k+1)*dy]],`var(--l${k})`);
  s+=P([[X0+6*W+k*dx,Y0+k*dy],[X0+6*W+(k+1)*dx,Y0+(k+1)*dy],[X0+6*W+(k+1)*dx,Y0+H+(k+1)*dy],[X0+6*W+k*dx,Y0+H+k*dy]],`var(--l${k})`);
  s+=`<text x="${X0+(k+.5)*dx+16}" y="${Y0+(k+.5)*dy+3.5}" font-size="9" font-weight="700" fill="${k===3?'#fff':'var(--ok-ink)'}">${LV[k]}</text>`;}
 for(let c=1;c<6;c++)s+=`<line x1="${X0+c*W}" y1="${Y0}" x2="${X0+c*W+4*dx}" y2="${Y0+4*dy}" stroke="var(--line)"/>`;
 // bar fronts
 DOM.forEach((d,c)=>{const x=X0+c*W;s+=`<g data-d="${d}">${P([[x,Y0],[x+W,Y0],[x+W,Y0+H],[x,Y0+H]],'var(--ks)','var(--kc)')}<text x="${x+W/2}" y="${Y0+28}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--kc)">${d}</text><text x="${x+W/2}" y="${Y0+48}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--kc)">${nm[c]}</text></g>`;});
 // annotations
 const ar='var(--pri)';
 s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${ar}"/></marker></defs>`;
 s+=`<line x1="${X0}" y1="34" x2="${X0+6*W}" y2="34" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text x="${X0}" y="24" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Scientific practices: 6 domains, 27 skills','Thực hành khoa học: 6 lĩnh vực, 27 kỹ năng')}</text>`;
 s+=`<line x1="190" y1="${Y0+H+5*SH}" x2="190" y2="${Y0+H+6}" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text transform="translate(176 ${Y0+H+5*SH}) rotate(-90)" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Cognitive complexity: 5 tiers','Độ phức tạp nhận thức: 5 bậc')}</text>`;
 s+=`<line x1="${X0+6*W+12}" y1="${Y0+H+22}" x2="${X0+6*W+12+4*dx}" y2="${Y0+H+22+4*dy}" stroke="${ar}" stroke-width="2" marker-end="url(#ah)"/><text x="${X0+6*W+100}" y="${Y0+H+44}" text-anchor="end" font-size="13" font-weight="700" fill="var(--pri-d)">${T('Performance quality','Chất lượng thực hiện')}</text><text x="${X0+6*W+100}" y="${Y0+H+62}" text-anchor="end" font-size="12" fill="var(--muted)">${T('4 levels: E, D, P, Ex','4 mức: E, D, P, Ex')}</text>`;
 return `<figure class="fig3d"><svg viewBox="70 0 720 480" role="img" aria-label="${T('Three-dimensional T-shaped framework: scientific practices across, cognitive complexity down, performance quality in depth','Mô hình chữ T ba chiều: thực hành khoa học theo chiều ngang, độ phức tạp nhận thức theo chiều dọc, chất lượng thực hiện theo chiều sâu')}">${s}</svg></figure>`;}
/* ---------- learning design ---------- */
let g=store.get('ldg','G8'),st=0;
const sd=s=>(s||'').trim()[0];
const dname=s=>VI()?DOM_VI[sd(s)]:s.slice(3);
const wk=w=>VI()?w.replace(/Weeks?/,'Tuần'):w;
function renderLd(){const el=$('#ld');const L=DATA.ld[g];const LV=LD_VI[g];const total=L.stages[L.stages.length-1].end;const S=L.stages[st];
 const sname=i=>VI()?LD_VI.stages[i]:L.stages[i].stage;const SD=VI()?LV.detail[st]:S;
 const notes=VI()?LV.notes:L.notes;
 const cps=[...new Set(L.stages.flatMap(s=>[...s.checkpoint.matchAll(/\bWeek\s(\d+)\s–/g)].map(m=>+m[1])))].filter(w=>w<=total).sort((a,b)=>a-b);
 el.innerHTML=head('',T('SR learning design model map','Bản đồ mô hình thiết kế dạy học NCKH'))+
 `<div class="tabs" role="tablist"><button role="tab" data-g="G8" aria-selected="${g==='G8'}">${T('Grade 8 (18 weeks)','Lớp 8 (18 tuần)')}</button><button role="tab" data-g="G10" aria-selected="${g==='G10'}">${T('Grade 10 (43 weeks)','Lớp 10 (43 tuần)')}</button></div>
 <div class="sub fade-in"><dl class="gen">${notes.map(n=>{const i=n.indexOf(':');return `<dt>${esc(n.slice(0,i))}</dt><dd>${esc(n.slice(i+1).trim())}</dd>`}).join('')}</dl>
 <div class="stages">${L.stages.map((s,i)=>`<button class="stage" data-d="${sd(s.primary)}" data-s="${i}" aria-pressed="${i===st}"><span class="sn">${T('Stage','Giai đoạn')} ${i+1}</span><span class="st">${esc(sname(i).replace(/^\d+\.\s*/,''))}</span><span class="sw">${esc(wk(s.weeks))}</span></button>`).join('')}</div>
 <p class="note" style="margin-top:6px"><b>${T('Checkpoint weeks:','Tuần có mốc kiểm tra:')}</b> ${cps.map(w=>`<span class="chip">${T('Week','Tuần')} ${w}</span>`).join('')}</p>
 <article class="skill" data-d="${sd(S.primary)}"><h3>${esc(sname(st))} <span class="note" style="font-weight:600">(${esc(wk(S.weeks))})</span></h3>
 <dl>
 <dt>${T('Primary standard','Chuẩn chính')}</dt><dd>${kn(sd(S.primary))} ${esc(dname(S.primary))}</dd>
 <dt>${T('Supporting standard','Chuẩn hỗ trợ')}</dt><dd>${kn(sd(S.supporting))} ${esc(dname(S.supporting))}</dd>
 <dt>${T('Indicators emphasised','Chỉ báo nhấn mạnh')}</dt><dd>${esc(SD.indicators)}</dd>
 <dt>${T('Knowledge boundary','Phạm vi kiến thức')}</dt><dd>${esc(SD.boundary)}</dd>
 <dt>${T('Know','Biết')}</dt><dd>${bullets(SD.K)}</dd><dt>${T('Understand','Hiểu')}</dt><dd>${bullets(SD.U)}</dd><dt>${T('Do','Làm')}</dt><dd>${bullets(SD.D)}</dd>
 <dt>${T('Evidence','Minh chứng')}</dt><dd>${bullets(SD.evidence)}</dd>
 <dt>${T('Checkpoint and remediation','Mốc kiểm tra và bồi dưỡng')}</dt><dd class="tgt" style="background:var(--pri-50);color:var(--pri-ink)">${esc(VI()?LV.checkpoints[st]:S.checkpoint)}</dd></dl></article>
 <h3>${T('Research fields with planned exemplar lessons','Các lĩnh vực nghiên cứu dự kiến có bài dạy mẫu')}</h3><div>${(VI()?LD_VI.fields:L.fields).map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div></div>`;
 el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;st=0;store.set('ldg',g);renderLd()});
 el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st=+b.dataset.s;renderLd()});}

/* ---------- shell ---------- */
const tabs=[...document.querySelectorAll('[role=tab].pill')];
let curTab=null;
function openTab(id,focus){curTab=id;tabs.forEach((t,i)=>{const on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;if(on){$('#count').textContent=`${u('section')} ${i+1} / ${tabs.length}`;$('#prog').style.width=((i+1)/tabs.length*100)+'%';if(focus)t.focus()}});store.set('tab',id);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
tabs.forEach((t,i)=>{t.onclick=()=>{openTab(t.getAttribute('aria-controls'));window.scrollTo({top:0})};t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];openTab(n.getAttribute('aria-controls'),true)}}});
function renderAll(){document.documentElement.lang=VI()?'vi':'en';
 $('.top h1').textContent=u('title');$('#foot').textContent=u('foot');
 document.title=u('title');
 tabs.forEach(t=>{t.textContent=T(...UI.tabs[t.getAttribute('aria-controls')])});
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 renderPlan();renderStd();renderTool();renderGuide();renderLd();
 if(curTab)openTab(curTab);}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('ui_lang',lang);renderAll()});
renderAll();
const start=(location.hash||'').slice(1);openTab(['plan','std','tool','guide','ld'].includes(start)?start:store.get('tab','plan'));

</script>
