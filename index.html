<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSTS Scientific Research Standards – Assessment Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f1f5f9;--ink:#0f172a;--ink2:#1e293b;--body:#1e293b;--muted:#475569;--faint:#64748b;--line:#e2e8f0;
  --pri:#4f46e5;--pri-d:#3730a3;--pri-50:#eef2ff;--pri-100:#e0e7ff;--pri-200:#c7d2fe;--pri-ink:#312e81;
  --ok:#059669;--ok-100:#d1fae5;--ok-200:#a7f3d0;--ok-ink:#065f46;
  --A:#1d4ed8;--As:#eff6ff;--B:#6d28d9;--Bs:#f5f3ff;--C:#c2410c;--Cs:#fff7ed;--D:#047857;--Ds:#ecfdf5;--E:#be123c;--Es:#fff1f2;--F:#475569;--Fs:#f1f5f9;
  --l0:#f8fafc;--l1:#ecfdf5;--l2:#d1fae5;--l3:#059669;--l3ink:#ffffff;
  --warn:#92400e;--warn-bg:#fffbeb;--warn-line:#fde68a;
  --sticky:rgba(255,255,255,.96);--shadow:0 1px 2px 0 rgba(15,23,42,.05);--shadow2:0 1px 3px 0 rgba(15,23,42,.1),0 1px 2px -1px rgba(15,23,42,.1);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
button{font:inherit}

.shell{padding:16px 12px}
@media (min-width:640px){.shell{padding:24px}}
@media (min-width:1024px){.shell{padding:24px 40px}}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);margin:-16px -12px 16px;padding:12px 12px 12px}
@media (min-width:640px){.sticky{margin:-24px -24px 16px;padding:14px 24px 12px}}
@media (min-width:1024px){.sticky{margin:-24px -40px 20px;padding-left:40px;padding-right:40px}}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{margin:0;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.top h1{margin:0;font-size:1.125rem;line-height:1.35;font-weight:800;color:var(--ink)}
@media (min-width:640px){.top h1{font-size:1.25rem}}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.count{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.count.p{border-color:var(--pri-200);background:var(--pri-50);color:var(--pri-d)}
@media (max-width:640px){.count{padding:5px 8px;font-size:.7rem}.top-r{gap:4px}}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress div{height:100%;background:var(--pri);border-radius:999px;transition:width .4s ease}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{flex:none;appearance:none;border:0;font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;background:var(--ok-100);color:var(--ok-ink);transition:background-color .15s}
.pill:hover{background:var(--ok-200)}
.pill[aria-selected="true"]{background:var(--pri);color:#fff;box-shadow:var(--shadow2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
@media (min-width:640px){.card{padding:32px}}
.foot{text-align:center;font-size:.75rem;color:var(--faint);padding-top:8px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
section[role=tabpanel][hidden]{display:none}

.s-head{margin-bottom:16px}
.s-head .meta{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.s-head h2{margin:0;font-size:1.25rem;line-height:1.35;font-weight:700;color:var(--pri-d)}
.goal{background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem;color:var(--pri-ink)}
.goal b{color:var(--pri-d)}
.goal p{color:var(--pri-ink);margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-bottom:20px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{flex:none;appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--body);font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{border-color:var(--pri-200);color:var(--pri)}
.tabs button[aria-selected="true"]{background:var(--pri-50);border-color:var(--pri-200);color:var(--pri-d)}
h3{font-size:1.05rem;font-weight:700;color:var(--ink2);margin:24px 0 10px}
.sub>h3:first-child{margin-top:0}
h4{font-size:.95rem;font-weight:700;color:var(--ink2);margin:16px 0 6px}
p{margin:0 0 10px;color:var(--body);font-size:.9rem}
.note{color:var(--muted);font-size:.85rem}
ul,ol{padding-left:1.25em;margin:0 0 10px;color:var(--body);font-size:.9rem}
li{margin:3px 0}
.tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;color:var(--body)}
th,td{padding:10px 12px;vertical-align:top;text-align:left;border:1px solid var(--line)}
tr>:first-child{border-left:0} tr>:last-child{border-right:0}
thead tr:first-child>*{border-top:0} tbody tr:last-child>*{border-bottom:0}
th{background:var(--surface2);font-weight:700;color:var(--ink2)}
td.k{font-weight:600;white-space:nowrap;color:var(--ink2)}
.notebox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.875rem;color:var(--warn)}
.toolbar{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.toolbar .lab{font-size:.75rem;font-weight:600;color:var(--muted);margin-right:2px}
.toolbar button{appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}
.toolbar button:hover{border-color:var(--pri-200);color:var(--pri)}
.toolbar button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.toolbar .gap{width:12px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:0 4px 4px 0;font-size:.8rem;background:var(--surface2);color:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.legend span{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--body)}

/* domain tag (like .kn) */
.kn{display:inline-block;font-weight:700;font-size:.78em;padding:1px 7px;border-radius:6px;white-space:nowrap;color:var(--kc);background:var(--ks)}
.kn.sup{background:transparent;box-shadow:inset 0 0 0 1.5px var(--kc)}
[data-d="A"]{--kc:var(--A);--ks:var(--As)}[data-d="B"]{--kc:var(--B);--ks:var(--Bs)}[data-d="C"]{--kc:var(--C);--ks:var(--Cs)}
[data-d="D"]{--kc:var(--D);--ks:var(--Ds)}[data-d="E"]{--kc:var(--E);--ks:var(--Es)}[data-d="F"]{--kc:var(--F);--ks:var(--Fs)}

/* skill card */
.skill{border:1px solid var(--line);border-left:4px solid var(--kc,var(--pri));border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.skill h3{margin:0 0 10px;color:var(--kc,var(--pri-d));font-size:1rem}
.skill dl{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;margin:0;font-size:.9rem}
.skill dt{font-weight:600;color:var(--muted);font-size:.85rem}
.skill dd{margin:0;color:var(--body)}
.skill dd p{margin:0 0 4px}
.skill dd ul{margin:2px 0 0}
.skill dd .vi{color:var(--muted)}
.skill dd.tgt{background:var(--ks,var(--pri-50));border-radius:8px;padding:6px 10px;margin:-6px 0}
.linkbtn{appearance:none;background:none;border:0;padding:8px 0 0;color:var(--pri);font-weight:600;font-size:.8rem;cursor:pointer}
@media (max-width:640px){.skill dl{grid-template-columns:1fr;gap:2px}.skill dd{margin-bottom:10px}.skill dd.tgt{margin:0 0 10px}}
.gen{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem}
.gen dt{font-weight:700;color:var(--pri-d)}
.gen dd{margin:0;color:var(--pri-ink)}
@media (max-width:640px){.gen{grid-template-columns:1fr;gap:2px}.gen dd{margin-bottom:8px}}

/* indicator with 4-level ladder */
.ind{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ind header{padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line)}
.ind header h4{margin:0;font-size:.95rem}
.ind header .forms{font-size:.85rem;color:var(--body);flex-basis:100%;margin:4px 0 0}
.ind .meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.ind .meta div{padding:10px 16px;font-size:.83rem;color:var(--body)}
.ind .meta div+div{border-left:1px solid var(--line)}
.ind .meta b{display:block;font-size:.75rem;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:0}
.ladder li{margin:0;border-right:1px solid var(--line)}
.ladder li:last-child{border-right:0}
.ladder button{appearance:none;display:flex;flex-direction:column;justify-content:flex-start;width:100%;height:100%;text-align:left;border:0;padding:12px 14px;font-size:.85rem;color:var(--body);cursor:pointer;background:transparent}
.ladder button b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="0"]{background:var(--l0)}.ladder li[data-l="1"]{background:var(--l1)}.ladder li[data-l="2"]{background:var(--l2)}
.ladder li[data-l="3"]{background:var(--l3)}.ladder li[data-l="3"] button,.ladder li[data-l="3"] button b{color:var(--l3ink)}
.ladder button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--pri)}
.ladder button[aria-pressed="true"] b::after{content:"  ✓ selected";font-weight:700}
@media (max-width:760px){.ladder{grid-template-columns:1fr}.ladder li{border-right:0;border-bottom:1px solid var(--line)}.ladder li:last-child{border-bottom:0}.ind .meta{grid-template-columns:1fr}.ind .meta div+div{border-left:0;border-top:1px solid var(--line)}}
.summary{position:sticky;bottom:0;z-index:5;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.summary .lb{font-size:.7rem;font-weight:600;color:var(--muted)}
.summary .dec{font-size:1.05rem;font-weight:800;color:var(--pri-d)}
.summary .sc{display:flex;gap:4px}
.summary .sc span{min-width:30px;height:26px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--faint)}
.summary .val{font-size:.85rem;font-weight:600;color:var(--body)}
.summary .reset{margin-left:auto;appearance:none;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}

/* list items (toc style) */
.toc-list{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.toc-list li{margin:0}
.toc-item{display:grid;grid-template-columns:40px 110px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.toc-item.two{grid-template-columns:40px 1fr}
.toc-item .n{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--pri-50);color:var(--pri)}
.toc-item .w{font-weight:700;font-size:.8rem;color:var(--pri);padding-top:7px}
.toc-item .c b{display:block;font-size:.95rem;font-weight:700;color:var(--ink2);margin-bottom:2px}
.toc-item .c p{margin:0;color:var(--muted);font-size:.85rem}
.toc-item.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.toc-item.warn .n{background:var(--warn-line);color:var(--warn)}
@media (max-width:640px){.toc-item{grid-template-columns:36px 1fr;gap:4px 12px}.toc-item .c{grid-column:1 / -1}}

/* option cards */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.tm{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px}
.tm.rec{border-left-color:var(--pri);background:var(--pri-50);border-color:var(--pri-200)}
.tm h4{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pri);color:#fff}
.tm dl{margin:0;font-size:.85rem}
.tm dt{color:var(--muted);font-size:.75rem;font-weight:600;margin-top:8px}
.tm dd{margin:0;color:var(--body)}
.tm ul{margin:2px 0 0;font-size:.85rem}
.pro li::marker{content:"+  ";color:var(--ok);font-weight:700}
.con li::marker{content:"–  ";color:var(--E);font-weight:700}

/* timeline */
.bar{display:flex;min-height:44px;border-radius:999px;overflow:hidden;margin:6px 0 4px;gap:2px;background:var(--line)}
.bar button{appearance:none;border:0;display:flex;flex-direction:column;justify-content:center;padding:4px 12px;font-size:.72rem;font-weight:700;color:var(--kc);background:var(--ks);text-align:left;cursor:pointer;line-height:1.2;min-width:0;overflow:hidden}
.bar button span{font-weight:500;opacity:.85}
.bar button[aria-pressed="true"]{background:var(--kc);color:#fff}
.ticks{position:relative;height:28px;margin-bottom:12px}
.ticks i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:.68rem;font-weight:600;color:var(--pri);display:flex;flex-direction:column;align-items:center}
.ticks i::before{content:"";width:2px;height:8px;background:var(--pri);margin-bottom:1px;border-radius:2px}
@media (max-width:760px){.bar{flex-direction:column;border-radius:12px}.bar button{flex:none!important;padding:8px 12px;font-size:.8rem}.ticks{display:none}}
.pillv{display:inline-block;min-width:28px;text-align:center;padding:1px 8px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700}
.dash{color:var(--faint)}

.lang{display:inline-flex;border:2px solid var(--pri-200);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--pri-d);font-size:.75rem;font-weight:700;padding:4px 10px;cursor:pointer}
.lang button+button{border-left:2px solid var(--pri-200)}
.lang button[aria-pressed="true"]{background:var(--pri);color:#fff}
@media (max-width:640px){.lang button{padding:3px 8px;font-size:.7rem}}
table.opt th.rec,table.opt td.rec{background:var(--pri-50)}
table.opt th.rec{color:var(--pri-d)}
table.opt tbody th{white-space:normal;background:var(--surface2)}
table.opt{table-layout:fixed}
table.opt td ul{margin:0;font-size:.85rem}
table.std{table-layout:fixed;min-width:980px}
table.std th:first-child,table.std td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);width:160px;box-shadow:1px 0 0 var(--line)}
table.std thead th:first-child{background:var(--surface2)}
table.std th.tgt{background:var(--pri-100);color:var(--pri-d)}
table.std td.tgt{background:var(--pri-50)}
table.std td:first-child b{display:block;color:var(--kc)}
table.std th small{display:block;font-weight:600;color:var(--pri)}
@media (max-width:640px){table.std th:first-child,table.std td:first-child{width:130px}}
.ladder li{padding:12px 14px;font-size:.85rem;color:var(--body)}
.ladder li b{display:block;font-size:.75rem;margin-bottom:4px;color:var(--ink2)}
.ladder li[data-l="3"] b{color:var(--l3ink)}
.tabs.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.tabs.dgrid button{white-space:normal;text-align:left;align-items:flex-start;line-height:1.35}
.tabs.dgrid button .kn{margin-top:1px}
@media (max-width:640px){.tabs.dgrid{gap:4px}.tabs.dgrid button{flex-direction:column;gap:4px;padding:6px 8px;font-size:.72rem}}

:root{--t0:#eef2ff;--t1:#e0e7ff;--t2:#c7d2fe;--t3:#818cf8;--t4:#4f46e5}
.ladder.t5{grid-template-columns:repeat(5,1fr)}
.ladder li[data-t="0"]{background:var(--t0)}.ladder li[data-t="1"]{background:var(--t1)}.ladder li[data-t="2"]{background:var(--t2)}
.ladder li[data-t="3"]{background:var(--t3);color:#fff}.ladder li[data-t="4"]{background:var(--t4);color:#fff}
.ladder li[data-t="3"] b,.ladder li[data-t="4"] b,.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{color:#fff}
.ladder .gr{display:block;width:fit-content;font-size:.7rem;font-weight:700;color:var(--pri);margin-bottom:4px}
.ladder li[data-t="3"] .gr,.ladder li[data-t="4"] .gr{background:rgba(255,255,255,.2);padding:0 6px;border-radius:6px}
@media (max-width:760px){.ladder.t5{grid-template-columns:1fr}}
.fig3d{margin:0;overflow-x:auto}
.fig3d svg{display:block;width:100%;max-width:760px;min-width:480px;height:auto;margin:0 auto;font-family:var(--sans)}
.ladder li[data-l="3"]{color:var(--l3ink)}

.stages{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.stage{appearance:none;text-align:left;border:2px solid var(--line);border-top:5px solid var(--kc);border-radius:12px;background:var(--surface);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;font:inherit;color:inherit}
.stage:hover{border-color:var(--kc);border-top-width:5px}
.stage .sn{font-size:.7rem;font-weight:700;color:var(--kc)}
.stage .st{font-size:.85rem;font-weight:700;color:var(--ink2);line-height:1.3;overflow-wrap:anywhere}
.stage .sw{font-size:.75rem;font-weight:600;color:var(--muted)}
.stage[aria-pressed="true"]{background:var(--ks);border-color:var(--kc);box-shadow:var(--shadow2)}
@media (max-width:1100px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tlwrap{position:relative;margin:2px 0 4px;padding:4px 0}
.tl{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line)}
.tl span{background:var(--ks)}
.tl span.on{background:var(--kc)}
.tlwrap .dot{position:absolute;top:0;width:3px;height:20px;border-radius:2px;background:var(--pri);transform:translateX(-50%)}
.tlaxis{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--faint)}
.stage.all{--kc:var(--pri);--ks:var(--pri-50)}
table.ldt{table-layout:fixed;min-width:2350px;font-size:.82rem}
table.ldt th:nth-child(1){width:150px}table.ldt th:nth-child(2),table.ldt th:nth-child(3){width:140px}table.ldt th:nth-child(4){width:330px}table.ldt th:nth-child(5){width:300px}table.ldt th:nth-child(6){width:260px}table.ldt th:nth-child(7){width:220px}table.ldt th:nth-child(8){width:300px}table.ldt th:nth-child(9){width:240px}table.ldt th:nth-child(10){width:270px}
table.ldt th:first-child,table.ldt td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
table.ldt thead th:first-child{background:var(--surface2)}
table.ldt tbody td:first-child{border-left:4px solid var(--kc)}
table.ldt td .wk{display:block;font-size:.75rem;color:var(--muted);font-weight:600;margin-top:2px}
table.ldt td ul{margin:0;padding-left:1.1em;font-size:.82rem}
table.ldt td.cp{background:var(--pri-50);color:var(--pri-ink)}
table.dpt{table-layout:fixed;min-width:1080px;font-size:.84rem}
table.dpt th:first-child,table.dpt td:first-child{position:sticky;left:0;z-index:1;width:150px;background:var(--surface);box-shadow:1px 0 0 var(--line);font-weight:700;color:var(--ink2)}
table.dpt thead th:first-child{background:var(--surface2)}
table.dpt tbody tr[data-d] td:first-child{border-left:4px solid var(--kc);color:var(--kc)}
table.dpt th.tgt{background:var(--pri-100);color:var(--pri-d)}
table.dpt td.tgt{background:var(--pri-50)}
table.dpt th small{display:block;font-weight:600;color:var(--pri)}
table.dpt tr.sep td{border-top:2px solid var(--line)}
@media (max-width:640px){table.dpt th:first-child,table.dpt td:first-child{width:120px}}
@media (max-width:640px){table.ldt th:first-child{width:120px}}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.hbtn{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:.8rem;font-weight:700;border-radius:8px;border:2px solid var(--pri-200);background:var(--pri-50);color:var(--pri-d);text-decoration:none;white-space:nowrap}
.hbtn:hover{background:var(--pri);border-color:var(--pri);color:#fff}

<script>
const DATA = {"domains": [{"code": "A", "title": {"en": "Asking questions and defining problems", "vi": "Đặt câu hỏi và xác định vấn đề"}, "def": [{"en": "A practice is to ask and refine questions that lead to descriptions and explanations of how the natural and designed world(s) works and which can be empirically tested.", "vi": "Kỹ thuật thực hành này là đặt và điều chỉnh các câu hỏi dẫn đến mô tả và lý giải phương thức hoạt động của thế giới tự nhiên và thế giới do con người tạo ra, đồng thời có thể kiểm chứng bằng thực nghiệm."}, {"en": "Engineering questions clarify problems to determine criteria for successful solutions and identify constraints to solve problems about the designed world. Both scientists and engineers also ask questions to clarify ideas.", "vi": "Các câu hỏi trong kỹ thuật giúp làm rõ vấn đề, xác định tiêu chí cho giải pháp thành công và nhận diện các ràng buộc để giải quyết vấn đề. Các nhà khoa học và kỹ sư cũng đặt câu hỏi để làm rõ ý tưởng."}], "skills": [{"code": "A1", "name": {"en": "Asking questions about the natural and human-built worlds", "vi": "Đặt câu hỏi về thế giới tự nhiên và thế giới nhân tạo"}, "tiers": [{"en": "Identify basic questions about observations and extend them to explore \"what-if\" scenarios (e.g., what would happen if a variable were changed). Define a simple design problem with one criterion for success.", "vi": "Xác định các câu hỏi cơ bản về quan sát và mở rộng chúng thành các tình huống “nếu… thì…” (ví dụ: điều gì sẽ xảy ra nếu thay đổi một biến). Xác định một vấn đề thiết kế đơn giản với một tiêu chí thành công."}, {"en": "Ask \"why\" questions about the causes of a natural phenomenon. Define a simple design problem with several criteria for success and constraints on materials, time, or cost.", "vi": "Đặt các câu hỏi “tại sao” về nguyên nhân của một hiện tượng tự nhiên. Xác định một vấn đề thiết kế đơn giản với một số tiêu chí thành công và các ràng buộc về vật liệu, thời gian hoặc chi phí."}, {"en": "Ask specific questions about how the parts of a system interact or what pattern underlies a set of observations. Define a design problem whose constraints include limits set by scientific principles (e.g., energy conservation, material properties).", "vi": "Đặt các câu hỏi cụ thể về cách các bộ phận trong một hệ thống tương tác với nhau hoặc quy luật nào nằm sau một tập hợp quan sát. Xác định một vấn đề thiết kế có ràng buộc bao gồm các giới hạn do nguyên lý khoa học đặt ra (ví dụ: bảo toàn năng lượng, tính chất vật liệu)."}, {"en": "Formulate questions derived from models, theories, or prior studies that specify the mechanism or relationship to be investigated. Define a design problem with multiple criteria and constraints and prioritize them.", "vi": "Hình thành các câu hỏi xuất phát từ mô hình, lý thuyết hoặc các nghiên cứu trước, nêu rõ cơ chế hoặc mối quan hệ cần khảo sát. Xác định một vấn đề thiết kế với nhiều tiêu chí và ràng buộc, đồng thời xếp thứ tự ưu tiên cho chúng."}, {"en": "Formulate questions that identify gaps in existing scientific knowledge or understanding, driving further inquiry and exploration. Define a design problem for a system with interacting components, including social, technical, and/or environmental constraints.", "vi": "Hình thành các câu hỏi xác định các khoảng trống trong tri thức khoa học hiện tại, thúc đẩy tìm tòi và khám phá thêm. Xác định một vấn đề thiết kế cho một hệ thống có các thành phần tương tác, bao gồm các ràng buộc về xã hội, kỹ thuật và/hoặc môi trường."}]}, {"code": "A2", "name": {"en": "Distinguishing a scientific question from a nonscientific question", "vi": "Phân biệt câu hỏi khoa học và câu hỏi phi khoa học"}, "tiers": [{"en": "Sort questions into scientific (testable) and non-scientific (non-testable) inquiries and give a simple reason.", "vi": "Phân loại các câu hỏi khoa học (có thể kiểm chứng) và phi khoa học (không thể kiểm chứng) và nêu lý do đơn giản."}, {"en": "Explain why one question can be answered with evidence (measurement or observation) while another depends on opinion or preference, and rewrite an opinion-based questions as a testable one.", "vi": "Giải thích vì sao một câu hỏi có thể trả lời bằng bằng chứng (đo đạc hoặc quan sát) còn câu hỏi khác phụ thuộc vào ý kiến hay sở thích, và viết lại câu hỏi mang tính ý kiến thành câu hỏi có thể kiểm chứng."}, {"en": "State what empirical evidence would be needed to answer a question and judge whether evidence from different sources supports or contradicts a particular answer.", "vi": "Nêu bằng chứng thực nghiệm cần có để trả lời câu hỏi và đánh gái bằng chứng từ các nguồn khác nhau ủng hộ hay mâu thuẫn với một câu trả lời cụ thể."}, {"en": "Distinguish questions that require new empirical data from those thatcan be asnwered from existing literature or theoretical analysis, and choose the approach that fits the research question.", "vi": "Phân biệt câu hỏi cần dữ liệu thực nghiệm với câu hỏi có thể trả lời từ tài liệu sẵn có hoặc phân tích lý thuyết, và chọn cách tiếp cận phù hợp với câu hỏi nghiên cứu."}, {"en": "Separate the empirical, ethical, and philosophical aspects of a complex question, define which parts can be investigated empirically, and select methods appropriate to those parts.", "vi": "Tách các khía cạnh thực nghiệm, đạo đức và triết học của một câu hỏi phức hợp, xác định phần nào có thể nghiên cứu bằng thực nghiệm, và chọn phương pháp phù hợp cho các phần đó.."}]}, {"code": "A3", "name": {"en": "Formulating and refining questions that can be answered empirically in a classroom", "vi": "Xây dựng và điều chỉnh các câu hỏi có thể trả lời bằng thực nghiệm trong phạm vi lớp học"}, "tiers": [{"en": "Turn an observation, model, or an unexpected result into a question that could be answered by looking, measuring, or testing in class.", "vi": "Chuyển một quan sát, mô hình hoặc kết quả bất ngờ thành câu hỏi có thể trả lời bằng cách quan sát, đo đạc hoặc thử nghiệm trên lớp."}, {"en": "Revise a question after an initial observation or trial so that it names what will be changed and what will be measured or observed.", "vi": "Điều chỉnh câu hỏi sau một lần quan sát hoặc thử nghiệm ban đầu để câu hỏi nêu rõ yếu tố sẽ thay đổi hoặc yếu tố sẽ được đo hoặc quan sát."}, {"en": "Write a research question, building on a source or a model, that statesthe expected form of the relationship between variables (e.g., increase, decrease, threshold) and how each variables will be measured, so that a testable hypothesis follows from it.", "vi": "Viết một câu hỏi nghiên cứu, dựa theo nguồn tài liệu hoặc mô hình, nêu dạng quan hệ dự kiến giữa các biến (ví dụ: tăng, giảm, ngưỡng) và cách đo từng biến, sao cho có thể rút ra một giả thuyết có thể kiểm chứng được."}, {"en": "Develop and justify precise, testable questions linked to hypotheses, defining variables operationally and judging feasibility with available resources.", "vi": "Xây dựng và lập luận cho các câu hỏi chính xác, có thể kiểm chứng, gắn với các giả thuyết dựa trên lý thuyết, định nghĩa biến số theo cách đo lường được và đánh giá tính khả thi với nguồn lực sẵn có."}, {"en": "Construct research questions that address a gap identified in the literature, specifying variables, scope, and the evidence needed, and justify their significance.", "vi": "Xây dựng các câu hỏi nghiên cứu nhằm giải quyết một khoảng trống được xác định từ tài liệu, nêu rõ biến số, phạm vi và bằng chứng cần có, đồng thời lập luận về ý nghĩa của câu hỏi."}]}, {"code": "A4", "name": {"en": "Asking probing questions that seek to identify the premises of an argument, request further elaboration, refine a research question or engineering problem, or challenge the interpretation of a data set", "vi": "Đặt câu hỏi các câu hỏi thăm dò nhằm xác định tiền đề của lập luận, yêu cầu giải thích thêm, điều chỉnh các câu hỏi nghiên cứu hoặc vấn đề kỹ thuật, hoặc thách thức cách diễn giải dữ liệu"}, "tiers": [{"en": "Ask simple follow-up questions (e.g., “How do we know?”, “What happens next?”) that clarify an observation (e.g., \"What happened first?\", \"What happens next?\"), using teacher prompts.", "vi": "Đặt câu hỏi tiếp nối đơn giản (ví dụ: \"Làm sao chúng ta biết?\", \"Chuyện gì sẽ xảy ra tiếp theo?\") để làm rõ một quan sát sử dụng hướng dẫn của giáo viên."}, {"en": "Develop follow-up questions that request the evidence behind a claim or clarify how a conclusion was reached (e.g., \"What data show this?\", \"How was it measured?\").", "vi": "Phát triển các câu hỏi tiếp theo để yêu cầu bằng chứng cho một luận điểm hoặc làm rõ ách đi đến kết luận (ví dụ: \"Dữ liệu nào cho thấy điều này?\", \"Đã đo bằng cách nào?\")."}, {"en": "Ask counter-questions that challenge a data interpretation and propose alternative explanations for it.", "vi": "Đặt các câu hỏi phản biện nhằm chất vấn cách diễn giải dữ liệu và đề xuất các lý giải có thể thay thế."}, {"en": "Ask probing questions that expose the assumptions, premises, and potential biases behind an argument, a data interpretation, or their own research question, and use them to refine the question.", "vi": "Đặt các câu hỏi thăm dò nhằm làm rõ các giả định, tiền đề và thiên lệch tiềm ẩn đằng sau một lập luận, một cách diễn giải dữ liệu hoặc câu hỏi nghiên cứu của chính mình, và dùng chúng để điều chỉnh câu hỏi."}, {"en": "Ask questions that compare assumptions and methods of several studies, identify which methodological choices could explain their conflicting results, and use them to define what a new study must do differently.", "vi": "Đặt câu hỏi so sánh giả định và phương pháp của nhiều nghiên cứu, xác định lựa chọn phương pháp nào có thể giải thích các kết quả mâu thuẫn giữa chúng, và dùng các câu hỏi đó để xác định một nghiên cứu mới cần làm khác đi như thế nào."}]}, {"code": "A5", "name": {"en": "Noting features, patterns, or contradictions in observations and ask questions about them.", "vi": "Nhận diện các đặc điểm, quy luật hoặc mâu thuẫn trong các quan sát và đặt câu hỏi về chúng"}, "tiers": [{"en": "Describe a pattern in observations (e.g., something that always happens before something else) and ask a question about it.", "vi": "Mô tả một quy luật trong các quan sát (ví dụ: một điều luôn xảy ra trước một điều khác) và đặt câu hỏi về quy luật đó.."}, {"en": "Ask questions about where observed results different from the prediction (e.g., \"Why was this value higher than expected?\").", "vi": "Đặt câu hỏi về những chỗ kết quả quan sát khác với dự đoán (ví dụ: \"Vì sao giá trị này cao hơn dự kiến?\")."}, {"en": "Construct questions about discrepancies between observed patterns and predictions that propose possible causes to be tested.", "vi": "Xây dựng các câu hỏi về khác biệt giữa các quy luật quan sát được và dự đoán, kèm theo các nguyên nhân có thể kiểm chứng."}, {"en": "Identify contradictions across data sets pr studies and construct whose answers would resolve them, specifying evidence required.", "vi": "Nhận diện các mâu thuẫn giữa các bộ dữ liệu hoặc các nghiên cứu và xây dựng các câu hỏi mà câu trả lời sẽ giải quyết được mâu thuẫn đó, nêu rõ bằng chứng cần có."}, {"en": "Generate questions from multivariable patterns, anomalies, and contradictions that open new lines of investigation beyond the original study.", "vi": "Tạo ra các câu hỏi từ quy luật đa biến, điểm bất thường và mâu thuẫn, mở ra các hướng nghiên cứu mới vượt ra ngoài nghiên cứu ban đầu."}]}]}, {"code": "B", "title": {"en": "Developing and using models", "vi": "Phát triển và sử dụng mô hình"}, "def": [{"en": "A practice is to use and construct models as helpful tools for representing ideas and explanations. These tools include diagrams, drawings, physical replicas, mathematical representations, analogies, and computer simulations. Modeling tools are used to develop questions, predictions, and explanations; analyze and identify flaws in systems; and communicate ideas. Models are used to build and revise scientific explanations and proposed engineered systems. Measurements and observations are used to revise models and designs.", "vi": "Kỹ thuật thực hành này là sử dụng và xây dựng các mô hình như công cụ hữu ích để trình bày các ý tưởng và các lý giải. Các công cụ này bao gồm sơ đồ, bản vẽ, mô hình vật lý, biểu diễn toán học, phép so sánh và mô phỏng máy tính. Mô hình được dùng để phát triển câu hỏi, dự đoán, giải thích; phân tích và phát hiện điểm yếu của hệ thống; và truyền đạt ý tưởng. Mô hình được dùng để xây dựng và điều chỉnh các giải thích khoa học hoặc hệ thống kỹ thuật được đề xuất. Các phép đo và quan sát được sử dụng để điều chỉnh mô hình và thiết kế."}], "skills": [{"code": "B1", "name": {"en": "Constructing drawings or diagrams as representations of events or systems", "vi": "Phác họa các bản vẽ hoặc sơ đồ để biểu diễn sự kiện hoặc hệ thống"}, "tiers": [{"en": "Draw and label simple diagram of an object, event, or set-up, showing the main parts.", "vi": "Vẽ và ghi chú sơ đồ đơn giản của một vật thể, sự kiện hoặc bố trí thí nghiệm, thể hiện các bộ phận chính."}, {"en": "Draw labeled diagrams that show how components are connected and how a change in one component affects another.", "vi": "Vẽ sơ đồ có ghi chú thể hiện cách các thành phần liên kết với nhau và sự thay đổi của một thành phần ảnh hưởng đến thành phần khác như thế nào."}, {"en": "Create diagrams that represent multiple components, their interactions, and changes overtime, and explain these relationships.", "vi": "Tạo các sơ đồ thể hiện nhiều thành phần, sự tương tác giữa chúng và sự thay đổi theo thời gian, đồng thời giải thích mối quan hệ này."}, {"en": "Construct annotated diagrams that show interactions between several systems or processes, and explain the underlying principles and interdependencies.", "vi": "Xây dựng các sơ đồ chú thích thể hiện sự tương tác giữa nhiều hệ thống hoặc quá trình và giải thích các nguyên lý nền tảng cũng như và mối phụ thuộc lẫn nhau."}, {"en": "Design diagram that follow standard scientific conventions and symbols to represent complex systems accurately enough to support quantitative prediction or communication with experts.", "vi": "Thiết kế các sơ đồ tuân quy ước và ký hiệu khoa học chuẩn, biểu diễn hệ thống phức tạp đủ chính xác để hỗ trợ dự đoán định lượng hoặc trao đổi với chuyên gia."}]}, {"code": "B2", "name": {"en": "Representing and explaining phenomena with multiple types of models", "vi": "Biểu diễn và giải thích hiện tượng bằng nhiều loại mô hình"}, "tiers": [{"en": "Use a given physical model or analogy to describe a phenomena, stating which part of the model represents which part of reality.", "vi": "Sử dụng một mô hình vật lý hoặc cấu trúc để mô tả hiện tượng, nêu được phần nào của mô hình đại diện cho phần nào trong thực tế."}, {"en": "Develop a simple physical or conceptual models to explain a basic phenomena, making connections between the model to relevant scientific concepts.", "vi": "Xây dựng một mô hình vật lý hoặc khái niệm đơn giản để giải thích một hiện tượng cơ bản, liên kết mô hình với các khái niệm khoa học liên quan."}, {"en": "Use at least two types of models (physical, mathematical, conceptual) to explain a phenomenon an state one strength and one weakness of each.", "vi": "Sử dụng ít nhất hai loại mô hình (vật lý, toán học, khái niệm) để giải thích một hiện tượng và nêu một ưu điểm, một hạn chế của từng mô hình."}, {"en": "Explain a phenomena using multiple models, compare them on accuracy, scope, and assumptions and justify which model is the most suitable for the research question.", "vi": "Giải thích một hiện tượng bằng nhiều mô hình, so sánh chúng về độ chính xách, phạm vi áp dụng và giả định, và lập luận mô hình nào phù hợp nhất với câu hỏi nghiên cứu."}, {"en": "Select or develop models for different aspects of a complex phenomenon, evaluate how well each fits the data or the literature, and explain how combining them improves prediction or problem solving.", "vi": "Lựa chọn hoặc xây dựng mô hình cho từng khía cạnh của một hiện tượng phức tạp, đánh giá mức độ phù hợp của mỗi mô hình với dữ liệu hoặc tài liệu, và giải thích việc kết hợp chúng giúp cải thiện khả năng dự đoán hoặc giải quyết vấn đề như thế nào."}]}, {"code": "B3", "name": {"en": "Discussing the limitations and precision of a model and suggest ways in which the model might be improved to better fit available evidence", "vi": "Thảo luận về hạn chế và độ chính xác của các mô hình, đề xuất cách cải thiện mô hình phù hợp với minh chứng hiện tại"}, "tiers": [{"en": "Identify one way in which a model differs from the real object or system (e.g., size, missing parts, materials).", "vi": "Chỉ ra một điểm khác biệt giữa mô hình và vật thể hoặc hệ thống thực (ví dụ: kích thước, bộ phận bị thiếu, vật liệu)."}, {"en": "Identify specific limitations of a model, such as scale, missing details, or suimplifying assumptions, and explain how each affects what the model can show.", "vi": "Xác định giới hạn cụ thể của mô hình, như tỉ lệ, chi tiết bị thiếu hoặc giả định đơn giản, và giải thích mỗi giới hạn ảnh hưởng đến điều mô hình có thể thể hiện."}, {"en": "Identify where a model's predictions differ from the data and explain how changing an assumption or parameter would improve its accuracy.", "vi": "Xác định chỗ dự đoán của mô hình khác với dữ liệu và giải thích việc thay đổi một giả định hoặc tham số sẽ cải thiện độ chính xác của mô hình như thế nào.."}, {"en": "Identify the assumptions underlying a model, and propose specific, evidence-based improvements.", "vi": "Xác định các giả định của mô hình và đề xuất cải tiến dựa trên bằng chứng."}, {"en": "Assess the assumptions and range of validity of a complex model (the conditions under which it holds), refine it using evidence, and compare it with at least one alternative modelling approach.", "vi": "Đánh giá các giả định và phạm vi hiệu lực của một mô hình phức tạp (các điều kiện mà mô hình còn đúng), tinh chỉnh mô hình dựa trên bằng chứng, và so sánh với ít nhất một cách tiếp cận mô hình hóa khác."}]}, {"code": "B4", "name": {"en": "Making and using a model to test a design, or aspects of a design, and to compare the effectiveness of different design solutions", "vi": "Tạo và sử dụng các mô hình để kiểm nghiệm một thiết kế hoặc các khía cạnh của thiết kế, và so sánh hiệu quả của các giải pháp thiết kế khác nhau"}, "tiers": [{"en": "Build and test a simple model or prototype with teacher guidance and describe what worked or what did not.", "vi": "Chế tạo và thử nghiệm mô hình hoặc nguyên mẫu đơn giản với sự hướng dẫn của giáo viên, mô tả điều kiện hiệu quả và điều gì chưa."}, {"en": "Build and test models of two or more design solutions, compare them against given criteria, and use the results to improve the design.", "vi": "Chế tạo và thử nghiệm các mô hình của hai hay nhiều giải pháp thiết kế, so sánh chúng theo các tiêu chí cho trước và dùng kết quả để cải tiến thiết kế."}, {"en": "Use a model (e.g., scale model, simulation, calculation) to predict how several design solutions will perform against self-defined criteria and constraints, then test them and justify the best solution with evidence.", "vi": "Sử dụng một mô hình (ví dụ: mô hình tỉ lệ, mô phỏng, tính toán) để dự đoán hiệu quả của nhiều giải pháp thiết kế theo tiêu chí và ràng buộc tự xác định, sau đó thử nghiệm và lập luận chọn giải pháp tốt nhất bằng bằng chứng."}, {"en": "Refine a model or prototype through repeated test-and-improve cycles, using data to decide on trade-offs between criteria, and document each version.", "vi": "Cải tiến mô hình hoặc nguyên mẫu qua nhiều vòng thử nghiệm - cải tiến, dùng dữ liệu để quyết định sự đánh đổi giữa các tiêu chí, và ghi lại từng phiên bản."}, {"en": "Develop a model of a complex design that predicts its performance under different conditions, validate the model against test data, and compare competing solutions on theoretical and practical criteria (including cost, safety, and environmental impact).", "vi": "Xây dựng mô hình của một thiết kế phức tạp có khả năng dự đoán hiệu năng trong các điều kiện khác nhau, kiểm định mô hình bằng dữ liệu thử nghiệm, và so sánh các giải pháp cạnh tranh theo tiêu chí lý thuyết và thực tiễn (bao gồm chi phí, an toàn và tác động môi trường)."}]}]}, {"code": "C", "title": {"en": "Planning and carrying out investigations", "vi": "Lập kế hoạch và tiến hành nghiên cứu"}, "def": [{"en": "A practice is to plan and carry out investigations in the field or laboratory, working collaboratively as well as individually. Their investigations are systematic and require clarifying what counts as data and identifying variable or parameters.", "vi": "Kỹ thuật thực hành này là việc lập kế hoạch và tiến hành nghiên cứu tại hiện trường hoặc phòng thí nghiệm, làm việc hợp tác cũng như cá nhân. Các nghiên cứu này cần có hệ thống và yêu cầu xác định rõ cái gì được tính là dữ liệu, cũng như nhận diện biến số hoặc tham số."}], "skills": [{"code": "C1", "name": {"en": "Formulating a hypothesis (that is, a possible explanation that predicts a particular and stable outcome) based on a model or theory", "vi": "Xây dựng giả thuyết (một lời giải thích có thể dự đoán kết quả nhất định và ổn định) dựa trên mô hình hoặc lý thuyết"}, "tiers": [{"en": "Formulate a testable prediction (\"If... then...\")based on observations and prior knowledge.", "vi": "Xây dựng một giả thuyết có thể kiểm chứng dựa trên quan sát và kiến thức sẵn có."}, {"en": "Formulate a hypothesis that links the independent and dependent variables and is supported by a scientific idea or prior evidence (e.g., \"If …, then …, because …\").", "vi": "Xây dựng giả thuyết liên kết biến độc lập với biến phụ thuộc, có cơ sở từ một ý tưởng khoa học hoặc bằng chứng trước đó (ví dụ: \"Nếu …, thì …, vì …\")."}, {"en": "Formulate a hypothesis based on a theory or model, that states the expected relationship between varibales and explains the mechanism behind it.", "vi": "Xây dựng giả thuyết dựa trên lý thuyết hoặc mô hình khoa học, nêu mối quan hệ dự kiến giữa các biến và giải thích cơ chế đằng sau nó."}, {"en": "Develop hypotheses that involve more than one variable or an interaction, are grounded in theoretical models, and state what results would refute them.", "vi": "Xây dựng các giả thuyết liên quan đến nhiều hơn một biến số hoặc một tương tác, dựa trên mô hình lý thuyết và nêu rõ kếtquả nào sẽ bác bỏ giả thuyết."}, {"en": "Formulate hypotheses that synthesize several theories or prior studies, specify the predicted direction and size or form of the effect, and identify competing hypotheses.", "vi": "Xây dựng các giả thuyết tổng hợp từ các lý thuyết hoặc nghiên cứu trước, nêu rõ chiều hướng và độ lớn hoặc dạng của tác động dự đoán, đồng thời xác định các giả thuyết cạnh tranh."}]}, {"code": "C2", "name": {"en": "Deciding what data are to be gathered, what tools are needed to do the gathering, and how measurements will be recorded", "vi": "Quyết định loại dữ liệu cần thu thập, các công cụ cần dùng và các phương pháp đo lường"}, "tiers": [{"en": "Select, from given options, the data to collect and suitable basic tool or recording format.", "vi": "Lựa chọn, từ các phương án có sẵn, các dữ liệu liên quan cần thu thập và một công cụ cơ bản hoặc mẫu ghi chép phù hợp."}, {"en": "Determine the types of data to collect (measurements, observations, or survey responses) and select tools or instruments, giving a reason for each choice.", "vi": "Xác định các loại dữ liệu cần thu thập (số đo, quan sát hoặc câu trả lời khảo sát) và lựa chọn công cụ hoặc thiết bị, nêu lý do cho mỗi lựa chọn."}, {"en": "Identify the data required to test the hypothesis and justify each tool or method by its accuracy and relevance to the research question.", "vi": "Xác định dữ liệu cần thiết để kiểm chứng giả thuyết và lập luận cho các công cụ hoặc phương pháp dựa theo độ chính xác và mức độ phù hợp với câu hỏi nghiên cứu."}, {"en": "Select the tools and methods by comparing their precision and reliability (e.g., resolution, calibration, test–retest consistency) and justify the choide for accurate recording and analysis.", "vi": "Lựa chọn công cụ và phương pháp bằng cách so sánh độ chính xác và độ tin cậy (ví dụ: độ phân giải, hiệu chuẩn, tính nhất quán khi đo lặp lại) và lập luận cho lựa chọn đó nhằm ghi nhận và phân tích chính xác."}, {"en": "Select data types, tools, and measurement methods (including validated instruments for human-participant research) that ensure accuracy, reliability, and alignment with the hypothesis, and justify each decision.", "vi": "Lựa chọn các loại dữ liệu, công cụ và phương pháp đo, đảm bảo độ tin cậy và phù hợp với giả thuyết, đồng thời lập luận cho từng quyết định."}]}, {"code": "C3", "name": {"en": "Deciding how much data are needed to produce reliable measurements and consider any limitations on the precision of the data", "vi": "Quyết định khối lượng dữ liệu cần thu thập để đảm bảo phép đo đáng tin cậy và xem xét các giới hạn về độ chính xác của dữ liệu"}, "tiers": [{"en": "Take repeated measurements or observations as instructed and notice when values vary.", "vi": "Thực hiện các phép đo hoặc quan sát lặp lại theo hướng dẫn nhận ra khi các giá trị thay đổi."}, {"en": "Record measurements or observations accurately with units, identify limitations of the measurement techniques, and note obvious sources of error.", "vi": "Ghi lại các phép đo hoặc quan sát một cách chính xác, có đơn vị, nhận diện các giới hạn của kỹ thuật đo và ghi chú các nguồn sai số rõ ràng."}, {"en": "Determine the quantity (number of trials or sample size) and quality of data needed for reliable and valid results, taking into aacount practical constraints.", "vi": "Xác định số lượng (số lần lặp hoặc kích thước mẫu) và chất lượng dữ liệu cần thiết để có kết quả tin cậy và hợp lệ, có tính đến độ chính xác và ràng buộc thực tế."}, {"en": "Justify the sample size or number of trials from the variability expected or obseeved in a pilot, and explain how precision and accuracy affect the validity and reliability of the conclusions.", "vi": "Lập luận cho kích thước mẫu hoặc số lần lặp dựa trên độ biến thiên dự kiến hoặc quan sát được trong thử nghiệm sơ bộ, và giải thích độ chụm và độ chính xác ảnh hưởng như thế nào đến tính hợp lệ và độ tin cậy của các kết luận."}, {"en": "Plan and justify sampling strategies and sample size for large or complex data sets, quantify uncertainty, and evaluate potential biases to strengthen the validity of findings.", "vi": "Lập kế hoạch và lập luận cho chiến lược chọn mẫu và kích thước mẫu đối với các tập dữ liệu lớn hoặc phức tạp, định lượng độ không đảm bảo và đánh giá các thiên lệch tiềm ẩn để củng cố tính hợp lệ của kết quả."}]}, {"code": "C4", "name": {"en": "Planning experimental or field-research procedures, identifying relevant independent, dependent, and control variables", "vi": "Lập kế hoạch thực hiện các thí nghiệm hoặc nghiên cứu hiện trường, xác định các biến độc lập, phụ thuộc và biến kiểm soát"}, "tiers": [{"en": "Follow a given procedure for a fair test, stating what is changed, what is measured, and what is kept the same, and follow safety instructions.", "vi": "Thực hiện theo quy trình cho sẵn của một thí nghiệm công bằng, nêu rõ yếu tố được thay đổi, yếu tố được đo và các yếu tố được giữ nguyên, đồng thời tuân thủ hướng dẫn an toàn."}, {"en": "Identify independent, dependent, and control variables (or, surveys and observations, the factors and participants to be studied), write a step-by-step procedure, and complete a risk assessment with teacher's guidance.", "vi": "Xác định được các biến độc lập, biến phụ thuộc và biến kiểm soát (hoặc, với khảo sát và quan sát, các yếu tố và đối tượng tham gia cần nghiên cứu), viết quy trình từng bước và hoàn thành đánh giá rủi ro với dự hướng dẫn của giáo viên."}, {"en": "Design detailed research plans that account for controlled, independent, and dependent variables, ensuring replicability through comprehensive documentation of procedures. Include safety measures and, where people or living organisms are involved, informed consent and ethical safeguards.", "vi": "Thiết kế các kế hoạch nghiên cứu chi tiết, xác định rõ các biến kiểm soát, độc lập, phụ thuộc và đảm bảo khả năng lặp lại thí nghiệm thông qua việc ghi chép cụ thể các quá trình thực hiện thí nghiệm. Bao gồm các biện pháp an toàn và, khi có con người hoặc sinh vật sống tham gia, sự đồng thuận có hiểu biết và các biện pháp bảo vệ về đạo đức."}, {"en": "Design experimental, quasi-experimental, correlational, or field studies appropriate to the questions, clearly identifying variables or factors, with fully documented procedures, a risks assessment, and required ethics approval.", "vi": "Thiết kế nghiên cứu thực nghiệm, bán thực nghiệm, tương quan hoặc thực đại phù hợp với câu hỏi, xác định rõ các biến hoặc yếu tố, với quy trình được ghi chép đầy đủ, đánh giá rủi ro và phê duyệt đạo đức cần thiết."}, {"en": "Design and execute multi-stage or multi-variable investigtions with reproducible procedures and a pre-specified analysis plan, in full compliance with safety and ethics requirements, adapting protocols only with documented justification.", "vi": "Thiết kế và thực hiện các nghiên cứu nhiều giai đoạn hoặc nhiều biến với quy trình có thể lặp lại và kế hoạch phân tích được xác định trước, tuân thủ đầy đủ các yêu cầu an toàn và đạo đức, chỉ điều chỉnh quy trình khi có lý do được ghi chép."}]}, {"code": "C5", "name": {"en": "Considering possible confounding variables or effects and ensure that the investigation’s design has controlled for them", "vi": "Xem xét các biến gây nhiễu hoặc có ảnh hưởng và đảm bảo thiết kế nghiên cứu đã kiểm soát chúng"}, "tiers": [{"en": "Name factors, other than the one being changed, that could affect the result.", "vi": "Kể tên các yếu tố, ngoài yếu tố đang được thay đổi, có thể ảnh hưởng đến kết quả.."}, {"en": "Recognize factors other than the independent variable that could affect the results and identifiy which of them must be kept the same as controlled variable.", "vi": "Nhận diện các yếu tố ngoài biến độc lập có thể ảnh hưởng đến kết quả và xác định những yếu tố cần giữ nguyên làm biến kiểm soát."}, {"en": "List potential confounding variables, predict their direction of their effect on the results, and include a specific control or mitigation for each in the plan.", "vi": "Liệt kê các biến gây nhiễu tiềm ẩn, dự đoán chiều hướng ảnh hưởng của chúng đến kết quả và đưa vào kế hoạch một biện pháp kiểm soát hoặc giảm thiểu cụ thể cho từng biến ."}, {"en": "Analyze how confounding variables could bias the results, apply appropriate design controls (e.g., matching, counterbalancing, random assignment), and check after data collection whether the controls worked.", "vi": "Phân tích cách các biến gây nhiễu có thể làm sai lệch kết quả, áp dụng biện pháp kiểm soát phù hợp trong thiết kế (ví dụ: ghép cặp, đối trọng thứ tự, phân nhóm ngẫu nhiên), và kiểm tra sau khi thu thập dữ liệu xem các biện pháp đó có hiệu quả hay không."}, {"en": "Anticipate subtle or interacting confounders and biases (e.g., selection, observer, or response bias) and apply rigorous controls such as randomization, blinding, or statistical adjustment.", "vi": "Dự đoán các biến gây nhiễu và thiên lệch khó nhận biết hoặc tương tác với nhau (ví dụ: thiên lệch chọn mẫu, thiên lệch người quan sát, thiên lệch trả lời) và áp dụng các biện pháp kiểm soát chặt chẽ như ngẫu nhiên hóa, làm mù hoặc hiệu chỉnh thống kê."}]}]}, {"code": "D", "title": {"en": "Analyzing and interpreting data", "vi": "Phân tích và diễn giải dữ liệu"}, "def": [{"en": "A practice is to apply quantitative methods for collecting data and to conduct multiple trials of qualitative observations in order to identify significant features and patterns in the data, determine sources of error, and calculate the degree of certainty.", "vi": "Kỹ thuật thực hành này là việc áp dụng các phương pháp định lượng để thu thập dữ liệu và tiến hành nhiều lần quan sát định tính nhằm xác định các đặc điểm và quy luật của dữ liệu, nhận diện các nguồn sai số tiềm ẩn, và tính toán mức độ tin cậy."}], "skills": [{"code": "D1", "name": {"en": "Analyzing data systematically", "vi": "Phân tích dữ liệu một cách có hệ thống"}, "tiers": [{"en": "Organize data in simple tables and charts and describe what they show.", "vi": "Sắp xếp dữ liệu vào bảng và biểu đồ đơn giản và mô tả những gì chúng thể hiện."}, {"en": "Organize data in tables and graphs and use simple calculations (e.g., means, percentages, differences) to describe patterns and trends with specific values.", "vi": "Sắp xếp dữ liệu vào bảng và đồ thị, dùng các phép tính đơn giản (ví dụ: trung bình, phần trăm, hiệu số) để mô tả quy luật và xu hướng bằng các giá trị cụ thể."}, {"en": "Systematically analyze data using graph, descriptive statistics (e.g. mean, median, range), and computational tools to identify trends and relationships; for qualitative data, sort responses into categories.", "vi": "Phân tích dữ liệu một cách hệ thống bằng biểu diễn đồ thị, thống kê mô tả (ví dụ: trung bình, trung vị, khoảng biến thiên), và công cụ tính toán để tìm ra các xu hướng và các mối quan hệ; với dữ liệu định tính, phân loại câu trả lời thành các nhóm."}, {"en": "Analyze data using measures of variability and uncertainty and appropriate inferential or relational techniques (e.g., t-test, chi-square, correlation/regression) or systematic qualitative coding.", "vi": "Phân tích dữ liệu bằng các đại lượng về độ biến thiên và độ không đảm bảo cùng các kỹ thuật suy luận hoặc tương quan phù hợp (ví dụ: kiểm định t, chi bình phương, tương quan/hồi quy) hoặc mã hóa định tính có hệ thống."}, {"en": "Apply and justify multivariable or model-based analyses to explore patterns, relationships, and anomalies, checking the assumptions of the methods used.", "vi": "Áp dụng và lập luận cho các phân tích đa biến hoặc dựa trên mô hình để khám phá các quy luật, các mối quan hệ và các điểm bất thường, kiểm tra các giả định của phương pháp được sử dụng."}]}, {"code": "D2", "name": {"en": "Recognizing when data are in conflict with expectations and consider what revisions in the initial model are needed", "vi": "Nhận diện khi dữ liệu mâu thuẫn với dự đoán và xem xét điều chỉnh mô hình ban đầu"}, "tiers": [{"en": "Notice when results differ from the prediction and suggest a simple reason.", "vi": "Nhận ra khi kết quả khác với dự đoán và đưa ra một lý do đơn giản."}, {"en": "Identify where the data differ from the prediction, suggest possible cuase (e.g., measurement error, an uncontrolled factor, and incorrect preidction), and choose the most likely one with a reason.", "vi": "Xác định chỗ dữ liệu khác với dự đoán, đề xuất các nguyên nhân có thể (ví dụ: sai số đo, yếu tố chưa được kiểm soát, dự đoán chưa đúng) và chọn nguyên nhân hợp lý nhất kèm lý do."}, {"en": "Explain discrepancies between the data and the model or hypothesis, decide wheter they arise from the investigation or from the model propose a specific revision to the model.", "vi": "Giải thích sự khác biệt giữa dữ liệu và mô hình hoặc giả thuyết, xác định sự khác biệt đến từ quá trình nghiên cứu hay từ mô hình, và đề xuất điều chỉnh cụ thể cho mô hình."}, {"en": "Evaluate conflicting data (within their own data set, or between their data and published findings) by checking possible sources of error and design flaws, and propose and justify revisions to the model or the experimental design.", "vi": "Đánh giá các dữ liệu mâu thuẫn (trong bộ dữ liệu của bản thân, hoặc giữa dữ liệu của bản thân và kết quả đã công bố) bằng cách kiểm tra các nguồn sai số và lỗi thiết kế có thể có, đồng thời đề xuất và lập luận cho việc điều chỉnh mô hình hoặc thiết kế thí nghiệm."}, {"en": "Investigate data conflicts through additional analyses or targeted follow-up tests, revise the model or approach accordingly, and report how the revision changes the conclusions.", "vi": "Điều tra các mâu thuẫn trong dữ liệu bằng phân tích bổ sung hoặc kiểm nghiệm tiếp theo có chủ đích, điều chỉnh mô hình hoặc phương pháp tương ứng, và báo cáo việc điều chỉnh đó làm thay đổi kết luận như thế nào."}]}, {"code": "D3", "name": {"en": "Using computational tools to collate, summarize, and display data and to explore relationships between variables", "vi": "Sử dụng các công cụ tính toán để tổng hợp, tóm tắt, hiển thị dữ liệu và khám phá mối quan hệ giữa các biến số"}, "tiers": [{"en": "Enter data into a spreadsheet and create a simple chart with teacher guidance.", "vi": "Nhập dữ liệu vào bảng tính và tạo biểu đồ đơn giản với sự hướng dẫn của giáo viên."}, {"en": "Use spreadsheets or graphing software independetly to organize, visualize, and calculate simple statistics.", "vi": "Sử dụng bảng tính hoặc phần mềm vẽ đồ thị một cách độc lập để tổ chức, trực quan hóa và tính các thống kê đơn giản."}, {"en": "Employ computational tools to combine data sets, create multiple-variable displays, and explore relationships between variables.", "vi": "Sử dụng các công cụ tính toán để kết hợp các bộ dữ liệu, tạo các biểu diễn nhiều biến và khám phá các mối quan hệ giữa các biến số."}, {"en": "Employ statistical specialized software (e.g., JASP, jamovi, spreadsheet analysis tools) to analyze data and explore variable relationships, documenting the steps so that the analysis can be repeated.", "vi": "Sử dụng phần mềm thống kê hoặc các công cụ chuyên dụng (ví dụ: JASP, jamovi, công cụ phân tích của bảng tính) để phân tích dữ liệu và khám phá mối quan hệ giữa các biến, ghi lại các bước để có thể lặp lại phân tích."}, {"en": "Use computational tools (e.g., scripting or statistical software) to automate analyses and model relationships between multiple variables.", "vi": "Sử dụng các công cụ tính toán (ví dụ: lập trình hoặc phần mềm thống kê) để tự động hóa phân tích và mô hình hóa mối quan hệ giữa nhiều biến số."}]}, {"code": "D4", "name": {"en": "Evaluating the strength of a conclusion that can be inferred from any data set, using appropriate grade-level mathematical and statistical techniques", "vi": "Đánh giá độ thuyết phục của kết luận rút ra từ bất kỳ tập dữ liệu nào bằng kỹ thuật toán học và thống kê phù hợp với trình độ"}, "tiers": [{"en": "State a conclusion that answers the question and point to the data that support it.", "vi": "Nêu một kết luận trả lời câu hỏi và chỉ ra dữ liệu ủng hộ kết luận đó."}, {"en": "State a conclusion that answers the question, support it with specific data values, and say whether the data support or contradict the prediction.", "vi": "Nêu kết luận trả lời câu hỏi, dẫn chứng bằng các giá trị dữ liệu cụ thể và cho biết dữ liệu ủng hộ hay mâu thuẫn với dự đoán."}, {"en": "Assess the validity and reliability of a conclusion using descriptive statistics (e.g., spread of repeated measurements, consistency across trials) and state at least one limitation and one alternative interpretation.", "vi": "Đánh giá tính hợp lệ và độ tin cậy của các kết luận bằng thống kê mô tả (ví dụ: độ phân tán của các lần đo lặp, tính nhất quán giữa các lần thử) và nêu ít nhất một hạn chế và một diễn giải thay thế."}, {"en": "Evaluate conclusions using inferential statistics and effect sizes, distinguishing correlation from causation and stating the uncertainty.", "vi": "Đánh giá các kết luận bằng thống kê suy luận và độ lớn hiệu ứng, phân biệt tương quan với nhân quả và nêu rõ độ không đảm bảo."}, {"en": "Evaluate the strength of conclusions using multiple analyses, sensitivity checks, or comparison with published findings, and state the limits of generalization.", "vi": "Đánh giá mức độ thuyết phục của kết luận bằng nhiều phân tích, kiểm tra độ nhạy hoặc so sánh với các kết quả đã công bố, và nêu rõ giới hạn của việc khái quát hóa."}]}, {"code": "D5", "name": {"en": "Recognizing patterns in data that suggest relationships worth investigating further", "vi": "Nhận diện các quy luật trong bộ dữ liệu từ đó đề xuất mối quan hệ tiềm năng giữa các biến để mở rộng nghiên cứu"}, "tiers": [{"en": "Describe a simple pattern in data (increases, decreases, no change) and suggest what could be tested next.", "vi": "Mô tả một quy luật đơn giản trong dữ liệu (tăng, giảm, không đổi) và gợi ý điều có thể kiểm chứng tiếp theo."}, {"en": "Use observed patterns to make prediction for a new condition or to propose a new hypothesis or question for further investigations.", "vi": "Dùng các quy luật đã quan sát để đưa ra dự đoán cho điều kiện mới hoặc đề xuất giả thuyết hay câu hỏi mới ch nghiên cứu tiếp theo."}, {"en": "Identify significant patterns in data, hypothesize potential relationships, and propose directions for further investigation.", "vi": "Xác định các quy luật quan trọng trong dữ liệu, đưa ra các giả thuyết về mối quan hệ và đề xuất hướng nghiên cứu Tiếp theo."}, {"en": "Identify patterns such as interactions, non-linear trends, or differences between subgroups that suggest an underlying relationship, and formulate a testable hypothesis for a follow-up study.", "vi": "Nhận diện các quy luật như tương tác giữa các biến, xu hướng phi tuyến hoặc khác biệt giữa các nhóm con gợi ý một mối quan hệ tiềm ẩn, và xây dựng giả thuyết có thể kiểm chứng cho một nghiên cứu tiếp theo."}, {"en": "Distinguish patterns that are likely to be real from those that may be artifacts of chance, bias, or cofounding, and propose a follow-up study whose design can test them.", "vi": "Phân biệt các quy luật nhiều khả năng có thật với những quy luật có thể do ngẫu nhiên, thiên lệch hoặc biến gây nhiễu tạo ra, và đề xuất một nghiên cứu tiếp theo có thiết kế đủ để kiểm chứng chúng."}]}]}, {"code": "E", "title": {"en": "Constructing evidence-based explanations", "vi": "Xây dựng giải thích dựa trên bằng chứng"}, "def": [{"en": "A practice is to construct theories that provide explanatory accounts of features of the world, demonstrating superiority over other explanations in terms of breadth of phenomena covered, coherence, and parsimony. Scientific explanations are explicit applications of theory to specific situations or phenomena, possibly through a theory-based model of the system under study. The goal is to develop logically coherent explanations that incorporate current scientific understanding, or a model representing it, and are consistent with available evidence.", "vi": "Kỹ thuật thực hành này là việc xây dựng các lý thuyết có thể giải thích cho các đặc điểm của thế giới, thể hiện sự vượt trội so với các lời giải thích khác về phạm vi hiện tượng được giải thích, tính gắn kết và tính đơn giản trong lập luận. Giải thích khoa học là sự áp dụng rõ ràng của lý thuyết vào một tình huống hoặc hiện tượng cụ thể, có thể thông qua mô hình lý thuyết của hệ thống đang được nghiên cứu. Mục tiêu là phát triển các giải thích logic, gắn kết, phản ánh đúng hiểu biết khoa học hiện tại hoặc mô hình đại diện cho hiểu biết đó, và phù hợp với bằng chứng hiện có."}], "skills": [{"code": "E1", "name": {"en": "Constructing their own explanations of phenomena using their knowledge of accepted scientific theory and linking it to models and evidence.", "vi": "Xây dựng các lý giải hiện tượng dựa trên lý thuyết khoa học đã được chấp nhận, liên kết với các mô hình và bằng chứng"}, "tiers": [{"en": "Explain an observation in one or two sentences using classroom knowledge.", "vi": "Lý giải một hiện tượng quan sát bằng một hoặc hai câu sử dụng kiến thức trong phạm vi lớp học."}, {"en": "Explain a result using a named scientific concepts and a model or diagram, showing how the concept links to what was observed.", "vi": "Giải thích một kết quả bằng một khái niệm và mô hình khoa học hoặc sơ đồ, chỉ ra khái niệm đó liên hệ với điều quan sát được như thế nào."}, {"en": "Explain a phenomena linking it to a scientific theory or model and showinghow the models accounts for the data collected.", "vi": "Giải thích hiện tượng bằng cách liên hệ với lý thuyết hoặc mô hình khoa học và chỉ ra mô hình đó lý giải dữ liệu thu được như thế nào."}, {"en": "Construct a claim-evidence-reasoning explanation that connects the findings to a model, or theory, and addresses at least one result the explanation does not fullt account for.", "vi": "Xây dựng lời giải thích theo cấu trúc luận điể,-bằng chứng-lập luận, gắn kết quả với mô hình hoặc lý thuyết, giải thích cơ chế nền tảng và xử lý ít nhất một kết quả mà lời giải thích chưa lý giải trọn vẹn."}, {"en": "Construct an explanation that integrates theory, their own evidence, and published findings, compares it with at least one competing explanation, and states the conditions under which it holds.", "vi": "Xây dựng lời giải thích thích hợp lý thuyết, bằng chứng của bản thân và kết quả đã công bố, so sánh với ít nhất một lời giải thích cạnh tranh và nêu rõ các điều kiện mà lời giải thích còn đúng."}]}, {"code": "E2", "name": {"en": "Using primary or secondary scientific evidence and models to support or refute an explanatory account of a phenomenon.", "vi": "Sử dụng bằng chứng khoa học sơ cấp hoặc thứ cấp và mô hình để ủng hộ hoặc bác bỏ lời giải thích về hiện tượng"}, "tiers": [{"en": "Point to an obsevation or measurement from classroom experiments that supports an explaination.", "vi": "Chỉ ra một quan sát hoặc đo lường từ thí nghiệm trên lớp học ủng hộ cho một lời giải thích."}, {"en": "Support an explanation with at least two specific pieces of evidence (data values or observations) from their own investigation.", "vi": "Hỗ trợ lời giải thích bằng ít nhất hai bằng chứng cụ thể (giá trị số liệu hoặc quan sát) từ nghiên cứu của bản thân."}, {"en": "Use a models and evidence from more than one source (e.g., own data and published source) to support or refute an explanation, stating which evidence fits and which does not.", "vi": "Sử dụng mô hình và bằng chứng từ nhiều hơn một nguồn (ví dụ: dữ liệu của bản thân hoặc nguồn đã công bố) để ủng hộ hoặc bác bỏ giải thích, nêu rõ bằng chứng nào phù hợp và bằng chứng nào không."}, {"en": "Evaluate how strongly the evidence support or challenge an explanation, taking into account data quality, uncertainty, and the limitations of the model.", "vi": "Đánh giá mức độ bằng chứng ủng hộ hoặc thách thức lời giải thích, có tính đến chất lượng dữ liệuđộ không đảm bảo và các giới hạn của mô hình."}, {"en": "Build an argument that weights all relevant evidence, including conflicting evidence and evidence from the literature, and justifies why one explanation is better supported than its alternatives.", "vi": "Xây dựng lập luận cân nhắc toàn bộ bằng chứng liên quan, kể cả bằng chứng mâu thuẫn và bằng chứng từ tài liệu, và lý giải vì sao một lời giải thích được ủng hộ tốt hơn các lời giải thích thay thế."}]}, {"code": "E3", "name": {"en": "Offerring causal explanations appropriate to their level of scientific knowledge.", "vi": "Đưa ra lý giải nhân quả phù hợp với trình độ kiến thức khoa học"}, "tiers": [{"en": "Give a simple cause-effect statement (\"X happens because Y\") for an observed event.", "vi": "Đưa ra một câu nguyên nhân – kết quả đơn giản (\"X xảy ra vì Y\") cho các một hiện tượng quan sát được."}, {"en": "Explain how a cause leads to an effect through at least one intermediate step, using a scientific concept.", "vi": "Giải thích nguyên nhân dẫn đến kết quả qua ít nhất một bước trung gian, sử dụng ít nhất một khái niệm khoa học."}, {"en": "Describe the causal mechanism linking variables, using a models and evidence, and distinguish the cause from factors that merely occur together with the effect.", "vi": "Mô tả cơ chế nguyên nhân - kết quả liên kết các biến, sử dụng mô hình và bằng chứng, và phân biệt nguyên nhân với các yếu tố chỉ xuất hiện cùng lúc với kết quả."}, {"en": "Explain how several factors jointly produce an effect, including the direction and approximate size of each influence, and state whether the evidence supports a causal or only a correlational claim.", "vi": "Giải thích nhiều yếu tố cùng tạo ra một kết quả như thế nào, nêu chiều hướng và độ lớn tương đối của từng ảnh hưởng, và xác định bằng chứng ủng hộ kết luận nhân quả hay chỉ là tương quan.."}, {"en": "Explain effects that involve interacting factors, feedback, or limiting conditions, supported by evidence and theory, and identify which parts of the causal account remain untested.", "vi": "Giải thích các kết quả có sự tương tác giữa các yếu tố, cơ chế phản hồi hoặc điều kiện giới hạn, dựa trên bằng chứng và lý thuyết, và chỉ ra phần nào của chuỗi nhân quả chưa được kiểm chứng."}]}, {"code": "E4", "name": {"en": "Identifying gaps or weaknesses in explanatory accounts (their own or those of others).", "vi": "Nhận diện khoảng trống hoặc điểm yếu trong lời giải thích (của bản thân hoặc của người khác)"}, "tiers": [{"en": "With teacher prompts, say what an explanation leaves out or what evidence is missing.", "vi": "Với gợi ý của giáo viên, nêu được lời giải thích còn bỏ sót điều gì hoặc còn thiếu bằng chứng nào."}, {"en": "Point out a specific weakness in their own or a classmate's explanation (e.g., a claim without evidence) and suggest how to fix it.", "vi": "Chỉ ra một điểm yếu cụ thể trong lời giải thích của bản thân hoặc bạn học (ví dụ: luận điểm không có bằng chứng) và đề xuất cách khắc phục."}, {"en": "Identify gap in their own explanation, such as untested assumptions or results it can not explain, and propose what further evidence would address them.", "vi": "Xác định các khoảng trống trong lời giải thích của bản thân, như giả định chưa được kiểm chứng hoặc kết quả chưa được lý giải."}, {"en": "Evaluate the validity of explanations (their own and others') by testing them against the evidence and alternative explanations, and revise their own explanation in response.", "vi": "Đánh giá tính hợp lệ của các lời giải thích (của bản thân và của người khác) bằng cách đối chiếu với bằng chứng và các lời giải thích thay thế, và điều chỉnh lời giải thích của bản thân tương ứng."}, {"en": "Give written critical feedback on other's explanations or research (e.g., structured peer review) that identifying significant weaknesses in reasoning or evidence and proposes specific remiedies, and respond to such critique of their own work.", "vi": "Đưa ra nhận xét pphản biện bằng văn bản về lời giải thích hoặc nghiên cứu của người khác (ví dụ: phản biện đồng cấp có cấu trúc), chỉ ra các điểm yếu quan trọng trong lập luận hoặc bằng chứng và đề xuất cách khắc phục cụ thể, đồng thời phản hồi các phản biện đối với công trình của bản thân."}]}]}, {"code": "F", "title": {"en": "Obtaining, evaluating, and communicating information", "vi": "Thu thập, đánh giá và truyền đạt thông tin"}, "def": [{"en": "A practice is to communicate scientific ideas and research findings orally and in writing, using tables, diagrams, graphs, and equations, and by engaging in extended discussions with scientific peers. It also requires the ability to extract meaning from scientific texts (including papers, online resources, symposia, and lectures), evaluate the scientific validity of the acquired information, and integrate it effectively.", "vi": "Kỹ thuật thực hành này là việc truyền đạt ý tưởng khoa học và kết quả nghiên cứu bằng các hình thức nói và viết, sử dụng bảng, sơ đồ, biểu đồ, phương trình, và tham gia thảo luận mở rộng với đồng nghiệp khoa học. Kỹ thuật này cũng đòi hỏi khả năng rút ra ý nghĩa từ các văn bản khoa học (bao gồm bài báo, nguồn trực tuyến, hội nghị và bài giảng), đánh giá tính hợp lệ và khoa học của thông tin thu nhận được, và tích hợp thông tin đó một cách hiệu quả."}], "skills": [{"code": "F1", "name": {"en": "Using words, tables, diagrams, and graphs as well as mathematical expressions, to communicate their understanding or to ask questions about a system under study", "vi": "Sử dụng chữ viết, bảng, sơ đồ, biểu đồ cũng như biểu thức toán học để truyền đạt hiểu biết hoặc đặt câu hỏi về hệ thống được nghiên cứu"}, "tiers": [{"en": "Present findings using simple tables, diagrams, and a few sentences, with a title and labels.", "vi": "Trình bày các phát hiện bằng bảng biểu, sơ đồ và vài câu mô tả, có tiêu đề và nhãn."}, {"en": "Choose suitable table or graph type for the data (e.g., bar or line graph), with labeled axes and units, and describe in words what it shows about the system.", "vi": "Chọn loại bảng hoặc biểu đồ phù hợp với dữ liệu (ví dụ: biểu đồ cột hoặc đồ thị đường), có trục được ghi nhãn và đơn vị, và mô tả bằng lời điều mà bảng hoặc đồ thị cho thấy về hệ thống."}, {"en": "Incorporate words, tables, graphs, diagrams, and simple mathematical expressions (e.g., mean, rate or proportion) so that each representation supports the explanation, with captions starting with each one shows.", "vi": "Kết hợp lời văn, bảng, đồ thị, sơ đồ và biểu thức toán học đơn giản (ví dụ: giá trị trung bình, tốc độ, tỉ lệ) sao cho mỗi hình thức biểu diễn đều hỗ trợ lời giải thích, kèm chú thích nêu rõ nội dung của từng hình thức."}, {"en": "Present quantitative results with appropriate representations of variability and uncertainty (e.g., error bars, confidence intervals, statistical results in standard format) and integrate them with text and diagrams of the system.", "vi": "Trình bày kết quả định lượng với hình thức biểu diễn phù hợp cho độ biến thiên và độ không đảm bảo (ví dụ: thanh sai số, khoảng tin cậy, kết quả thống kê theo định dạng chuẩn) và tích hợp chúng với lời văn và sơ đồ của hệ thống."}, {"en": "Select and design representations (including equations, model outputs or multi-panel figures) to the conventions of the field, so that an expert reader can check the main claims directly from the figures and tables.", "vi": "Lựa chọn và thiết kế các hình thức biểu diễn (bao gồm phương trình, kết quả mô hình hoặc hình nhiều phần) theo quy ước của lĩnh vực, sao cho người đọc chuyên môn có thể kiểm tra các luận điểm chính trực tiếp từ hình và bảng."}]}, {"code": "F2", "name": {"en": "Reading scientific text, including tables, diagrams, and graphs, commensurate with their scientific knowledge and explain the key ideas being communicated.", "vi": "Đọc văn bản khoa học, bao gồm bảng, sơ đồ và biểu đồ, phù hợp với trình độ kiến thức khoa học và giải thích các ý chính đang được thảo luận"}, "tiers": [{"en": "Read a short scientific text, table or diagram and state its main idea or a specific part from it.", "vi": "Diễn giải văn bản khoa học đơn giản và bảng hoặc sơ đồ cơ bản."}, {"en": "Summarize the key ideas of a scientific text, including what its tables or graphs show, and describe evidence given from the main claim.", "vi": "Tóm tắt các ý chính của một văn bản khoa học bao gồm nội dung mà bảng hoặc đồ thị trong đó thể hiện, và mô tả bằng chứng được đưa ra cho luận điểm chính."}, {"en": "Explain the key concepts in scientific texts and how its diagrams, graphs or tables supports its conclusions.", "vi": "Giải thích các khái niệm chính trong văn bản khoa học và cách sơ đồ, đồ thị hoặc bảng của nó hỗ trợ cho kết luận."}, {"en": "Read primary research articles (full or adapted) and exlain the research question, method, main results and conclusions, including statistical results reported in figures and tables.", "vi": "Đọc bài báo nghiên cứu gốc (nguyên bản hoặc đã biên soạn lại) và giải thích được câu nghiên cứu, phương pháp, kết quả chính và kết luận, bao gồm cả các kêtq quả thống kê trình bàu trong hình và bảng."}, {"en": "Read research articles in their field without adaptation, interpret complex figures and statistical results (e.g., effect sizes, confidence intervals, model outputs), and synthesize the findings of several studies.", "vi": "Đọc bài báo nghiên cứu trong lĩnh vực của mình ở dạng nguyên bản, diễn giải các hình phức tạp và kết quả thống kê (ví dụ: kích thước hiệu ứng, khoảng tin cậy, kết quả mô hình), và tổng hợp kết quả của nhiều nghiên cứu."}]}, {"code": "F3", "name": {"en": "Recognizing the major features of scientific writing and speaking and be able to produce written and illustrated text or oral presentations that communicate their own ideas and accomplishments.", "vi": "Nhận diện các đặc điểm chính của văn bản và trình bày khoa học, đồng thời tạo sản phẩm văn bản minh họa hoặc bài trình bày truyền đạt ý tưởng và kết quả của mình"}, "tiers": [{"en": "Present simple findings orally or on a poster using a given template (question, what we did, what we found).", "vi": "Trình bày kết quả đơn giản bằng lời hoặc trên poster theo khung mẫu cho sẵn (câu hỏi, những việc đã làm, những điều tìm được)."}, {"en": "Write a short report or give a presentation that includes the main sections of scientific reporting (question, method, results, conclusion), with correct units and labeled figures.", "vi": "Viết một báo cáo ngắn hoặc thuyết trình có đủ các phần chính của báo cáo khoa học (câu hỏi, phương pháp, kết quả, kết luận), dùng đúng đơn vị và có hình được ghi nhãn.."}, {"en": "Produce a structured report and an oral presentation that follow scientific conventions: separate sections, figure and table captions, and in-text citations with a reference list in a set style.", "vi": "Soạn báo cáo có cấu trúc và trình bày theo quy ước khoa học: các phần tách biệt, chú thích hình và bảng, trích dẫn trong bài và danh mục tài liệu tham khảo theo một chuẩn trích dẫn thống nhất."}, {"en": "Produce a full research report in a standard format in which every claim is supported by evidence or a citation, and defend it orally, asnwering questions with evidence.", "vi": "Trình bày báo cáo nghiên cứu hoàn chỉnh theo định dạng chuẩn, trong đó mọi luận điểm đều có bằng chứng hoặc trích dẫn, và bỏa vệ báo cáo bằng lời, trả lời câu hỏi bằng bằng chứng."}, {"en": "Produce a research paper that meets the author guidelines of a chosen journal or competition, revise it in response to reviewer feedback, and adapt the presentation of the findings for expert and non-expert audiences.", "vi": "Soạn báo cáo nghiên cứu đáp ứng hướng dẫn tác giả của một tạp chí hoặc cuộc thi được lựa chọn, chỉnh sửa theo nhận xét phản biện, và điều chỉnh cách trình bày kết quả cho cả người nghe chuyên môn và không chuyên."}]}, {"code": "F4", "name": {"en": "Engaging in a critical reading of primary
